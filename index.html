async function loadUsageHistory(silent = true) {
  try {
    const cacheBust = Date.now();
    const [historyRes, sfaRes] = await Promise.all([
      fetch(`${FB_URL}${FB_PATH}/history.json?_=` + cacheBust),
      fetch(`${FB_URL}${SFA_ACTUAL_HISTORY_PATH}.json?_=` + cacheBust)
    ]);
    if (!historyRes.ok) {
      if (!silent) toast('일사용 분석 기록을 불러오지 못했습니다');
      console.warn('[usageAnalysis] HTTP', historyRes.status);
      return;
    }
    usageHistory = await historyRes.json() || {};
    sfaActualHistory = sfaRes.ok ? (await sfaRes.json() || {}) : {};
    touchUsageHistoryRevision();
    touchSfaActualHistoryRevision();
    recomputeUsageAnalysis();
    updateAllDailyAnalysisCells();
    if (sfaCompareVisible && sfaActiveTab === 'alias') renderSfaAnalysisTab(lastSfaCompareData);
    if (lastSfaCompareData && (viewMode === 'output' || document.querySelector('.inline-alias-correction'))) render();

    console.warn('[usageAnalysis] load failed', e);
    if (!silent) toast('일사용 분석 기록 오류');
  }
}

    return buildSfaAnalysisPayloadState(null);
  }
  const state = buildSfaAnalysisPayloadState(data);
  lastSfaResultAppliedAt = Date.now();
  renderSfaComparePanel(data);
  render();
  pushDebugLog(`엑셀 결과 최신 입력/별명/환산 재적용: ${reason}`, 'debug', lastSfaResultAppliedAt);
  return state;
}

function waitForSaveIdle(timeoutMs = 10000) {
  const started = Date.now();
  return new Promise(resolve => {
    const check = () => {
      if (!saveInFlight && !autoSaveTimer) {
        resolve(!localDirty);
        return;
      }
      if (Date.now() - started >= timeoutMs) {
        resolve(false);
        return;
      }
      setTimeout(check, 150);
    };
    check();
  });
}

async function flushCurrentBeforeSfaAnalysisRequest() {
  if (autoSaveTimer) {
    clearTimeout(autoSaveTimer);
    autoSaveTimer = null;
  }
  if (saveInFlight) {
    pendingSave = true;
    pendingSaveReason = 'sfaAnalysis';
    return waitForSaveIdle();
  }
  if (!localDirty) return true;
  await saveToFB('sfaAnalysis');
  return !localDirty;
}

function normalizeSiteItemName(text) {
  return String(text || '')
    .toUpperCase()
    .replace(/\([^)]*\)/g, '')
    .replace(/\[[^\]]*\]/g, '')
    .replace(/^(냉동|배달소스|비닐)-/, '')
    .replace(/[ㆍ·]/g, '')
    .replace(/[^0-9A-Z가-힣]+/g, '');
}

function siteSizeMarkers(text) {
  return new Set(Array.from(String(text || '').matchAll(/\((대|중|소)\)/g)).map(match => match[1]));
}

function siteVariantMarkers(text) {
  const raw = String(text || '').toUpperCase();
  const markers = new Set(Array.from(raw.matchAll(/(\d+(?:\.\d+)?)\s*G\b/g)).map(match => `${parseInt(match[1], 10)}G`));
  if (raw.includes('벌크')) markers.add('BULK');
  if (raw.includes('배달용') || raw.includes('전송용')) markers.add('DELIVERY');
  if (raw.includes('내점용')) markers.add('DINEIN');
  return markers;
}

function setsDisjoint(left, right) {
  if (!left.size || !right.size) return false;
  for (const value of left) {
    if (right.has(value)) return false;
  }
  return true;
}

function bigramSet(text) {
  const chars = Array.from(text || '');
  if (chars.length <= 1) return new Set(chars);
  const out = new Set();
  for (let i = 0; i < chars.length - 1; i++) out.add(chars[i] + chars[i + 1]);
  return out;
}

function diceScore(leftText, rightText) {
  const left = bigramSet(leftText);
  const right = bigramSet(rightText);
  if (!left.size || !right.size) return 0;
  let hit = 0;
  left.forEach(piece => { if (right.has(piece)) hit += 1; });
  return (2 * hit) / (left.size + right.size);
}

function scoreSiteToMaster(siteName, masterName) {
  if (setsDisjoint(siteSizeMarkers(siteName), siteSizeMarkers(masterName))) return 0;
  if (setsDisjoint(siteVariantMarkers(siteName), siteVariantMarkers(masterName))) return 0;
  const left = normalizeSiteItemName(siteName);
  const right = normalizeSiteItemName(masterName);
  if (!left || !right) return 0;
  if (left === right) return 1;
  if (left.includes(right) || right.includes(left)) return 0.93;
  const dice = diceScore(left, right);
  const leftCore = left.replace(/(BBQ|치킨|소스|냉동|박스|BOX|BON|EA)/g, '');
  const rightCore = right.replace(/(BBQ|치킨|소스|냉동|박스|BOX|BON|EA)/g, '');
  const core = diceScore(leftCore, rightCore);
  return Math.max(dice, core * 0.96);
}

function siteItemName(row) {

function siteItemUnit(row) {

function siteItemQty(row) {
  const n = Number(row?.sfa_qty ?? row?.qty ?? row?.expected_qty ?? 0);
  return Number.isFinite(n) ? n : 0;
}

function siteRowsFromSfaData(data) {
  const seen = new Map();
  const rows = [];
  const push = row => {
    const name = siteItemName(row);
    if (!name) return;
    const unit = siteItemUnit(row);
    const key = orderSiteItemKey(row);
    const qty = siteItemQty(row);
    const amount = siteItemAmount(row);
    const existing = seen.get(key);
    if (existing) {
      existing.qty = Math.round((Number(existing.qty || 0) + qty) * 1000) / 1000;
      existing.sfa_qty = existing.qty;
      existing._rowCount += 1;
      if (row.row_index !== undefined && row.row_index !== null) existing._rowIndexes.push(row.row_index);
      if (amount !== null) {
        const currentAmount = Number(existing.amount || 0) || 0;
        existing.amount = Math.round((currentAmount + amount) * 100) / 100;
        existing.sfa_amount = existing.amount;
      }
      if ((existing.row_index === null || existing.row_index === undefined) && row.row_index !== undefined && row.row_index !== null) existing.row_index = row.row_index;
      return;
    }
    const next = {
      name,
      unit,
      qty,
      sfa_qty: qty,
      amount,
      sfa_amount: amount,
      row_index: row.row_index ?? null,
      source_name: String(row.source_name || name).trim(),
      _siteKey: key,
      _rowCount: 1,
      _rowIndexes: row.row_index !== undefined && row.row_index !== null ? [row.row_index] : []
    };
    seen.set(key, next);
    rows.push(next);
  };
  (Array.isArray(data?.items) ? data.items : []).forEach(push);
  const comp = data?.comparison || {};
  (comp.matched || []).forEach(row => push({ name: row.sfa_name, qty: row.sfa_qty, unit: row.sfa_unit, amount: row.sfa_amount, row_index: row.row_index }));
  (comp.extra || []).forEach(push);
  return rows;
}

function comparisonRowLookup(data) {
  const byIndex = new Map();
  const byKey = new Map();
  (data?.comparison?.matched || []).forEach(row => {
    if (row.row_index !== undefined && row.row_index !== null) byIndex.set(String(row.row_index), row);
    byKey.set(orderSiteItemKey({ name: row.sfa_name, unit: row.sfa_unit }), row);
  });
  return { byIndex, byKey };
}

    .slice(0, limit);
}

function addActualOrderCandidate(map, row, source, details = {}) {
  const actualName = actualOrderItemName(row);
  if (!actualName) return;
  const actualUnit = actualOrderItemUnit(row);
  const key = actualOrderCandidateKey(actualName, actualUnit);
  const current = map.get(key) || {
    actualKey: key,
    actualName,
    actualUnit,
    qtyTotal: 0,
    amountTotal: 0,
    evidenceCount: 0,
    sources: new Set(),
    expectedNames: new Set(),
    dates: new Set(),
    matchScore: 0
  };
  const qty = Number(row?.sfa_qty ?? row?.siteQty ?? row?.qty ?? details.qty ?? 0);
  const amount = siteItemAmount(row) || Number(details.amount || 0) || 0;
  if (Number.isFinite(qty) && qty > 0) current.qtyTotal += qty;
  if (Number.isFinite(amount) && amount > 0) current.amountTotal += amount;
  current.evidenceCount += 1;
  if (source) current.sources.add(source);
  const expectedName = canonicalItemName(details.expectedName || row?.expected_name || '');
  if (expectedName && knownItemNameSet().has(expectedName)) current.expectedNames.add(expectedName);
  const dateKey = normalizeHistoryDateKey(details.dateKey || row?.orderDateKey || row?.orderDate || '');
  if (dateKey) current.dates.add(dateKey);
  const score = Number(details.score ?? row?.score ?? 0);
  if (Number.isFinite(score) && score > current.matchScore) current.matchScore = score;
  map.set(key, current);
}

let cachedActualCandidateKey = '';
let cachedActualCandidates = [];

function actualCandidateCacheKey(data = lastSfaCompareData) {
  return [
    compareDataRevision,
    sfaActualHistoryRevision

}

function collectActualOrderCandidates(data = lastSfaCompareData) {
  const cacheKey = actualCandidateCacheKey(data);
  if (cachedActualCandidateKey === cacheKey) return cachedActualCandidates;
  const map = new Map();
  const latestSource = data?.file?.name === '수동 입력' ? '수동입력' : '최근SFA';
  siteRowsFromSfaData(data).forEach(row => addActualOrderCandidate(map, row, latestSource, {
    dateKey: data?.historySummary?.selectedDate
  }));
  (data?.comparison?.matched || []).forEach(row => addActualOrderCandidate(map, {
    name: row.sfa_name,
    qty: row.sfa_qty,
    unit: row.sfa_unit,
    amount: row.sfa_amount,
    row_index: row.row_index
  }, '비교행', {
    expectedName: row.expected_name,
    score: row.score,
    dateKey: data?.historySummary?.selectedDate
  }));
  Object.entries(sfaActualHistory || {}).forEach(([key, record]) => {
    if (!record || typeof record !== 'object') return;
    const dateKey = normalizeHistoryDateKey(record.orderDateKey || record.orderDate || key);
    (Array.isArray(record.rows) ? record.rows : []).forEach(row => addActualOrderCandidate(map, row, '실발주이력', {
      expectedName: row.expected_name,
      score: row.score,
      dateKey
    }));
    Object.entries(record.actualOrders || {}).forEach(([name, qty]) => addActualOrderCandidate(map, {
      name,
      qty,
      unit: ''
    }, '실발주키', { expectedName: name, dateKey }));
  });
  cachedActualCandidates = Array.from(map.values()).map(row => ({
    ...row,
    sources: Array.from(row.sources),
    expectedNames: Array.from(row.expectedNames),
    dates: Array.from(row.dates).sort()
  })).sort((a, b) => b.evidenceCount - a.evidenceCount || a.actualName.localeCompare(b.actualName, 'ko', { numeric: true }));
  cachedActualCandidateKey = cacheKey;
  return cachedActualCandidates;
}

function aliasCandidateReason(candidate) {
  if (!candidate) return '후보 없음';
  return [
    candidate.sources?.join('/') || '',
    candidate.evidenceCount ? `근거 ${candidate.evidenceCount}건` : '',
    candidate.qtyTotal ? `수량 ${fmt(candidate.qtyTotal, 1)}` : '',
    candidate.dates?.length ? candidate.dates.slice(-2).join(',') : '',
    candidate.expectedNames?.length ? `기존 ${candidate.expectedNames.slice(0, 2).join(',')}` : ''
  ].filter(Boolean).join(' · ');
}

function bestActualCandidatesForAlias(aliasName, candidates = collectActualOrderCandidates(), limit = 5) {
  const canonicalAlias = canonicalItemName(aliasName || '');
  return candidates.map(candidate => {
    const knownExpected = candidate.expectedNames?.includes(canonicalAlias);
    const score = knownExpected
      ? Math.max(0.98, Number(candidate.matchScore || 0))
      : scoreSiteToMaster(candidate.actualName, canonicalAlias);
    return { ...candidate, score, reason: aliasCandidateReason(candidate) };
  })
    .filter(candidate => candidate.score >= 0.45 || candidate.expectedNames?.includes(canonicalAlias))
    .sort((a, b) => b.score - a.score || b.evidenceCount - a.evidenceCount || a.actualName.localeCompare(b.actualName, 'ko', { numeric: true }))
    .slice(0, limit);
}

function usageEstimateFromRecord(record, name) {
  const row = calcRowFromRecord(record, name) || {};
  const stockFromMap = record?.stockMap?.has(name) ? Number(record.stockMap.get(name)) : NaN;
  const stockFromRow = Number(row.stock ?? row.checkedStock ?? row.checked_stock ?? row.stock_qty);
  const checkedStockQty = Number.isFinite(stockFromMap) ? stockFromMap : stockFromRow;
  const directNeed = Number(row.stockNeed ?? row.expected_stock_need ?? row.stock_need);
  if (Number.isFinite(directNeed) && directNeed > 0) {
    const neededOrExpectedQty = Number.isFinite(checkedStockQty) ? checkedStockQty + directNeed : directNeed;
    return {
      usageEstimate: directNeed,
      neededOrExpectedQty,
      checkedStockQty: Number.isFinite(checkedStockQty) ? checkedStockQty : null,
      basis: 'stockNeed'
    };
  }
  const neededOrExpectedQty = Number(
    row.neededOrExpectedQty ??
    row.neededStockQty ??
    row.expectedStockQty ??
    row.requiredStockQty ??
    row.targetStockQty ??
    row.targetStock ??
    row.neededStock ??
    row.expectedQty
  );
  if (!Number.isFinite(neededOrExpectedQty) || !Number.isFinite(checkedStockQty)) return null;
  return {
    usageEstimate: neededOrExpectedQty - checkedStockQty,
    neededOrExpectedQty,
    checkedStockQty,
    basis: 'expectedMinusStock'
  };
}

function actualOrderQtyForUsageDate(dateKey, item, actualNameKeys, data = lastSfaCompareData) {
  const targetDate = normalizeHistoryDateKey(dateKey);
  if (!targetDate) return null;
  let qty = 0;
  let rows = 0;
  const sources = new Set();
  const seen = new Set();
  const acceptsRow = (row, source, fallbackDate = '') => {
    const rowDate = normalizeHistoryDateKey(row?.orderDateKey || row?.orderDate || fallbackDate);
    if (rowDate && rowDate !== targetDate) return;
    const actualName = actualOrderItemName(row);
    const actualKey = actualNameKeyForUsage(actualName);
    const expectedName = canonicalItemName(row?.expected_name || row?.expectedName || '');
    if (expectedName !== item.name && (!actualKey || !actualNameKeys.has(actualKey))) return;
    const n = Number(row?.sfa_qty ?? row?.siteQty ?? row?.qty ?? row?.actualQty ?? 0);
    if (!Number.isFinite(n) || n <= 0) return;
    const key = `${source}|${targetDate}|${expectedName}|${actualKey}|${n}`;
    if (seen.has(key)) return;
    seen.add(key);
    qty += n;
    rows += 1;
    sources.add(source);
  };

  Object.entries(sfaActualHistory || {}).forEach(([key, record]) => {
    if (!record || typeof record !== 'object' || key === 'latest') return;
    const recordDate = normalizeHistoryDateKey(record.orderDateKey || record.orderDate || key);
    if (recordDate !== targetDate) return;
    (Array.isArray(record.rows) ? record.rows : []).forEach(row => acceptsRow(row, '실발주이력', recordDate));
    Object.entries(record.actualOrders || {}).forEach(([name, value]) => {
      const actualKey = actualNameKeyForUsage(name);
      if (canonicalItemName(name) !== item.name && (!actualKey || !actualNameKeys.has(actualKey))) return;
      acceptsRow({ name, qty: value, expected_name: item.name, orderDateKey: recordDate }, '실발주키', recordDate);
    });
  });

  const dataDate = normalizeHistoryDateKey(data?.historySummary?.selectedDate);
  if (dataDate === targetDate) {
    (data?.comparison?.matched || []).forEach(row => acceptsRow(row, '최근비교', dataDate));
    siteRowsFromSfaData(data).forEach(row => acceptsRow(row, '최근SFA', dataDate));
  }

  return qty > 0 ? { qty, rows, sources: Array.from(sources) } : null;
}

function summarizeUsageConversionSamples(samples, skipped = 0) {
  const clean = samples.filter(sample => Number.isFinite(sample.factor) && sample.factor > 0).sort((a, b) => a.factor - b.factor);
  if (!clean.length) return null;
  let kept = clean;
  if (clean.length >= 4) {
    const q1 = clean[Math.floor((clean.length - 1) * 0.25)].factor;
    const q3 = clean[Math.floor((clean.length - 1) * 0.75)].factor;
    const iqr = q3 - q1;
    const low = iqr > 0 ? q1 - (1.5 * iqr) : q1 * 0.5;
    const high = iqr > 0 ? q3 + (1.5 * iqr) : q3 * 1.5;
    kept = clean.filter(sample => sample.factor >= low && sample.factor <= high);
    if (!kept.length) kept = clean;
  }
  const summary = summarizeFactors(kept.map(sample => sample.factor));
  if (!summary) return null;
  const dates = kept.map(sample => sample.dateKey).filter(Boolean).sort();
  const skippedTotal = skipped + (clean.length - kept.length);
  return {
    ...summary,
    source: 'usage',
    totalSamples: clean.length,
    skipped: skippedTotal,
    dateStart: dates[0] || '',
    dateEnd: dates[dates.length - 1] || '',
    examples: kept.slice(-2)
  };
}

function usageConversionScore(summary) {
  if (!summary) return 0;
  let score = 0.7 + (Math.min(Number(summary.samples || 0), 5) * 0.045);
  const spread = Number(summary.spread || 999);
  if (summary.samples >= 2 && spread <= 1.5) score += 0.04;
  if (summary.samples >= 3 && spread <= 1.25) score += 0.05;
  if (summary.samples >= 3 && spread <= 1.1) score += 0.03;
  if (summary.skipped) score -= Math.min(0.08, summary.skipped * 0.015);
  return Math.max(0.55, Math.min(0.97, score));
}

function usageConversionReason(summary) {
  if (!summary) return '';
  const range = summary.dateStart && summary.dateEnd ? `${summary.dateStart}~${summary.dateEnd}` : '날짜미상';
  const skipped = ` · 제외 ${summary.skipped || 0}건`;
  return `실사용량 비교 ${summary.samples}건 ${range} · ${conversionDirectionText(summary.factor)} · 예: 체크 10개=발주 1박스이면 10 · 편차 ${fmt(summary.spread || 1, 2)}${skipped}`;
}

function usageBasedConversionCandidateForAlias(item, data = lastSfaCompareData, records = null) {
  records = records || historyRecordsWithCurrent(usageHistory, currentAnalysisSnapshot());
  if (!records.length) return null;
  const actualNameKeys = new Set();
  const saved = orderAliasMappings[item.name];
  if (saved?.actualName) actualNameKeys.add(actualNameKeyForUsage(saved.actualName));
  bestActualCandidatesForAlias(item.name, collectActualOrderCandidates(data), 8)
    .forEach(candidate => actualNameKeys.add(actualNameKeyForUsage(candidate.actualName)));
  let skipped = 0;
  const samples = [];
  records.forEach(record => {
    const usage = usageEstimateFromRecord(record, item.name);
    if (!usage || !Number.isFinite(usage.usageEstimate) || usage.usageEstimate <= 0) {
      skipped += 1;
      return;
    }
    const actual = actualOrderQtyForUsageDate(record.dateKey, item, actualNameKeys, data);
    if (!actual?.qty) {
      skipped += 1;
      return;
    }
    const factor = usage.usageEstimate / actual.qty;
    if (!Number.isFinite(factor) || factor <= 0 || factor > 500) {
      skipped += 1;
      return;
    }
    samples.push({
      dateKey: record.dateKey,
      factor,
      usageEstimate: usage.usageEstimate,
      actualQty: actual.qty,
      checkedStockQty: usage.checkedStockQty,
      neededOrExpectedQty: usage.neededOrExpectedQty,
      basis: usage.basis,
      sources: actual.sources
    });
  });
  const summary = summarizeUsageConversionSamples(samples, skipped);
  if (!summary) return null;
  return {
    factor: summary.factor,
    source: 'usage',
    score: usageConversionScore(summary),
    reason: usageConversionReason(summary),
    summary
  };
}

function addConversionCandidate(map, factor, source, score, reason = '') {
  const clean = normalizeConversionFactor(factor);
  if (!clean) return;
  const key = String(clean);
  const current = map.get(key);
  const row = {
    factor: clean,
    source,
    score: Number.isFinite(Number(score)) ? Number(score) : 0,
    reason: reason || `${conversionSourceLabel(source)} 기준`
  };
  if (!current || row.score > current.score) map.set(key, row);
}

function conversionCandidatesForAlias(item, data = lastSfaCompareData, usageRecords = null) {
  const map = new Map();
  const saved = orderAliasMappings[item.name];
  if (saved?.conversionFactor) {
    addConversionCandidate(map, saved.conversionFactor, 'saved', 1, saved.conversionReason || '저장된 환산값');
  }
  const manualFactor = manualUnitFactorForItem(item);
  if (manualFactor) {
    addConversionCandidate(map, manualFactor, 'manualUnit', 0.99, '단위 보정 탭 사용자 환산값');
  }
  (data?.comparison?.matched || []).forEach(row => {
    const expectedName = canonicalItemName(row?.expected_name || '');
    if (expectedName !== item.name) return;
    const stockNeed = Number(row?.expected_stock_need);
    const sfaQty = Number(row?.sfa_qty);
    if (!Number.isFinite(stockNeed) || stockNeed <= 0 || !Number.isFinite(sfaQty) || sfaQty <= 0) return;
    const score = Math.max(0.6, Number(row?.score || 0));
    addConversionCandidate(map, stockNeed / sfaQty, 'compare', score, `앱 체크필요 ${fmt(stockNeed, 2)} / 실발주 ${fmt(sfaQty, 2)}`);
  });
  const usageCandidate = usageBasedConversionCandidateForAlias(item, data, usageRecords);
  if (usageCandidate) {
    addConversionCandidate(map, usageCandidate.factor, usageCandidate.source, usageCandidate.score, usageCandidate.reason);
  }
  const analysis = conversionAnalysis[item.name];
  if (analysis?.factor) {
    const scoreBySource = { movement: 0.92, item: 0.86, unit: 0.76, same: 0.7 };
    const source = analysis.source || 'analysis';
    const reason = [
      `${conversionSourceLabel(source)} ${analysis.samples || 0}건`,
      analysis.spread ? `편차 ${fmt(analysis.spread, 2)}` : ''
    ].filter(Boolean).join(' · ');
    addConversionCandidate(map, analysis.factor, source, scoreBySource[source] || 0.68, reason);
  }
  if (orderUnitParts(item).same) {
    addConversionCandidate(map, 1, 'same', 0.66, '체크단위와 발주단위가 같음');
  }
  return Array.from(map.values())
    .sort((a, b) => b.score - a.score || a.factor - b.factor)
    .slice(0, 5);
}

function conversionCandidateReason(candidate) {
  if (!candidate) return '환산 후보 없음';
  return `${conversionSourceLabel(candidate.source)} · ${conversionDirectionText(candidate.factor)} · ${Math.round((candidate.score || 0) * 100)}%${candidate.reason ? ' · ' + candidate.reason : ''}`;
}

function isUserSelectedAliasStatus(status) {
  return status === 'confirmed' || status === 'manual';
}

function candidatePayload(candidate) {
  if (!candidate) return null;
  return {
    actualName: candidate.actualName || '',
    actualUnit: candidate.actualUnit || '',
    score: Math.round((candidate.score || 0) * 1000) / 1000,
    reason: candidate.reason || ''
  };
}

function conversionCandidatePayload(candidate) {
  if (!candidate) return null;
  return {
    factor: candidate.factor,
    orderUnitToStockFactor: candidate.factor,
    factorMeaning: 'orderUnitToStockFactor: 발주 1단위가 체크/재고 몇 단위인지',
    source: candidate.source,
    score: Math.round((candidate.score || 0) * 1000) / 1000,
    reason: candidate.reason || ''
  };
}

let cachedAliasMatchKey = '';
let cachedAliasMatches = [];

function aliasMatchCacheKey(data = lastSfaCompareData) {
  return [
    compareDataRevision,
    currentStateRevision,
    usageHistoryRevision,
    sfaActualHistoryRevision
  ].join('|');
}

function buildOrderAliasMatches(data = lastSfaCompareData) {
  const cacheKey = aliasMatchCacheKey(data);
  if (cachedAliasMatchKey === cacheKey) return cachedAliasMatches;
  const actualCandidates = collectActualOrderCandidates(data);
  const usageRecords = historyRecordsWithCurrent(usageHistory, currentAnalysisSnapshot());
  const rows = MASTER.slice().sort(defaultOutputCompare).map(item => {
    const aliasName = item.name;
    const saved = orderAliasMappings[aliasName];
    const candidates = bestActualCandidatesForAlias(aliasName, actualCandidates);
    const conversionCandidates = conversionCandidatesForAlias(item, data, usageRecords);
    const savedActualLocked = Boolean(saved?.actualName && isUserSelectedAliasStatus(saved.status || 'confirmed'));
    const selectedCandidate = savedActualLocked
      ? actualCandidates.find(candidate => candidate.actualName === saved.actualName) || null
      : null;
    const defaultCandidate = candidates[0] || null;
    const conversionDefault = conversionCandidates.find(candidate => candidate.source !== 'saved') || conversionCandidates[0] || null;
    const savedConversionFactor = normalizeConversionFactor(saved?.conversionFactor);
    const savedConversionLocked = Boolean(savedConversionFactor && isUserSelectedAliasStatus(saved?.conversionStatus || ''));
    const actualName = savedActualLocked ? saved.actualName : (defaultCandidate?.actualName || '');
    const actualUnit = savedActualLocked
      ? (saved.actualUnit || selectedCandidate?.actualUnit || '')
      : (defaultCandidate?.actualUnit || '');
    const score = savedActualLocked ? Number(saved.score || 1) : Number(defaultCandidate?.score || 0);
    const status = savedActualLocked ? (saved.status || 'confirmed') : (defaultCandidate ? 'default' : 'unmatched');
    const conversionFactor = savedConversionLocked ? savedConversionFactor : (conversionDefault?.factor || null);
    const conversionStatus = savedConversionLocked ? (saved.conversionStatus || 'confirmed') : (conversionDefault ? 'default' : 'unmatched');
    return {
      aliasName,
      aliasUnit: item.unit || '',
      actualName,
      actualUnit,
      savedActualName: savedActualLocked ? saved.actualName : '',
      savedActualUnit: savedActualLocked ? (saved.actualUnit || '') : '',
      defaultActualName: defaultCandidate?.actualName || '',
      defaultActualUnit: defaultCandidate?.actualUnit || '',
      defaultCandidate,
      effectiveActualName: actualName,
      effectiveActualUnit: actualUnit,
      score,
      source: savedActualLocked ? 'user' : (defaultCandidate ? 'default' : 'suggested'),
      status,
      conversionFactor,
      conversionStatus,
      savedConversionFactor: savedConversionLocked ? savedConversionFactor : null,
      defaultConversionFactor: conversionDefault?.factor || null,
      effectiveConversionFactor: conversionFactor,
      effectiveConversionStatus: conversionStatus,
      conversionCandidates,
      conversionDefault,
      conversionReason: savedConversionLocked ? (saved?.conversionReason || conversionCandidateReason(conversionDefault)) : conversionCandidateReason(conversionDefault),
      candidates,
      suggested: defaultCandidate,
      reason: (savedActualLocked ? saved?.reason : '') || defaultCandidate?.reason || '실발주 후보 없음'
    };
  });
  const selectedCounts = {};
  rows.forEach(row => {
    if (row.actualName && ['confirmed', 'manual'].includes(row.status)) selectedCounts[row.actualName] = (selectedCounts[row.actualName] || 0) + 1;
  });
  rows.forEach(row => {
    if (row.actualName && ['confirmed', 'manual'].includes(row.status) && selectedCounts[row.actualName] > 1) row.status = 'conflict';
  });
  cachedAliasMatches = rows.sort((a, b) => {
    const order = { conflict: 0, unmatched: 1, default: 2, candidate: 2, confirmed: 3, manual: 3 };
    return (order[a.status] ?? 9) - (order[b.status] ?? 9) || defaultOutputCompare({ name: a.aliasName }, { name: b.aliasName });
  });
  cachedAliasMatchKey = cacheKey;
  return cachedAliasMatches;
}

function orderAliasMappingDraftsForPayload(data = lastSfaCompareData) {
  return buildOrderAliasMatches(data).map(row => ({
    aliasName: row.aliasName,
    aliasUnit: row.aliasUnit,
    actualName: row.effectiveActualName || '',
    actualUnit: row.effectiveActualUnit || '',
    savedActualName: row.savedActualName || '',
    savedActualUnit: row.savedActualUnit || '',
    defaultActualName: row.defaultActualName || '',
    defaultActualUnit: row.defaultActualUnit || '',
    defaultCandidate: candidatePayload(row.defaultCandidate),
    effectiveActualName: row.effectiveActualName || '',
    effectiveActualUnit: row.effectiveActualUnit || '',
    status: row.status,
    effectiveStatus: row.status,
    score: Math.round((row.score || 0) * 1000) / 1000,
    reason: row.reason || '',
    conversionFactor: row.conversionFactor || null,
    orderUnitToStockFactor: row.conversionFactor || null,
    conversionFactorMeaning: '발주 1단위가 체크/재고 몇 단위인지',
    conversionStatus: row.conversionStatus,
    savedConversionFactor: row.savedConversionFactor || null,
    defaultConversionFactor: row.defaultConversionFactor || null,
    defaultOrderUnitToStockFactor: row.defaultConversionFactor || null,
    defaultConversionCandidate: conversionCandidatePayload(row.conversionDefault),
    effectiveConversionFactor: row.effectiveConversionFactor || null,
    effectiveOrderUnitToStockFactor: row.effectiveConversionFactor || null,
    effectiveConversionStatus: row.effectiveConversionStatus,
    conversionScore: Math.round(((row.conversionDefault?.score) || 0) * 1000) / 1000,
    conversionReason: row.conversionReason || '',
    conversionCandidates: row.conversionCandidates.map(conversionCandidatePayload),
    actualCandidates: row.candidates.map(candidatePayload)
  }));
}

function effectiveOrderAliasMappingsForPayload(data = lastSfaCompareData) {
  const out = {};
  buildOrderAliasMatches(data).forEach(row => {
    if (!row.effectiveActualName) return;
    out[row.aliasName] = {
      aliasName: row.aliasName,
      aliasUnit: row.aliasUnit,
      actualName: row.effectiveActualName,
      actualUnit: row.effectiveActualUnit,
      status: row.status,
      source: row.source,
      score: Math.round((row.score || 0) * 1000) / 1000,
      defaultActualName: row.defaultActualName || '',
      confirmedActualName: row.savedActualName || '',
      conversionFactor: row.effectiveConversionFactor || null,
      orderUnitToStockFactor: row.effectiveConversionFactor || null,
      conversionFactorMeaning: '발주 1단위가 체크/재고 몇 단위인지',
      conversionStatus: row.effectiveConversionStatus,
      defaultConversionFactor: row.defaultConversionFactor || null,
      defaultOrderUnitToStockFactor: row.defaultConversionFactor || null,
      confirmedConversionFactor: row.savedConversionFactor || null,
      reason: row.reason || '',
      conversionReason: row.conversionReason || ''
    };
  });
  return out;
}

function buildOrderSiteMatches(data = lastSfaCompareData) {
  const rows = siteRowsFromSfaData(data);
  const lookup = comparisonRowLookup(data);
  const out = rows.map(row => {
    const siteKey = row._siteKey || orderSiteItemKey(row);
    const correction = orderSiteMappings[siteKey];
    const compareRow = (Array.isArray(row._rowIndexes) ? row._rowIndexes : [row.row_index])
      .map(index => (index !== undefined && index !== null) ? lookup.byIndex.get(String(index)) : null)
      .find(Boolean) || lookup.byKey.get(siteKey);
    const candidates = bestMasterCandidatesForSite(row);
    let targetName = '';
    let score = 0;
    let source = 'none';
    if (correction?.targetName) {
      targetName = correction.targetName;
      score = 1;
      source = 'user';
    } else if (compareRow?.expected_name) {
      targetName = canonicalItemName(compareRow.expected_name);
      score = Number(compareRow.score || 0);
      source = 'analysis';
    } else if (candidates[0]?.score >= 0.84) {
      targetName = candidates[0].name;
      score = candidates[0].score;
      source = 'local';
    }
    let status = 'unmatched';
    if (targetName) status = source === 'user' || score >= 0.82 ? 'confirmed' : 'candidate';
    return {
      siteKey,
      siteName: siteItemName(row) || siteItemName(compareRow),
      siteUnit: siteItemUnit(row) || siteItemUnit(compareRow),
      siteQty: siteItemQty(row) || siteItemQty(compareRow),
      amount: siteItemAmount(row) || siteItemAmount(compareRow),
      targetName,
      targetUnit: MASTER.find(item => item.name === targetName)?.unit || '',
      score,
      source,
      status,
      candidates,
      compareRow
    };
  });
  const targetCounts = {};
  out.forEach(row => {
    if (row.targetName) targetCounts[row.targetName] = (targetCounts[row.targetName] || 0) + 1;
  });
  out.forEach(row => {
    if (row.targetName && targetCounts[row.targetName] > 1) row.status = 'conflict';
  });
  return out.sort((a, b) => {
    const order = { conflict: 0, unmatched: 1, candidate: 2, confirmed: 3 };
    return (order[a.status] ?? 9) - (order[b.status] ?? 9) || a.siteName.localeCompare(b.siteName, 'ko', { numeric: true });
  });
}

function sfaStatusText(status) {
  if (status === 'confirmed') return '확정';
  if (status === 'default') return '기본';
  if (status === 'candidate') return '후보';
  if (status === 'manual') return '수동';
  if (status === 'conflict') return '충돌';
  return '미매칭';
}

function conversionStatusText(status) {
  if (status === 'manual') return '직접';
  if (status === 'confirmed') return '확정';
  if (status === 'default') return '기본';
  if (status === 'candidate') return '후보';
  return '미확정';
}

  if (row.actualName && !optionByName.has(row.actualName)) {
    optionByName.set(row.actualName, {
      actualName: row.actualName,
      actualUnit: row.actualUnit,
      score: 1,
      reason: '저장된 확정값'
    });

  const options = ['<option value="">미확정</option>'].concat(Array.from(optionByName.values()).map(candidate => {

    return `<option value="${escapeHtml(candidate.actualName)}"${selected}>${escapeHtml(candidate.actualName + unitText + scoreText)}</option>`;
  }));
  return options.join('');
}

    : candidateText;
  return `<div class="sfa-match-row ${row.status}">
    <div class="sfa-match-status">${sfaStatusText(row.status)}</div>
    <div>
      <div class="sfa-match-name">${escapeHtml(row.aliasName)}</div>
      <div class="sfa-match-meta">${escapeHtml(meta || '사용자사이트 별명')}</div>
    </div>
    <div class="sfa-alias-fields">${aliasActualSelectHtml(row)}${aliasConversionFieldsHtml(row)}</div>
    <div class="sfa-match-meta">${escapeHtml(actualText)}<br>${escapeHtml(row.reason || '')}<br>${escapeHtml(row.conversionReason || '')}</div>
  </div>`;
}

function expectedMissingRows(data) {
  return (data?.comparison?.missing || []).map(row => ({
    name: row.expected_name || row.name || '',
    qty: row.expected_qty ?? row.qty ?? 0,
    unit: row.expected_unit || row.unit || '',
    reason: row.reason || '사이트 행 없음'
  })).filter(row => row.name);
}

function unitCorrectionRows(data = lastSfaCompareData) {
  const names = new Set();
  MASTER.forEach(item => {
    const parts = orderUnitParts(item);
    const analysis = conversionAnalysis[item.name];
    if (!parts.same || hasManualUnitCorrection(item.name) || (analysis && analysis.source !== 'same')) names.add(item.name);
  });
  (data?.comparison?.matched || []).forEach(row => {
    const name = canonicalItemName(row.expected_name || '');
    if (name && knownItemNameSet().has(name)) names.add(name);
  });
  return MASTER.filter(item => names.has(item.name)).sort(defaultOutputCompare);
}

function unitSourceText(item) {
  const manual = unitCorrectionForItem(item.name);
  if (hasManualUnitCorrection(item.name)) return '사용자';
  const analysis = conversionAnalysis[item.name];
  if (analysis?.source === 'movement') return '재고추정';
  if (analysis?.source === 'item') return '품목기록';
  if (analysis?.source === 'unit') return '단위패턴';
  if (orderUnitParts(item).same) return '동일';
  return '미확인';
}

function unitCorrectionRowHtml(item) {
  const parts = orderUnitParts(item);
  const correction = unitCorrectionForItem(item.name);
  const analysis = conversionAnalysis[item.name] || {};

  const meta = [
    `체크 ${parts.checkUnit || '-'}`,
    `발주 ${parts.orderUnit || '-'}`,
    analysis.samples ? `분석 ${analysis.samples}건` : '',
    analysis.spread ? `편차 ${fmt(analysis.spread, 2)}` : ''
  ].filter(Boolean).join(' · ');
  return `<div class="sfa-match-row ${hasManualUnitCorrection(item.name) ? 'confirmed' : (parts.same ? 'candidate' : 'unmatched')}">
    <div class="sfa-match-status">${escapeHtml(unitSourceText(item))}</div>

      <label>환산<input class="sfa-edit sfa-unit-input" type="number" inputmode="decimal" step="0.1" data-unit-name="${escapeHtml(item.name)}" data-unit-field="factor" value="${escapeHtml(correction.factor ?? '')}" placeholder="${escapeHtml(factorPlaceholder)}"></label>
      <label>묶음<input class="sfa-edit sfa-unit-input" type="number" inputmode="decimal" step="0.1" data-unit-name="${escapeHtml(item.name)}" data-unit-field="orderMultiple" value="${escapeHtml(correction.orderMultiple ?? '')}" placeholder="1"></label>
      <label>최소<input class="sfa-edit sfa-unit-input" type="number" inputmode="decimal" step="0.1" data-unit-name="${escapeHtml(item.name)}" data-unit-field="minOrderQty" value="${escapeHtml(correction.minOrderQty ?? '')}" placeholder=""></label>

function setOrderSiteMapping(siteKey, targetName, siteName = '', siteUnit = '') {
  if (!siteKey) return;
  const known = knownItemNameSet();
  const nextTarget = canonicalItemName(targetName || '');
  if (!nextTarget || !known.has(nextTarget)) {
    delete orderSiteMappings[siteKey];
  } else {
    orderSiteMappings[siteKey] = { targetName: nextTarget, siteName, siteUnit, updatedAt: Date.now() };
  }
  orderSiteMappings = sanitizeOrderSiteMappings(orderSiteMappings);
  touchCurrentStateRevision();
  persistOrderCorrections('mapping');
}

function setOrderAliasMapping(aliasName, actualName) {
  const itemName = canonicalItemName(aliasName || '');
  if (!knownItemNameSet().has(itemName)) return;
  const nextActual = String(actualName || '').trim();
  if (!nextActual) {
    delete orderAliasMappings[itemName];
  } else {
    const currentRow = buildOrderAliasMatches(lastSfaCompareData).find(row => row.aliasName === itemName);
    const candidate = currentRow?.candidates?.find(row => row.actualName === nextActual) ||
      collectActualOrderCandidates(lastSfaCompareData).find(row => row.actualName === nextActual);
    const conversionDefault = currentRow?.conversionDefault || currentRow?.conversionCandidates?.[0] || null;
    const existing = orderAliasMappings[itemName] || {};
    const conversionFactor = normalizeConversionFactor(existing.conversionFactor) || conversionDefault?.factor || null;
    const existingConversionLocked = Boolean(normalizeConversionFactor(existing.conversionFactor) && isUserSelectedAliasStatus(existing.conversionStatus));
    orderAliasMappings[itemName] = {
      aliasName: itemName,
      actualName: nextActual,
      actualUnit: candidate?.actualUnit || '',
      status: 'confirmed',
      source: 'user',
      score: Number(candidate?.score || 1),
      reason: candidate?.reason || '사용자 실발주항목 확정',
      ...(conversionFactor ? {
        conversionFactor,
        conversionStatus: existingConversionLocked ? existing.conversionStatus : 'default',
        conversionSource: existing.conversionSource || conversionDefault?.source || '',
        conversionScore: Number(existing.conversionScore || conversionDefault?.score || 0),
        conversionReason: existing.conversionReason || conversionCandidateReason(conversionDefault)
      } : {}),
      updatedAt: Date.now()
    };
  }
  orderAliasMappings = sanitizeOrderAliasMappings(orderAliasMappings);
  touchCurrentStateRevision();
  persistOrderCorrections('aliasMapping');
}

function setOrderAliasConversion(aliasName, value, mode = 'candidate') {
  const itemName = canonicalItemName(aliasName || '');
  if (!knownItemNameSet().has(itemName)) return;
  const factor = normalizeConversionFactor(value);
  const currentRow = buildOrderAliasMatches(lastSfaCompareData).find(row => row.aliasName === itemName);
  const existing = orderAliasMappings[itemName] || {};
  if (!factor) {
    if (!existing.actualName) return;
    const next = { ...existing };
    delete next.conversionFactor;
    delete next.conversionStatus;
    delete next.conversionSource;
    delete next.conversionScore;
    delete next.conversionReason;
    next.updatedAt = Date.now();
    if (isUserSelectedAliasStatus(next.status)) {
      orderAliasMappings[itemName] = next;
    } else {
      delete orderAliasMappings[itemName];
    }
    orderAliasMappings = sanitizeOrderAliasMappings(orderAliasMappings);
    touchCurrentStateRevision();
    persistOrderCorrections('aliasMapping');
    return;
  }
  const selectedConversion = currentRow?.conversionCandidates?.find(candidate => Math.abs(candidate.factor - factor) < 0.0005) || null;
  const existingActualLocked = Boolean(existing.actualName && isUserSelectedAliasStatus(existing.status));
  const actualCandidate = existingActualLocked
    ? currentRow?.candidates?.find(candidate => candidate.actualName === existing.actualName)
    : currentRow?.candidates?.find(candidate => candidate.actualName === currentRow?.effectiveActualName) || currentRow?.defaultCandidate || currentRow?.suggested;
  const actualName = existingActualLocked ? existing.actualName : (currentRow?.effectiveActualName || actualCandidate?.actualName || '');
  if (!actualName) return;
  orderAliasMappings[itemName] = {
    aliasName: itemName,
    actualName,
    actualUnit: existingActualLocked ? (existing.actualUnit || actualCandidate?.actualUnit || '') : (currentRow?.effectiveActualUnit || actualCandidate?.actualUnit || ''),
    status: existingActualLocked ? (existing.status || 'confirmed') : 'default',
    source: existingActualLocked ? (existing.source || 'user') : 'default',
    score: Number(existing.score || actualCandidate?.score || 0),
    reason: existing.reason || actualCandidate?.reason || '기본 실발주 후보',
    conversionFactor: factor,
    conversionStatus: mode === 'manual' ? 'manual' : 'confirmed',
    conversionSource: selectedConversion?.source || mode,
    conversionScore: Number(selectedConversion?.score || 0),
    conversionReason: selectedConversion ? conversionCandidateReason(selectedConversion) : '사용자 직접 입력',
    updatedAt: Date.now()
  };
  orderAliasMappings = sanitizeOrderAliasMappings(orderAliasMappings);
  touchCurrentStateRevision();
  persistOrderCorrections('aliasMapping');
}

function setOrderUnitCorrection(name, field, value) {
  const itemName = canonicalItemName(name || '');
  if (!knownItemNameSet().has(itemName)) return;
  const row = { ...(orderUnitCorrections[itemName] || {}) };
  if (field === 'packUnit') {
    const text = String(value || '').trim();
    if (text) row.packUnit = text;
    else delete row.packUnit;
  } else if (['factor', 'orderMultiple', 'minOrderQty'].includes(field)) {
    const num = sanitizePositiveNumber(value);
    if (num) row[field] = num;
    else delete row[field];
  } else {
    return;
  }
  row.updatedAt = Date.now();
  if (Object.keys(row).filter(key => key !== 'updatedAt').length) orderUnitCorrections[itemName] = row;
  else delete orderUnitCorrections[itemName];
  orderUnitCorrections = sanitizeOrderUnitCorrections(orderUnitCorrections);
  touchCurrentStateRevision();
  persistOrderCorrections('unitCorrection');
}

function manualSfaItemFromSource(row, idx) {
  if (Array.isArray(row)) {
    return {
      name: String(row[0] || '').trim(),
      qty: Number(row[1]) || 0,
      unit: String(row[2] || '').trim(),
      row_index: idx + 1,
      source_name: String(row[0] || '').trim()
    };
  }
  if (!row || typeof row !== 'object') return null;
  const name = String(row.name || row.sfa_name || row.siteName || row.source_name || '').trim();
  if (!name) return null;
  return {
    name,
    qty: Number(row.qty ?? row.sfa_qty ?? row.siteQty ?? row.expected_qty ?? 0) || 0,
    unit: String(row.unit || row.sfa_unit || row.siteUnit || row.expected_unit || '').trim(),
    row_index: row.row_index ?? idx + 1,
    source_name: String(row.source_name || row.sfa_name || row.siteName || name).trim()
  };
}

function parseManualSfaItemsText(text) {
  const raw = String(text || '').trim();
  if (!raw) return [];
  if (/^[\[{]/.test(raw)) {
    try {
      const parsed = JSON.parse(raw);
      const rows = Array.isArray(parsed)
        ? parsed
        : (Array.isArray(parsed.items) ? parsed.items : (Array.isArray(parsed.mappings) ? parsed.mappings : []));
      return rows.map(manualSfaItemFromSource).filter(row => row && row.name);
    } catch {}
  }
  return raw.replace(/\\n/g, '\n').replace(/\\t/g, '\t').split(/\n+/).map((line, idx) => {
    const parts = line.split(/\t|,/).map(part => part.trim()).filter(Boolean);
    if (!parts[0]) return null;
    return {
      name: parts[0],
      qty: Number(parts[1]) || 0,
      unit: parts[2] || '',
      row_index: idx + 1,
      source_name: parts[0]
    };
  }).filter(Boolean);
}

function sfaIoOutput(data) {
  const matches = buildOrderSiteMatches(data);
  const aliasMatches = buildOrderAliasMatches(data);
  const unitRows = unitCorrectionRows(data).map(item => ({
    name: item.name,
    unit: item.unit,
    correction: unitCorrectionForItem(item.name),
    inferred: conversionAnalysis[item.name] || null
  }));
  return JSON.stringify({
    file: data?.file?.name || '',
    savedAt: data?.savedAt || null,
    mappings: matches.map(row => ({
      siteName: row.siteName,
      siteUnit: row.siteUnit,
      siteQty: row.siteQty,
      targetName: row.targetName,
      status: sfaStatusText(row.status),
      score: Math.round((row.score || 0) * 100) / 100
    })),
    aliasMappings: aliasMatches.map(row => ({
      aliasName: row.aliasName,
      aliasUnit: row.aliasUnit,
      actualName: row.actualName,
      actualUnit: row.actualUnit,
      defaultActualName: row.defaultActualName || '',
      effectiveActualName: row.effectiveActualName || '',
      status: sfaStatusText(row.status),
      score: Math.round((row.score || 0) * 100) / 100,
      conversionFactor: row.conversionFactor,
      conversionStatus: row.conversionStatus,
      defaultConversionFactor: row.defaultConversionFactor || null,
      effectiveConversionFactor: row.effectiveConversionFactor || null,
      conversionCandidates: row.conversionCandidates.map(candidate => ({
        factor: candidate.factor,
        source: candidate.source,
        score: Math.round((candidate.score || 0) * 100) / 100,
        reason: candidate.reason
      })),
      reason: row.reason
    })),
    unitCorrections: unitRows
  }, null, 2);
}

      <pre class="sfa-output">${escapeHtml(data ? sfaIoOutput(data) : '분석 결과 없음')}</pre>
    </div>`;
    return;
  }
  if (sfaActiveTab === 'alias') {
    const aliasRows = buildOrderAliasMatches(data);
    body.innerHTML = aliasRows.length ? aliasRows.map(aliasMatchRowHtml).join('') : '<div class="sfa-panel-meta">별명 검수 대상 없음</div>';
    bindSfaCorrectionInputs();
    return;
  }
  if (!data) {
    body.innerHTML = '<div class="sfa-panel-meta">분석 결과 없음</div>';
    return;
  }
  if (!data.ok && sfaActiveTab !== 'io') {
    const structure = data.structure || {};
    const sample = structure.sample_rows || [];
    body.innerHTML = `<div class="sfa-row high">
      <div class="risk">구조</div>
      <div class="item">품목명/수량 열 확정 실패</div>
      <div class="qty">${escapeHtml(structure.confidence || 0)}</div>
      <div class="reason">${escapeHtml((structure.reason || '') + ' ' + sample.slice(0, 3).map(row => row.join(' / ')).join(' | '))}</div>
    </div>`;
    return;
  }
  if (sfaActiveTab === 'unit') {
    const rows = unitCorrectionRows(data);
    body.innerHTML = rows.length ? rows.map(unitCorrectionRowHtml).join('') : '<div class="sfa-panel-meta">단위 보정 대상 없음</div>';

    return;
  }
  const matches = buildOrderSiteMatches(data);
  if (sfaActiveTab === 'unmatched') {
    const matchRows = matches.filter(row => row.status !== 'confirmed');
    const missingRows = expectedMissingRows(data).map(row => `<div class="sfa-match-row unmatched">
      <div class="sfa-match-status">내부만</div>
      <div>
        <div class="sfa-match-name">${escapeHtml(row.name)}</div>

      <div class="sfa-match-meta">사이트 행 없음</div>
    </div>`);
    body.innerHTML = matchRows.map(sfaMatchRowHtml).concat(missingRows).join('') || '<div class="sfa-panel-meta">미매칭 없음</div>';
    bindSfaCorrectionInputs();
    return;
  }
  body.innerHTML = matches.length ? matches.map(sfaMatchRowHtml).join('') : '<div class="sfa-panel-meta">사이트 품목 없음</div>';
  bindSfaCorrectionInputs();
}

function sfaReviewRows(comp) {
  const matched = comp?.matched || [];
  const missing = comp?.missing || [];
  return matched.filter(row => row.status !== 'OK').concat(missing);
}

function sfaGapRowHtml(row, extraOnly = false) {
  const risk = extraOnly ? '' : (row.risk || 'MEDIUM');
  const klass = extraOnly ? 'extra' : sfaRiskClass(risk);
  const label = extraOnly ? 'SFA만' : sfaRiskLabel(risk);
  const name = row.expected_name || row.name || row.sfa_name || '';
  const source = row.sfa_name && row.sfa_name !== name ? ` / ${row.sfa_name}` : '';
  const expected = extraOnly ? '-' : (row.expected_qty ?? row.qty ?? 0);
  const actual = row.sfa_qty ?? row.qty ?? 0;
  const reason = extraOnly ? '앱 발주 목록에는 없고 SFA 엑셀에만 있는 품목입니다.' : (row.reason || '');
  return `<div class="sfa-row ${klass}">
    <div class="risk">${label}</div>
    <div class="item">${escapeHtml(name + source)}</div>
    <div class="qty">앱 ${escapeHtml(expected)} / SFA ${escapeHtml(actual)}</div>
    <div class="reason">${escapeHtml(reason)}</div>
  </div>`;
}

function renderSfaComparePanel(data) {
  const panel = document.getElementById('sfaComparePanel');

  const fileName = data.file?.name || '';

  const matched = comp.matched || [];

  const high = reviewRows.filter(row => row.risk === 'HIGH');
  const medium = reviewRows.filter(row => row.risk === 'MEDIUM');
  const low = reviewRows.filter(row => row.risk === 'LOW');
  const extra = comp.extra || [];
  const okCount = matched.filter(row => row.status === 'OK').length;
  const applied = data.appliedActualOrders || {};
  const matchRows = buildOrderSiteMatches(data);
  const confirmedCount = matchRows.filter(row => row.status === 'confirmed').length;
  const openCount = matchRows.filter(row => row.status !== 'confirmed').length + expectedMissingRows(data).length;
  const aliasRows = buildOrderAliasMatches(data);
  const aliasConfirmedCount = aliasRows.filter(row => row.status === 'confirmed').length;
  const aliasOpenCount = aliasRows.filter(row => row.status !== 'confirmed').length;
  lastSfaCompareSavedAt = Number(data.savedAt || 0);

  title.textContent = data.ok ? '엑셀 오차' : '엑셀 구조 확인';

    ? `실발주값 ${Object.keys(applied).length}개 이력 기록됨 · 수동 일사용/발주값 자동변경 없음 · 실사용 참고 즉시 반영`
    : '비교만 완료: 수동 일사용/발주값 자동변경 없음 · 실발주 이력은 실사용 참고에만 반영';

function renderSfaStatus(data) {
  const el = document.getElementById('sfaStatus');
  if (!el) return;
  const state = data?.state || 'idle';
  const statusMs = sfaStatusMs(data);
  const hadPendingRequest = !!sfaLastRequestAt;
  if (sfaLastRequestAt && ['idle', 'ok', 'already_applied'].includes(state) && (!statusMs || statusMs < sfaLastRequestAt)) {
    return;
  }
  if (sfaLastRequestAt && statusMs >= sfaLastRequestAt && ['ok', 'already_applied', 'no_file', 'error', 'request_error'].includes(state)) {
    sfaLastRequestAt = 0;
  }
  const day = data?.order_date ? ` ${data.order_date.slice(5)}` : '';
  const time = shortStatusTime(data?.last_analyzed_at || data?.updated_at);
  el.textContent = `엑셀 ${sfaStatusLabel(state)}${day}${time ? ' ' + time : ''}`;
  el.className = `status-pill ${sfaStatusTone(state)}`;
  el.title = data?.file || data?.error || '';

  const key = sfaStatusKey(data);
  if (sfaStatusInitialized && key && key !== lastSfaStatusKey) {
    const msg = sfaStatusToastText(data);
    if (msg) toast(msg);
  }
  if (key) lastSfaStatusKey = key;
  sfaStatusInitialized = true;
  if (state === 'ok') {
    const compareKey = `${data?.file || ''}|${data?.last_analyzed_at || data?.updated_at || ''}`;
    if (compareKey && compareKey !== lastSfaCompareStatusKey) {
      lastSfaCompareStatusKey = compareKey;
      loadSfaCompareLatest(true, hadPendingRequest);
    }
  }
  updateStickyOffsets();
}

function pushSaveLog(message, tone = 'success', ts = Date.now()) {
  if (isInternalDebugMessage(message)) {
    pushDebugLog(message, tone, ts);
    return;
  }
  saveLogs.unshift({ ts, message, tone });
  saveLogs = saveLogs.slice(0, SAVE_LOG_LIMIT);
  localStorage.setItem(SAVE_LOG_STORAGE_KEY, JSON.stringify(saveLogs));
  renderSaveLogs();
}

function isInternalDebugMessage(message) {
  return /^(키|보정|정렬이동|이동) /.test(String(message || ''));
}

function pushDebugLog(message, tone = 'debug', ts = Date.now()) {
  debugLogs.unshift({ ts, message, tone });
  debugLogs = debugLogs.slice(0, DEBUG_LOG_LIMIT);
  localStorage.setItem(DEBUG_LOG_STORAGE_KEY, JSON.stringify(debugLogs));
}

function advanceStockInput(currentId, source = 'manual') {

function shouldFallbackAdvanceFromChange(target, currentId) {
  const active = document.activeElement;
  if (!active || active === document.body) return true;
  if (active === target) return true;
  const nextStockId = getNextStockInputId(currentId);
  const activeField = active?.dataset?.field || '';
  const activeId = active?.dataset?.id || '';
  if (activeField === 'stock' && activeId === nextStockId) return false;
  console.info('[stock-key]', `change correction current=${currentId} active=${activeId}/${activeField} nextStock=${nextStockId || '-'}`);
  pushDebugLog(`보정 current=${currentId} active=${activeId}/${activeField || '-'} nextStock=${nextStockId || '-'}`, 'warn');
  return true;
}

function getNextStockInputId(currentId) {
  const stockInputs = Array.from(document.querySelectorAll('input.cell[data-field="stock"]'));
  const idx = stockInputs.findIndex(inp => inp.dataset.id === currentId);
  return idx >= 0 ? stockInputs[idx + 1]?.dataset.id || null : null;
}

function focusStockInputById(id) {
  if (!id) return false;

  target.select();
  return true;
}

function currentStockFocusId() {

function renderAndFocusStock(nextId, source, currentId) {
  render();
  const moved = focusStockInputById(nextId);
  const msg = `${source} current=${currentId || '-'} next=${nextId || '-'} result=${moved ? 'focused' : 'end'}`;
  console.debug('[stock-sort]', msg);
  pushDebugLog('정렬이동 ' + msg, moved ? 'sync' : 'warn');
  return moved;
}

function sortStockRowsAndKeepFlow(currentId, source = 'sort') {
  const activeNextId = currentStockFocusId();
  const nextId = activeNextId && activeNextId !== currentId ? activeNextId : getNextStockInputId(currentId);
  return renderAndFocusStock(nextId, source, currentId);
}

function isStockChecked(entry) {
  return entry && entry.stock !== null && entry.stock !== '' && !Number.isNaN(Number(entry.stock));
}

function inputRowPriority(entry, hidden) {
  if (hidden) return 2;
  if (isStockChecked(entry)) return 1;
  return 0;
}

function fmt(n, dp=2) {
  if (n === null || n === undefined || isNaN(n)) return '';
  return (Math.round(n * Math.pow(10, dp)) / Math.pow(10, dp)).toString();
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}

function normalizedZone(zone) {
  return String(zone || '').trim();
}

function compareInputRows(left, right) {
  const pri = inputRowPriority(left.entry, left.hidden) - inputRowPriority(right.entry, right.hidden);
  if (pri !== 0) return pri;

  const leftZone = normalizedZone(left.entry.zone);
  const rightZone = normalizedZone(right.entry.zone);
  if (leftZone && !rightZone) return -1;
  if (!leftZone && rightZone) return 1;
  if (leftZone !== rightZone) return leftZone.localeCompare(rightZone, 'ko', { numeric: true, sensitivity: 'base' });

  const seqDiff = (left.item.sfaSeq || 9999) - (right.item.sfaSeq || 9999);
  if (seqDiff !== 0) return seqDiff;

  return (left.entry.id || '').localeCompare(right.entry.id || '', 'en');
}

function defaultOutputCompare(a, b) {
  const seqDiff = (a.sfaSeq || 9999) - (b.sfaSeq || 9999);
  if (seqDiff !== 0) return seqDiff;
  return (a.name || '').localeCompare(b.name || '', 'ko', { numeric: true, sensitivity: 'base' });
}

function bindCellInputs() {
  document.querySelectorAll('input.cell').forEach(inp => {
    inp.addEventListener('input', e => {
      if (handleOutputCellInput(e.target)) return;
      const id = e.target.dataset.id;
      const f = e.target.dataset.field;
      const v = e.target.value;
      const ent = entries.find(x => x.id === id);
      if (!ent) return;
      if (f === 'stock') {
        logStockEvent(e, 'input');
        ent.stock = v === '' ? null : parseFloat(v);
        saveLocal();
        recomputeUsageAnalysis();
        updateDailyAnalysisForName(ent.name);
        updateGForName(ent.name);
      } else if (f === 'zone') {
        ent.zone = v;
        saveLocal();
      } else {
        // k or l (overrides per name)
        const n = ent.name;
        if (!overrides[n]) overrides[n] = {};
        const num = v === '' ? null : parseFloat(v);
        if (num === null) delete overrides[n][f];
        else overrides[n][f] = num;
        if (Object.keys(overrides[n]).length === 0) delete overrides[n];
        saveLocal();
        updateGForName(n);
      }
    });
    inp.addEventListener('change', e => {
      if (e.target.dataset.outputField) {
        handleOutputCellInput(e.target);
        flushAutoSave('auto');
        render();
        return;
      }
      // blur/Enter — pending autosave 즉시 flush
      if (e.target.dataset.field === 'stock') {
        logStockEvent(e, 'change');
        const currentId = e.target.dataset.id;
        if (skipStockRenderOnceId === e.target.dataset.id) {
          skipStockRenderOnceId = null;
          return;
        }
        setTimeout(() => {
          if (shouldFallbackAdvanceFromChange(e.target, currentId)) {
            advanceStockInput(currentId, 'change');
          } else {
            sortStockRowsAndKeepFlow(currentId, 'change');
          }
          flushAutoSave('auto');
        }, 0);
        return;
      }
      flushAutoSave();
      if (e.target.dataset.field === 'zone') render();
    });
    inp.addEventListener('keydown', e => {
      if (e.target.dataset.outputField) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        handleOutputCellInput(e.target);
        e.target.blur();
        flushAutoSave('auto');
        render();
        return;
      }
      if (e.target.dataset.field === 'stock') logStockEvent(e, 'keydown');
      if (e.key !== 'Enter') return;
      if (e.target.dataset.field !== 'stock') return;
      e.preventDefault();
      skipStockRenderOnceId = e.target.dataset.id;
      advanceStockInput(e.target.dataset.id, 'keydown');
      flushAutoSave('auto');
    });
  });
}

      <td class="name" data-item-name="${escapeHtml(item.name)}"><div class="item-title">${escapeHtml(nameDisplay)}</div>${inlineAliasControls}</td>
      <td><input class="cell" type="number" inputmode="decimal" enterkeyhint="next" step="0.1" data-id="${ent.id}" data-field="stock" value="${ent.stock==null?'':ent.stock}"></td>
      ${KL}
      ${gCell}
      <td>${item.unit||''}</td>
      <td class="actions">
        <button class="add" tabindex="-1" onclick="addRow('${ent.id}')" title="같은 품목 행 추가">+</button>
        ${dupCount > 1 ? `<button tabindex="-1" onclick="deleteRow('${ent.id}')" title="이 행 삭제">×</button>` : ''}
        ${snoozeBtn}
      </td>
    `;
    tbody.appendChild(tr);
  });

  bindCellInputs();
  bindInlineAliasControls();
  updateStickyOffsets();
}

function refreshNeedBadge(days = parseInt(document.getElementById('orderDays')?.value || recommendedDays())) {
  let cnt = 0;
  MASTER.forEach(it => { if (calcG(it, days) > 0) cnt++; });
  document.getElementById('badge').textContent = '발주 ' + cnt + '개';
  document.getElementById('badge').classList.toggle('zero', cnt === 0);
}

function updateGForName(name) {
  const item = MASTER.find(m => m.name === name);
  if (!item) return;
  const days = parseInt(document.getElementById('orderDays').value);
  const g = calcG(item, days);
  const isNeed = g > 0;
  // 같은 품목 모든 행의 G 셀/배경 갱신
  document.querySelectorAll('tr').forEach(tr => {
    const cells = tr.querySelectorAll('td.name');
    if (!cells.length) return;
    const txt = cells[0].dataset.itemName || cells[0].textContent.replace(/^↳\s*/, '');
    if (txt !== name) return;
    const gCell = tr.querySelector('td.order-qty');
    if (gCell && !tr.classList.contains('row-hidden')) {
      const isDuplicateCell = gCell.classList.contains('dup');
      gCell.textContent = isNeed ? displayOrderQty(item, days) : '';
      gCell.className = isDuplicateCell
        ? 'qty order-qty dup'
        : 'qty order-qty' + (isNeed ? ' pos' : '');
    }
    if (isNeed && !tr.classList.contains('dup-row')) tr.classList.add('need');
    else tr.classList.remove('need');
  });
  refreshNeedBadge(days);
}

function addRow(fromId) {
  const src = entries.find(x => x.id === fromId);
  if (!src) return;
  const newEntry = { id: newId(), name: src.name, zone: '', stock: null };
  // 같은 품목 마지막 entry 뒤에 삽입
  const idx = entries.map(e => e.name).lastIndexOf(src.name);
  entries.splice(idx + 1, 0, newEntry);
  saveLocal();
  render();
}

function deleteRow(id) {
  const idx = entries.findIndex(x => x.id === id);
  if (idx < 0) return;
  const sameNameCount = entries.filter(e => e.name === entries[idx].name).length;
  if (sameNameCount <= 1) { toast('마지막 행은 삭제 불가'); return; }
  entries.splice(idx, 1);
  saveLocal();
  render();
}

function toggleMode() {
  viewMode = (viewMode === 'input') ? 'output' : 'input';
  const btn = document.getElementById('modeBtn');
  if (viewMode === 'input') {
    btn.textContent = '출력 보기';
    btn.className = '';
  } else {
    btn.textContent = '입력 보기';
    btn.className = 'green';
  }
  render();
}

function resetStocks() {
  if (!confirm('모든 재고 값을 비울까요? 구역, 여유, 일사용은 유지됩니다.')) return;
  entries.forEach(ent => { ent.stock = null; });
  saveLocal('reset');
  if (autoSaveTimer) {
    clearTimeout(autoSaveTimer);
    autoSaveTimer = null;
  }
  render();
  pushSaveLog('재고 리셋', 'muted');
  saveToFB('reset');
}

let suppressAutoSave = false;
let localDirty = false;
function saveLocal(reason = 'auto') {
  const orderDaysEl = document.getElementById('orderDays');
  if (orderDaysEl) localStorage.setItem('bbq_orderDays', orderDaysEl.value);
  migrateRuntimeItemNames();
  outputOrder = [];
  actualOrders = cleanActualOrders();
  localStorage.setItem('bbq_entries', JSON.stringify(entries));
  localStorage.setItem('bbq_overrides', JSON.stringify(overrides));
  localStorage.setItem('bbq_dailySales', JSON.stringify(dailySales));
  localStorage.removeItem(OUTPUT_ORDER_STORAGE_KEY);
  localStorage.setItem(ACTUAL_ORDER_STORAGE_KEY, JSON.stringify(actualOrders));
  localStorage.setItem(ACTUAL_ORDER_DATE_STORAGE_KEY, kstDateKey(Date.now()));
  localStorage.setItem(ORDER_SITE_MAPPING_STORAGE_KEY, JSON.stringify(orderSiteMappings));
  localStorage.setItem(ORDER_ALIAS_MAPPING_STORAGE_KEY, JSON.stringify(orderAliasMappings));
  localStorage.setItem(ORDER_UNIT_CORRECTION_STORAGE_KEY, JSON.stringify(orderUnitCorrections));
  if (baseSales == null) localStorage.removeItem('bbq_baseSales');
  else {
    localStorage.setItem('bbq_baseSales', JSON.stringify(baseSales));
    localStorage.setItem('bbq_baseSalesVersion', BASE_SALES_STORAGE_VERSION);
  }
  if (!suppressAutoSave) {
    localDirty = true;
    renderSaveState('저장 대기', 'dirty');
    if (typeof scheduleAutoSave === 'function') scheduleAutoSave(reason);
  }
  touchCurrentStateRevision();
}

function setBaseSalesInputValue() {
  const inp = document.getElementById('baseSalesInput');
  if (!inp || document.activeElement === inp) return;
  inp.value = baseSales != null ? baseSales : '';
}

function bindBaseSalesInput() {
  const inp = document.getElementById('baseSalesInput');
  if (!inp) return;
  setBaseSalesInputValue();
  inp.addEventListener('input', e => {
    const v = e.target.value;
    const n = v === '' ? null : parseFloat(v);
    baseSales = Number.isFinite(n) && n > 0 ? n : null;
    saveLocal();
    updateSalesAvg();
    MASTER.forEach(it => updateGForName(it.name));
  });
  inp.addEventListener('change', () => flushAutoSave());
}

function renderSalesInputs() {
  const days = parseInt(document.getElementById('orderDays').value);
  const lost = recommendedLostDays();
  const wrap = document.getElementById('salesInputs');
  if (!wrap) return;
  wrap.innerHTML = '';
  const today = new Date();
  for (let i = 0; i < days; i++) {
    const d = new Date(today.getTime() + i * 86400000);
    const wd = ['일','월','화','수','목','금','토'][d.getDay()];
    const isLost = i < lost;
    const block = document.createElement('span');
    block.className = 'day-block' + (isLost ? ' lost' : '');
    const lbl = document.createElement('span');
    lbl.className = 'day-label';
    lbl.textContent = (i === 0 ? '오늘' : '+' + i) + '(' + wd + ')';
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.className = 'sales';
    inp.placeholder = '-';
    inp.value = dailySales[i] != null ? dailySales[i] : '';
    inp.dataset.idx = i;
    inp.addEventListener('input', e => {
      const v = e.target.value;
      const num = v === '' ? null : parseFloat(v);
      dailySales[parseInt(e.target.dataset.idx)] = num;
      saveLocal();
      updateSalesAvg();
      // G만 갱신 (재정렬 없이)
      MASTER.forEach(it => updateGForName(it.name));
    });
    inp.addEventListener('change', () => flushAutoSave());
    block.appendChild(lbl);
    block.appendChild(inp);
    wrap.appendChild(block);
  }
  updateSalesAvg();
}

function updateSalesAvg() {
  const days = parseInt(document.getElementById('orderDays').value);
  const explicit = [];
  for (let i = 0; i < days; i++) {
    const n = Number(dailySales[i]);
    if (dailySales[i] != null && Number.isFinite(n)) explicit.push(n);
  }
  const el = document.getElementById('salesAvg');
  if (!el) return;
  const base = getBaseSales();
  if (explicit.length === 0) {
    el.textContent = `기준 ${base.toFixed(0)}만 / 균등 1.00배`;
    return;
  }
  const weights = dailyWeights(days);
  const total = weights.reduce((a,b)=>a+b,0);
  el.textContent = `기준 ${base.toFixed(0)}만 → 오늘 ${weights[0].toFixed(2)}배 / 총 ${total.toFixed(2)}일분`;
}

// single-flight + pending bit + 지수 backoff (5/10/20s, 3회). 진행 중 새 호출은 pending 만 set, 끝난 직후 최신 entries 로 한 번만 재발사 → 구버전 덮어쓰기 방지.
let saveInFlight = false;
let pendingSave = false;
let pendingSaveReason = 'auto';
let saveRetryTimer = null;
let saveAttempt = 0;
const SAVE_BACKOFF = [5000, 10000, 20000];
async function saveToFB(reason = 'manual') {
  if (saveInFlight) {
    pendingSave = true;
    pendingSaveReason = reason;
    return;
  }
  saveInFlight = true;
  renderSaveState(saveReasonLabel(reason) + ' 중', 'saving');
  const activeReason = reason;
  migrateRuntimeItemNames();
  const now = Date.now();
  const dateKey = kstDateKey(now);
  const days = parseInt(document.getElementById('orderDays').value);
  const calc = {};
  MASTER.forEach(item => {
    const g = calcG(item, days);
    if (g > 0) calc[item.name] = { qty: outputOrderQty(item, days), stockNeed: Math.round(g*100)/100, unit: item.unit, stock: totalStock(item.name) };
  });
  const salesWeights = dailyWeights(days).map(x => Math.round(x * 1000) / 1000);
  outputOrder = [];
  actualOrders = cleanActualOrders();
  const orderAliasMappingDrafts = orderAliasMappingDraftsForPayload(lastSfaCompareData);
  const effectiveOrderAliasMappings = effectiveOrderAliasMappingsForPayload(lastSfaCompareData);
  const payload = { savedAt: now, dateKey, orderDays: days, entries, overrides, outputOrder, actualOrders, orderSiteMappings, orderAliasMappings, orderAliasMappingDrafts, effectiveOrderAliasMappings, orderUnitCorrections, dailySales, baseSales: getBaseSales(), salesWeights, calc, debugLogs: debugLogs.slice(0, DEBUG_LOG_LIMIT) };
  console.log('[saveToFB] PUT', FB_URL + FB_PATH + '/current.json', 'savedAt=', now, 'entries=', entries.length);
  const scheduleRetry = (label) => {
    if (saveAttempt >= SAVE_BACKOFF.length) {
      saveAttempt = 0;
      pushSaveLog(saveReasonLabel(activeReason) + ' 실패', 'error');
      renderSaveState('저장 실패', 'error');
      toast('저장 반복 실패 — 다시 입력하시면 재시도됩니다');
      console.error('[saveToFB] retries exhausted after', label);
      return;
    }
    const delay = SAVE_BACKOFF[saveAttempt++];
    if (saveRetryTimer) clearTimeout(saveRetryTimer);
    pushSaveLog(`${saveReasonLabel(activeReason)} 재시도 ${delay/1000}초`, 'warn');
    saveRetryTimer = setTimeout(() => { saveRetryTimer = null; saveToFB(activeReason); }, delay);
    console.warn('[saveToFB] retry in', delay, 'ms after', label);
  };
  try {
    const [r1, r2] = await Promise.all([
      fetch(`${FB_URL}${FB_PATH}/current.json`, { method: 'PUT', body: JSON.stringify(payload) }),
      fetch(`${FB_URL}${FB_PATH}/history/${dateKey}.json`, { method: 'PUT', body: JSON.stringify(payload) })
    ]);
    if (!r1.ok || !r2.ok) {
      const t1 = await r1.text().catch(()=>''); const t2 = await r2.text().catch(()=>'');
      console.error('[saveToFB] FAIL', { current: r1.status, history: r2.status, body1: t1, body2: t2 });
      const nextDelay = SAVE_BACKOFF[Math.min(saveAttempt, SAVE_BACKOFF.length - 1)] / 1000;
      toast('저장 실패: HTTP ' + r1.status + '/' + r2.status + ' — ' + nextDelay + '초 후 재시도');
      scheduleRetry('HTTP ' + r1.status + '/' + r2.status);
      return;
    }
    saveAttempt = 0;
    if (saveRetryTimer) { clearTimeout(saveRetryTimer); saveRetryTimer = null; }
    localStorage.setItem('bbq_savedAt', String(now));
    // pendingSave=true 면 진행 중 추가 입력 있었음 → localDirty 유지(다음 PUT 가 최신 entries 로 재발사). pendingSave=false 면 PUT payload == 현재 entries → dirty 해제.
    if (!pendingSave) localDirty = false;
    console.log('[saveToFB] OK savedAt=', now, 'pendingSave=', pendingSave);
    pushSaveLog(saveReasonLabel(activeReason) + ' 완료', 'success', now);
    renderSaveState('저장됨', 'saved');
    toast(saveReasonLabel(activeReason) + ' 완료 (' + new Date(now).toLocaleTimeString('ko-KR') + ')');
    document.getElementById('lastSaved').textContent = lastSavedLabel(activeReason) + ' ' + new Date(now).toLocaleTimeString('ko-KR');
    loadUsageHistory(true);
  } catch (e) {
    console.error('[saveToFB] EXCEPTION', e);
    pushSaveLog(saveReasonLabel(activeReason) + ' 실패', 'error');
    renderSaveState('저장 실패', 'error');
    const nextDelay = SAVE_BACKOFF[Math.min(saveAttempt, SAVE_BACKOFF.length - 1)] / 1000;
    toast('저장 실패: ' + e.message + ' — ' + nextDelay + '초 후 재시도');
    scheduleRetry('EXCEPTION');
  } finally {
    saveInFlight = false;
    if (pendingSave) {
      const nextReason = pendingSaveReason || 'auto';
      pendingSave = false;
      pendingSaveReason = 'auto';
      // 단일 이벤트 루프 — setTimeout 0 콜백과 사용자 이벤트 핸들러가 동일 틱에 겹치지 않으므로 재진입 race 없음.
      setTimeout(() => saveToFB(nextReason), 0);
    }
  }
}

// 입력 포커스 추적 (실시간 동기화 시 덮어쓰기 방지)
let inputFocused = false;
let pendingFBData = null;
document.addEventListener('focusin', e => {
  if (e.target.matches('input,select,textarea')) inputFocused = true;
});
document.addEventListener('focusout', e => {
  if (e.target.matches('input,select,textarea')) {
    inputFocused = false;
    setTimeout(() => {
      if (!inputFocused && pendingFBData) {
        applyFBData(pendingFBData);
        pendingFBData = null;
      }
    }, 300);
  }
});

function normalizeOrderDays(value) {
  const n = parseInt(String(value || '').replace(/\D/g, ''), 10);
  if (!Number.isFinite(n) || n < 1 || n > 7) return '';
  return String(n);
}

function setOrderDaysValue(value) {
  const days = normalizeOrderDays(value);
  const sel = document.getElementById('orderDays');
  if (!days || !sel) return false;
  sel.value = days;
  localStorage.setItem('bbq_orderDays', days);
  localStorage.setItem(ORDER_DAYS_RULE_STORAGE_KEY, ORDER_DAYS_RULE_VERSION);
  touchCurrentStateRevision();
  return true;
}

function applyFBData(data) {
  if (!data || !data.savedAt) return;
  // FB가 source of truth: 그대로 교체. 로컬 변경 보호는 autoLoadFromFB의 localDirty 체크가 담당
  if (Object.prototype.hasOwnProperty.call(data, 'orderDays')) setOrderDaysValue(data.orderDays);
  if (Object.prototype.hasOwnProperty.call(data, 'entries')) {
    entries = migrateEntriesByName(data.entries);
    touchCurrentStateRevision();
  }
  if (Object.prototype.hasOwnProperty.call(data, 'overrides')) {
    overrides = migrateNamedObject(data.overrides);
    touchCurrentStateRevision();
  }
  if (Object.prototype.hasOwnProperty.call(data, 'outputOrder')) outputOrder = [];
  if (Object.prototype.hasOwnProperty.call(data, 'actualOrders') && normalizeHistoryDateKey(data.dateKey) === kstDateKey(Date.now())) {
    actualOrders = cleanActualOrders(data.actualOrders);
  } else {
    actualOrders = {};
  }
  touchCurrentStateRevision();
  if (Object.prototype.hasOwnProperty.call(data, 'orderSiteMappings')) orderSiteMappings = sanitizeOrderSiteMappings(data.orderSiteMappings);
  if (Object.prototype.hasOwnProperty.call(data, 'orderAliasMappings')) {
    orderAliasMappings = sanitizeOrderAliasMappings(data.orderAliasMappings);
    touchCurrentStateRevision();
  }
  if (Object.prototype.hasOwnProperty.call(data, 'orderUnitCorrections')) {
    orderUnitCorrections = sanitizeOrderUnitCorrections(data.orderUnitCorrections);
    touchCurrentStateRevision();
  }
  if (Object.prototype.hasOwnProperty.call(data, 'dailySales')) {
    dailySales = Array.isArray(data.dailySales) ? data.dailySales : [];
    touchCurrentStateRevision();
  }
  if (Object.prototype.hasOwnProperty.call(data, 'baseSales')) {
    const n = Number(data.baseSales);
    baseSales = Number.isFinite(n) && n > 0 ? n : DEFAULT_BASE_SALES;
  }
  // 마이그레이션: FB 데이터에 MASTER 에서 사라진 이름 잔존 시 정리 (구 이름 / 등 RTDB 키 사고 방지)
  migrateRuntimeItemNames();
  let maxN = 0;
  entries.forEach(e => { const m = /^e(\d+)$/.exec(e.id||''); if (m) maxN = Math.max(maxN, +m[1]); });
  nextId = maxN + 1;
  MASTER.forEach(item => {
    if (!entries.some(e => e.name === item.name)) {
      entries.push({ id: newId(), name: item.name, zone: '', stock: null });
    }
  });
  localStorage.setItem('bbq_savedAt', String(data.savedAt));
  suppressAutoSave = true;
  saveLocal();
  suppressAutoSave = false;
  setBaseSalesInputValue();
  renderSalesInputs();
  render();
  renderSaveState('동기화됨', 'idle');
  document.getElementById('lastSaved').textContent = '동기화 ' + new Date(data.savedAt).toLocaleTimeString('ko-KR');
  loadUsageHistory(true);
}

// Firebase 폴링 (5초마다, 입력 중이면 보류)
async function autoLoadFromFB(silent) {
  try {
    const res = await fetch(`${FB_URL}${FB_PATH}/current.json?_=` + Date.now());
    if (!res.ok) { console.warn('[autoLoad] HTTP', res.status); return; }
    const data = await res.json();
    if (!data || !data.savedAt) return;
    const localSavedAt = parseInt(localStorage.getItem('bbq_savedAt') || '0');
    if (data.savedAt <= localSavedAt) return;
    if (localDirty) return; // 로컬에 미저장 변경 있음 → 보호. 저장 후 다시 폴링.
    if (inputFocused) {
      pendingFBData = data;
      return;
    }
    applyFBData(data);
    pushSaveLog('다른 기기 저장 반영', 'sync', data.savedAt);
    if (!silent) toast('동기화 (' + new Date(data.savedAt).toLocaleTimeString('ko-KR') + ')');
  } catch (e) {
    console.error('FB auto-load failed:', e);
  }
}

// 자동저장 (debounce 1초, blur/change 시 즉시)
let autoSaveTimer = null;
let queuedSaveReason = 'auto';
function scheduleAutoSave(reason = 'auto') {
  queuedSaveReason = reason;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => {
    autoSaveTimer = null;
    const reasonToSave = queuedSaveReason || 'auto';
    queuedSaveReason = 'auto';
    saveToFB(reasonToSave);
  }, 1000);
}
function flushAutoSave(reason) {
  const hasPendingTimer = !!autoSaveTimer;
  const explicitRequest = reason != null;
  if (!hasPendingTimer && !explicitRequest) return;
  const reasonToSave = reason || queuedSaveReason || 'auto';
  queuedSaveReason = 'auto';
  if (autoSaveTimer) {
    clearTimeout(autoSaveTimer);
    autoSaveTimer = null;
  }
  saveToFB(reasonToSave);
}

  saveLocal('orderDays');
  renderSalesInputs();

document.getElementById('snoozeOverlay')?.addEventListener('click', e => {

document.addEventListener('keydown', e => {

// 로컬 복원 (entries 우선, 없으면 옛날 stocks 마이그레이션, 없으면 빈 entries)
try {
  const eRaw = localStorage.getItem('bbq_entries');
  if (eRaw) {
    entries = JSON.parse(eRaw);
    touchCurrentStateRevision();
    // nextId 재계산
    let maxN = 0;
    entries.forEach(e => { const m = /^e(\d+)$/.exec(e.id||''); if (m) maxN = Math.max(maxN, +m[1]); });
    nextId = maxN + 1;
  } else {
    const sRaw = localStorage.getItem('bbq_stocks');
    let oldStocks = {};
    if (sRaw) try { oldStocks = JSON.parse(sRaw); } catch {}
    entries = MASTER.map(item => ({
      id: newId(),
      name: item.name,
      zone: '',
      stock: storedStockForName(oldStocks, item.name)
    }));
    touchCurrentStateRevision();
  }
  const o = localStorage.getItem('bbq_overrides'); if (o) { overrides = JSON.parse(o); touchCurrentStateRevision(); }
  localStorage.removeItem(OUTPUT_ORDER_STORAGE_KEY);
  outputOrder = [];
  const ao = localStorage.getItem(ACTUAL_ORDER_STORAGE_KEY);
  const aoDate = localStorage.getItem(ACTUAL_ORDER_DATE_STORAGE_KEY);
  if (ao && aoDate === kstDateKey(Date.now())) { actualOrders = cleanActualOrders(JSON.parse(ao)); touchCurrentStateRevision(); }
  const osm = localStorage.getItem(ORDER_SITE_MAPPING_STORAGE_KEY);
  if (osm) { orderSiteMappings = sanitizeOrderSiteMappings(JSON.parse(osm)); touchCurrentStateRevision(); }
  const oam = localStorage.getItem(ORDER_ALIAS_MAPPING_STORAGE_KEY);
  if (oam) { orderAliasMappings = sanitizeOrderAliasMappings(JSON.parse(oam)); touchCurrentStateRevision(); }
  const ouc = localStorage.getItem(ORDER_UNIT_CORRECTION_STORAGE_KEY);
  if (ouc) { orderUnitCorrections = sanitizeOrderUnitCorrections(JSON.parse(ouc)); touchCurrentStateRevision(); }
  const ds = localStorage.getItem('bbq_dailySales'); if (ds) { dailySales = JSON.parse(ds); touchCurrentStateRevision(); }
  const bs = localStorage.getItem('bbq_baseSales');
  const bsv = localStorage.getItem('bbq_baseSalesVersion');
  if (bs && bsv === BASE_SALES_STORAGE_VERSION) baseSales = JSON.parse(bs);
  const dl = localStorage.getItem(DEBUG_LOG_STORAGE_KEY);
  if (dl) debugLogs = JSON.parse(dl).slice(0, DEBUG_LOG_LIMIT);
  const sl = localStorage.getItem(SAVE_LOG_STORAGE_KEY);
  if (sl) {
    const loadedSaveLogs = JSON.parse(sl);
    const oldDebugLogs = loadedSaveLogs.filter(log => isInternalDebugMessage(log.message));
    saveLogs = loadedSaveLogs.filter(log => !isInternalDebugMessage(log.message)).slice(0, SAVE_LOG_LIMIT);
    if (oldDebugLogs.length) {
      debugLogs = oldDebugLogs.concat(debugLogs).slice(0, DEBUG_LOG_LIMIT);
      localStorage.setItem(DEBUG_LOG_STORAGE_KEY, JSON.stringify(debugLogs));
      localStorage.setItem(SAVE_LOG_STORAGE_KEY, JSON.stringify(saveLogs));
    }
  }
} catch {}

function startOrderHelperApp() {
  if (orderHelperStarted) return;
  orderHelperStarted = true;
  // 마이그레이션: MASTER 에서 사라진 이름의 entry/overrides 정리 + 구 품목명 갱신
  migrateRuntimeItemNames();
  actualOrders = cleanActualOrders();

  // MASTER에 있는데 entries에 없는 품목 보충 (마스터 갱신 대비)
  MASTER.forEach(item => {
    if (!entries.some(e => e.name === item.name)) {
      entries.push({ id: newId(), name: item.name, zone: '', stock: null });
    }
  });

  // 발주일수 초기값
  const rec = recommendedDays();
  const savedDays = localStorage.getItem('bbq_orderDays');
  const savedDaysRule = localStorage.getItem(ORDER_DAYS_RULE_STORAGE_KEY);
  setOrderDaysValue(savedDaysRule === ORDER_DAYS_RULE_VERSION ? (savedDays || rec) : rec);
  document.getElementById('cycleHint').textContent = `${dayName(new Date().getDay())}요일 → 추천 ${rec}일`;

  document.getElementById('appVer').textContent = 'v' + APP_VERSION;
  bindBaseSalesInput();
  renderSalesInputs();
  render();
  loadUsageHistory(true);
  loadSfaOrderStatus(true);
  window.addEventListener('resize', updateStickyOffsets);
  // 디바이스 간 동기화: 페이지 열 때마다 + 5초 간격 폴링
  autoLoadFromFB(true);
  setInterval(() => autoLoadFromFB(true), 5000);
  setInterval(() => loadUsageHistory(true), 300000);
  setInterval(() => loadSfaOrderStatus(false), 10000);
}
</script>
</body>
</html>
