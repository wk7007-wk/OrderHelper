<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>BBQ 발주</title>
<style>
  * { box-sizing: border-box; }
  :root { --sticky-top: 52px; }
  body { margin: 0; font-family: -apple-system, 'Noto Sans KR', sans-serif; background: #1a1a2e; color: #e0e0e0; font-size: 13px; }
  .top { position: sticky; top: 0; z-index: 10; background: #16213e; border-bottom: 1px solid #0f3460; padding: 10px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .top h1 { font-size: 16px; margin: 0; }
  .badge { background: #e94560; color: #fff; padding: 3px 10px; border-radius: 12px; font-weight: bold; font-size: 12px; }
  .badge.zero { background: #27ae60; }
  .top button { background: #0f3460; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-weight: bold; cursor: pointer; font-size: 12px; }
  .top button.primary { background: #e94560; }
  .top button.green { background: #27ae60; }
  .meta { font-size: 11px; color: #888; }
  .status-pill { display: inline-flex; align-items: center; min-height: 28px; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.01em; }
  .status-pill.idle { background: rgba(59, 130, 246, 0.16); color: #bfdbfe; border: 1px solid rgba(59, 130, 246, 0.35); }
  .status-pill.dirty { background: rgba(245, 158, 11, 0.16); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.35); }
  .status-pill.saving { background: rgba(168, 85, 247, 0.16); color: #e9d5ff; border: 1px solid rgba(168, 85, 247, 0.35); }
  .status-pill.saved { background: rgba(34, 197, 94, 0.16); color: #bbf7d0; border: 1px solid rgba(34, 197, 94, 0.35); }
  .status-pill.error { background: rgba(239, 68, 68, 0.16); color: #fecaca; border: 1px solid rgba(239, 68, 68, 0.35); }
  .sfa-panel { background: #111b33; border-bottom: 1px solid #0f3460; padding: 9px 14px; display: grid; gap: 8px; }
  .sfa-panel.hidden { display: none; }
  .sfa-panel-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sfa-panel-title { font-size: 13px; font-weight: 800; color: #fff; }
  .sfa-panel-meta { color: #9aa7b7; font-size: 11px; }
  .sfa-panel-note { color: #fde68a; font-size: 11px; }
  .sfa-panel-actions { margin-left: auto; display: inline-flex; gap: 6px; }
  .sfa-panel-actions button { background: #0f3460; color: #fff; border: 1px solid #315a8d; border-radius: 6px; padding: 5px 9px; font-size: 11px; font-weight: 700; }
  .sfa-counts { display: flex; gap: 6px; flex-wrap: wrap; }
  .sfa-count { border-radius: 999px; padding: 4px 8px; font-size: 11px; font-weight: 800; border: 1px solid rgba(148, 163, 184, 0.3); color: #cbd5e1; background: rgba(15, 52, 96, 0.55); }
  .sfa-count.high { color: #fecaca; border-color: rgba(239, 68, 68, 0.45); background: rgba(239, 68, 68, 0.14); }
  .sfa-count.medium { color: #fed7aa; border-color: rgba(249, 115, 22, 0.45); background: rgba(249, 115, 22, 0.14); }
  .sfa-count.low { color: #bfdbfe; border-color: rgba(59, 130, 246, 0.45); background: rgba(59, 130, 246, 0.14); }
  .sfa-list { display: grid; gap: 4px; max-height: 260px; overflow: auto; }
  .sfa-row { display: grid; grid-template-columns: 52px minmax(130px, 1fr) auto; gap: 7px; align-items: start; padding: 6px 8px; border: 1px solid rgba(49, 90, 141, 0.42); border-radius: 6px; background: rgba(15, 52, 96, 0.35); }
  .sfa-row .risk { font-size: 11px; font-weight: 900; }
  .sfa-row.high .risk { color: #fecaca; }
  .sfa-row.medium .risk { color: #fed7aa; }
  .sfa-row.low .risk { color: #bfdbfe; }
  .sfa-row.extra .risk { color: #d8b4fe; }
  .sfa-row .item { white-space: normal; word-break: keep-all; color: #e5e7eb; }
  .sfa-row .qty { text-align: right; font-variant-numeric: tabular-nums; color: #fff; font-weight: 800; }
  .sfa-row .reason { grid-column: 2 / 4; color: #9aa7b7; font-size: 11px; white-space: normal; }
  .sfa-tabs { display: flex; gap: 5px; flex-wrap: wrap; }
  .sfa-tab { background: rgba(15, 52, 96, 0.72); color: #cbd5e1; border: 1px solid rgba(49, 90, 141, 0.72); border-radius: 6px; padding: 6px 10px; font-size: 11px; font-weight: 800; cursor: pointer; }
  .sfa-tab.active { background: #e94560; border-color: #e94560; color: #fff; }
  .sfa-match-row { display: grid; grid-template-columns: 68px minmax(150px, 1.2fr) minmax(160px, 1fr) minmax(110px, .7fr); gap: 8px; align-items: center; padding: 7px 8px; border: 1px solid rgba(49, 90, 141, 0.42); border-radius: 6px; background: rgba(15, 52, 96, 0.35); }
  .sfa-match-row.confirmed { border-color: rgba(34, 197, 94, 0.34); background: rgba(34, 197, 94, 0.08); }
  .sfa-match-row.manual { border-color: rgba(20, 184, 166, 0.36); background: rgba(20, 184, 166, 0.09); }
  .sfa-match-row.default { border-color: rgba(96, 165, 250, 0.38); background: rgba(37, 99, 235, 0.1); }
  .sfa-match-row.candidate { border-color: rgba(59, 130, 246, 0.36); background: rgba(59, 130, 246, 0.09); }
  .sfa-match-row.conflict { border-color: rgba(239, 68, 68, 0.44); background: rgba(239, 68, 68, 0.11); }
  .sfa-match-row.unmatched { border-color: rgba(249, 115, 22, 0.4); background: rgba(249, 115, 22, 0.1); }
  .sfa-match-status { font-size: 11px; font-weight: 900; }
  .sfa-match-row.confirmed .sfa-match-status { color: #bbf7d0; }
  .sfa-match-row.manual .sfa-match-status { color: #99f6e4; }
  .sfa-match-row.default .sfa-match-status { color: #bfdbfe; }
  .sfa-match-row.candidate .sfa-match-status { color: #bfdbfe; }
  .sfa-match-row.conflict .sfa-match-status { color: #fecaca; }
  .sfa-match-row.unmatched .sfa-match-status { color: #fed7aa; }
  .sfa-match-name { white-space: normal; word-break: keep-all; color: #e5e7eb; }
  .sfa-match-meta { color: #9aa7b7; font-size: 11px; line-height: 1.35; white-space: normal; }
  .sfa-select, .sfa-edit, .sfa-textarea { width: 100%; background: #0f3460; color: #fff; border: 1px solid #315a8d; border-radius: 6px; padding: 7px 8px; font-size: 12px; }
  .sfa-select:focus, .sfa-edit:focus, .sfa-textarea:focus { outline: none; border-color: #e94560; }
  .sfa-alias-fields { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(74px, .65fr) minmax(62px, .45fr); gap: 5px; align-items: center; }
  .inline-alias-correction { margin-top: 4px; max-width: 270px; color: #9aa7b7; font-size: 10px; line-height: 1.28; }
  .inline-alias-correction summary { display: flex; align-items: center; gap: 4px; min-height: 20px; cursor: pointer; list-style: none; white-space: normal; }
  .inline-alias-correction summary::-webkit-details-marker { display: none; }
  .inline-alias-correction summary::before { content: '보정'; flex: 0 0 auto; color: #cbd5e1; font-weight: 900; }
  .inline-alias-summary-text { min-width: 0; color: #dbeafe; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inline-alias-badge, .inline-alias-factor-badge { flex: 0 0 auto; border-radius: 999px; border: 1px solid rgba(148, 163, 184, 0.32); padding: 1px 5px; font-size: 9px; font-weight: 900; }
  .inline-alias-badge.default, .inline-alias-factor-badge.default { color: #bfdbfe; border-color: rgba(96, 165, 250, 0.4); background: rgba(37, 99, 235, 0.12); }
  .inline-alias-badge.confirmed, .inline-alias-factor-badge.confirmed { color: #bbf7d0; border-color: rgba(34, 197, 94, 0.38); background: rgba(34, 197, 94, 0.11); }
  .inline-alias-badge.manual, .inline-alias-factor-badge.manual { color: #99f6e4; border-color: rgba(20, 184, 166, 0.4); background: rgba(20, 184, 166, 0.11); }
  .inline-alias-badge.unmatched, .inline-alias-factor-badge.unmatched { color: #fed7aa; border-color: rgba(249, 115, 22, 0.42); background: rgba(249, 115, 22, 0.1); }
  .inline-alias-badge.conflict { color: #fecaca; border-color: rgba(239, 68, 68, 0.45); background: rgba(239, 68, 68, 0.12); }
  .inline-alias-body { display: grid; gap: 4px; margin-top: 4px; padding: 5px; border: 1px solid rgba(49, 90, 141, 0.42); border-radius: 6px; background: rgba(8, 14, 24, 0.38); }
  .inline-alias-fields { display: grid; grid-template-columns: minmax(88px, 1fr) minmax(72px, .8fr) minmax(54px, .48fr); gap: 4px; align-items: end; }
  .inline-alias-fields label { display: grid; gap: 2px; color: #9aa7b7; font-size: 9px; font-weight: 700; }
  .inline-alias-fields .sfa-select, .inline-alias-fields .sfa-edit { min-height: 26px; padding: 4px 5px; border-radius: 4px; font-size: 10px; }
  .inline-alias-meta { color: #93a4bb; font-size: 9px; white-space: normal; }
  .sfa-unit-fields { display: grid; grid-template-columns: repeat(3, minmax(52px, 1fr)); gap: 5px; }
  .sfa-unit-fields label { display: grid; gap: 3px; color: #9aa7b7; font-size: 10px; }
  .sfa-io-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .sfa-textarea { min-height: 150px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; line-height: 1.35; }
  .sfa-output { min-height: 150px; max-height: 280px; overflow: auto; margin: 0; padding: 8px; border: 1px solid rgba(49, 90, 141, 0.42); border-radius: 6px; background: rgba(8, 14, 24, 0.62); color: #dbeafe; font-size: 11px; white-space: pre-wrap; }
  .sfa-mini-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .sfa-mini-actions button { background: #0f3460; color: #fff; border: 1px solid #315a8d; border-radius: 6px; padding: 6px 9px; font-size: 11px; font-weight: 800; }
  .desktop-access-grid { display: grid; gap: 5px; }
  .desktop-access-row { display: grid; grid-template-columns: 80px minmax(160px, 1fr) minmax(120px, .6fr) auto; gap: 8px; align-items: center; padding: 7px 8px; border: 1px solid rgba(49, 90, 141, 0.42); border-radius: 6px; background: rgba(15, 52, 96, 0.35); }
  .desktop-access-row.approved { border-color: rgba(34, 197, 94, 0.34); background: rgba(34, 197, 94, 0.08); }
  .desktop-access-row.pending { border-color: rgba(249, 115, 22, 0.4); background: rgba(249, 115, 22, 0.1); }
  .desktop-access-row button { background: #0f3460; color: #fff; border: 1px solid #315a8d; border-radius: 6px; padding: 6px 9px; font-size: 11px; font-weight: 800; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; min-width: 760px; border-collapse: collapse; }
  thead { background: #0f3460; z-index: 5; }
  th, td { padding: 5px 8px; text-align: left; border-bottom: 1px solid #0f3460; white-space: nowrap; }
  th { font-size: 11px; color: #ccc; font-weight: 600; }
  tr.need td { background: rgba(233, 69, 96, 0.08); }
  td.qty { text-align: right; font-variant-numeric: tabular-nums; }
  td.name { max-width: 280px; white-space: normal; }
  td input.cell { background: #0f3460; color: #fff; border: 1px solid #0f3460; border-radius: 4px; padding: 4px 6px; width: 60px; text-align: right; font-size: 13px; }
  td input.cell:focus { outline: none; border-color: #e94560; }
  td input.cell.zone { width: 90px; text-align: left; }
  .order-cell { display: inline-flex; align-items: center; gap: 5px; }
  .order-analysis { display: inline-flex; align-items: center; min-height: 18px; padding: 1px 6px; border-radius: 999px; border: 1px solid rgba(250, 204, 21, 0.34); background: rgba(234, 179, 8, 0.12); color: #fde68a; font-size: 10px; font-weight: 700; line-height: 1.2; vertical-align: middle; }
  .order-analysis.empty { display: none; }
  .order-amount { display: inline-flex; align-items: center; min-height: 18px; padding: 1px 6px; border-radius: 999px; border: 1px solid rgba(56, 189, 248, 0.38); background: rgba(14, 165, 233, 0.13); color: #bae6fd; font-size: 10px; font-weight: 700; line-height: 1.2; vertical-align: middle; }
  .order-amount.empty { display: none; }
  .daily-cell { display: inline-flex; align-items: center; gap: 6px; }
  .daily-analysis { display: inline-flex; align-items: center; min-height: 18px; margin-left: 4px; padding: 1px 6px; border-radius: 999px; border: 1px solid rgba(56, 189, 248, 0.35); background: rgba(14, 165, 233, 0.12); color: #7dd3fc; font-size: 10px; font-weight: 700; line-height: 1.2; vertical-align: middle; }
  .daily-analysis.empty { display: none; }
  .order-qty.pos { font-weight: bold; font-size: 14px; color: #e94560; }
  .order-qty.dup { color: #888; font-weight: normal; font-size: 11px; }
  td.actions { white-space: nowrap; }
  td.actions button { background: transparent; border: 1px solid #0f3460; color: #888; border-radius: 4px; padding: 2px 6px; margin-right: 2px; cursor: pointer; font-size: 11px; }
  td.actions button:hover { color: #e94560; border-color: #e94560; }
  td.actions button.add { color: #27ae60; border-color: #27ae60; }
  td.output-actions { white-space: nowrap; text-align: center; }
  td.output-actions button { background: #0f3460; border: 1px solid #315a8d; color: #fff; border-radius: 4px; padding: 4px 7px; margin-right: 3px; cursor: pointer; font-size: 12px; }
  td.output-actions button:disabled { opacity: 0.28; cursor: default; }
  tr.dup-row td.name { font-style: italic; color: #aaa; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.85); color: #fff; padding: 8px 18px; border-radius: 16px; z-index: 200; opacity: 0; transition: opacity .3s; pointer-events: none; font-size: 12px; }
  .toast.show { opacity: 1; }
  .sales-row { padding: 6px 14px; background: #16213e; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
  .sales-row .day-label { font-size: 10px; color: #888; margin-right: 2px; }
  .sales-row input.sales { width: 50px; background: #0f3460; color: #fff; border: 1px solid #0f3460; border-radius: 4px; padding: 4px 6px; text-align: right; font-size: 12px; }
  .sales-row .base-sales-control { display: inline-flex; align-items: center; gap: 2px; padding-right: 4px; border-right: 1px solid rgba(148, 163, 184, 0.28); }
  .sales-row .day-block { display: inline-flex; align-items: center; gap: 2px; }
  .sales-row .day-block.lost { opacity: 0.5; }
  tr.row-pending td { background: rgba(233, 69, 96, 0.14); }
  tr.row-checked td { background: rgba(15, 52, 96, 0.5); color: #b9c3d2; }
  tr.row-hidden td { background: rgba(8, 14, 24, 0.82); color: #64748b; }
  tr.row-hidden td input.cell { background: #0a1628; color: #94a3b8; border-color: #10233d; }
  tr.dup-row td { background: rgba(255, 255, 255, 0.05); }
  tr.row-pending.dup-row td { background: rgba(233, 69, 96, 0.07); }
  tr.row-checked.dup-row td { background: rgba(15, 52, 96, 0.26); }
  tr.row-hidden.dup-row td { background: rgba(12, 18, 28, 0.72); }
  tr.dup-row td.name { position: relative; padding-left: 26px; font-style: normal; color: #c7d2e0; }
  tr.dup-row td.name::before { content: '↳'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #8fb2d8; }
  tr.row-hidden td.name,
  tr.row-hidden.dup-row td.name { color: #94a3b8; }
  .dup-meta { color: #93a4bb; font-size: 11px; }
  .input-tools { padding: 8px 14px 10px; background: #16213e; border-bottom: 1px solid #0f3460; display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .input-tools.hidden { display: none; }
  .input-tools button { background: #6b2d5c; color: #fff; border: none; border-radius: 6px; padding: 7px 12px; font-weight: bold; cursor: pointer; font-size: 12px; }
  .save-log-wrap { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 220px; }
  .save-log-title { font-size: 11px; color: #888; }
  .save-log { display: flex; gap: 6px; flex-wrap: wrap; }
  .save-chip { background: rgba(15, 52, 96, 0.9); color: #cfd8e3; border: 1px solid #214268; border-radius: 999px; padding: 4px 9px; font-size: 11px; }
  .save-chip.success { border-color: #2d6a4f; color: #d8f3dc; }
  .save-chip.warn { border-color: #b08900; color: #ffe8a3; }
  .save-chip.error { border-color: #9d0208; color: #ffd6d6; }
  .save-chip.sync { border-color: #1d4ed8; color: #dbeafe; }
  .save-chip.muted { color: #9aa7b7; }
  .snooze-overlay { position: fixed; inset: 0; z-index: 500; background: rgba(5, 10, 20, 0.72); display: flex; align-items: center; justify-content: center; padding: 18px; }
  .snooze-overlay.hidden { display: none; }
  .snooze-panel { width: min(320px, 100%); background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.38); }
  .snooze-title { font-size: 15px; font-weight: 700; color: #fff; }
  .snooze-field { display: grid; gap: 6px; font-size: 12px; color: #aaa; }
  .snooze-field input { width: 100%; background: #0f3460; color: #fff; border: 1px solid #315a8d; border-radius: 6px; padding: 10px 12px; font-size: 22px; text-align: right; }
  .snooze-field input:focus { outline: none; border-color: #e94560; }
  .snooze-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .snooze-actions button { border: 0; border-radius: 6px; padding: 10px 14px; font-weight: 700; color: #fff; background: #0f3460; }
  .snooze-actions button.primary { background: #e94560; }

  /* PIN 잠금 */
  body.auth-locked .app-shell { display: none; }
  .pin-overlay { position: fixed; inset: 0; background: #1a1a2e; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .pin-overlay.authed { display: none; }
  .pin-overlay h2 { margin: 0; font-size: 18px; }
  .pin-note { max-width: 300px; color: #aaa; font-size: 12px; line-height: 1.45; text-align: center; }
  .pin-overlay input { font-size: 28px; padding: 14px; width: 180px; text-align: center; background: #0f3460; color: #fff; border: 2px solid #0f3460; border-radius: 8px; letter-spacing: 8px; }
  .pin-overlay input.device-name { width: 220px; font-size: 15px; letter-spacing: 0; }
  .pin-overlay input:focus { outline: none; border-color: #e94560; }
  .pin-overlay button { padding: 12px 32px; font-size: 16px; background: #e94560; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
  .pin-error { color: #ff4444; min-height: 18px; max-width: 320px; text-align: center; font-size: 13px; line-height: 1.35; }
  .pin-error.ok { color: #2ecc71; }

  /* 모바일 (폰) */
  @media (max-width: 600px) {
    body { font-size: 14px; padding-bottom: 40px; }
    .top { padding: 8px; gap: 6px; align-items: flex-start; }
    .top h1 { font-size: 14px; }
    .top button { padding: 8px 10px; font-size: 13px; }
    .status-pill { min-height: 30px; }
    th, td { padding: 6px 4px; font-size: 12px; }
    td.name { max-width: 160px; min-width: 160px; word-break: keep-all; }
    td input.cell { width: 56px; padding: 8px 4px; font-size: 16px; }
    td input.cell.zone { width: 90px; }
    td.actions button { padding: 8px 10px; margin-right: 3px; font-size: 14px; min-width: 32px; }
    .input-tools { padding: 8px; }
    .input-tools button { width: 100%; padding: 10px 12px; font-size: 13px; }
    .save-log-wrap { min-width: 100%; }
    .sfa-panel { padding: 8px; }
    .sfa-panel-actions { width: 100%; margin-left: 0; }
    .sfa-panel-actions button { flex: 1; padding: 8px 9px; }
    .sfa-row { grid-template-columns: 46px minmax(0, 1fr) auto; }
    .sfa-match-row { grid-template-columns: 56px minmax(0, 1fr); }
    .desktop-access-row { grid-template-columns: 1fr; }
    .sfa-match-row .sfa-select,
    .sfa-match-row .sfa-alias-fields,
    .sfa-match-row .sfa-unit-fields { grid-column: 1 / -1; }
    .sfa-alias-fields { grid-template-columns: 1fr; }
    .inline-alias-fields { grid-template-columns: 1fr; }
    .sfa-io-grid { grid-template-columns: 1fr; }
    .table-wrap { border-top: 1px solid #0f3460; }
  }
</style>
</head>
<body class="auth-locked">

<div class="pin-overlay" id="pinOverlay">
  <h2>BBQ 발주</h2>
  <div class="pin-note">PIN + 허용 단말, 승인 데스크탑, 임시 개방, 또는 매장 GPS 700m로 접근합니다.</div>
  <input type="password" inputmode="numeric" pattern="[0-9]*" id="pinInput" maxlength="4" placeholder="PIN" autocomplete="off">
  <input class="device-name" type="text" id="deviceNameInput" maxlength="32" placeholder="단말명" autocomplete="off">
  <button onclick="checkPin()">확인</button>
  <div class="pin-error" id="pinError"></div>
</div>

<div class="app-shell">
<div class="top">
  <h1>BBQ 발주</h1>

<script>
const APP_VERSION = '20260713-1';
const FB_URL = 'https://poskds-4ba60-default-rtdb.asia-southeast1.firebasedatabase.app';
// 0510 보안 강화 — 경로 난독화 (외부 URL 추측 방지). 사용자 영향 0 — 페이지 새로고침 1회만 필요.
const FB_PATH = '/order/desk_q7m9r3a8';
const SFA_ORDER_REQUEST_PATH = '/monitor/main_pc/sfa_order_request';
const SFA_ORDER_STATUS_PATH = '/monitor/main_pc/sfa_order';
const SFA_COMPARE_PATH = `${FB_PATH}/sfaCompare/latest`;
const SFA_ACTUAL_HISTORY_PATH = `${FB_PATH}/sfaActualHistory`;
const DESKTOP_ACCESS_PATH = `${FB_PATH}/desktopAccess`;
const USAGE_ANALYSIS_MAX_DAYS = 90;
const DEFAULT_BASE_SALES = 280;
const BASE_SALES_STORAGE_VERSION = 'formula-280';
const DEFAULT_SNOOZE_DAYS = 5;
const MAX_SNOOZE_DAYS = 365;

// PIN 잠금. PIN 변경 시 새 PIN의 SHA-256 해시로 교체.
const PIN_HASH = '38083c7ee9121e17401883566a148aa5c2e2d55dc53bc4a94a026517dbff3c6b';
// 0510 보안 강화 — 5회 시도 후 30초 lock. 단말 token은 CLI allowlist 등록 전에는 factor가 아니며 PIN은 항상 필요.
const PIN_MAX_ATTEMPTS = 5;
const PIN_LOCK_MS = 30000;
const DESKTOP_GRACE_MS = 24 * 60 * 60 * 1000;
const AUTH_DEBUG = new URLSearchParams(location.search).get('authDebug') === '1' && ['', 'localhost', '127.0.0.1'].includes(location.hostname);
const AUTH_GEO = { storeLat: 37.2528352, storeLng: 127.4900516, radiusM: 700, deviceKey: 'bbq_desk_auth_device_v1', allowedDeviceHashes: ['d21a6620a9a24efe29e7b6921076e2ccd25c6f9b977154e9f8dfe4653d21bd08','c1aa36e7f5eabff58103bbc86257f3350c222b55c0d883592e438f021721681c'],
      allowedDevices:{"d21a6620a9a24efe29e7b6921076e2ccd25c6f9b977154e9f8dfe4653d21bd08":{"enabled":true,"label":"사장","updatedAt":"2026-06-26T18:39:12+00:00"},"c1aa36e7f5eabff58103bbc86257f3350c222b55c0d883592e438f021721681c":{"enabled":true,"label":"메인피시","updatedAt":"2026-06-27T11:30:18+00:00","phoneLast4":"0000"}}, ipFactorReserved: true };
let pinAttempts = 0;
let pinLockUntil = 0;
let orderHelperStarted = false;
let desktopAccessState = { devices: {}, grace: {} };
let desktopAccessVisible = false;

async function hashPin(pin) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pin));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function setPinMessage(msg, ok=false) {
  const el = document.getElementById('pinError');
  el.textContent = msg;
  el.classList.toggle('ok', ok);
}
function readAuthDevice() {
  try { return JSON.parse(localStorage.getItem(AUTH_GEO.deviceKey) || 'null'); } catch { return null; }
}
function ensureAuthDevice() {
  let data = readAuthDevice();
  const name = (document.getElementById('deviceNameInput')?.value || '').trim() || '단말';
  if (data?.token) {
    if (data.name !== name) {
      data = { ...data, name };
      localStorage.setItem(AUTH_GEO.deviceKey, JSON.stringify(data));
    }
    return data;
  }
  data = { token: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()), name, createdAt: Date.now() };
  localStorage.setItem(AUTH_GEO.deviceKey, JSON.stringify(data));
  return data;
}
async function deviceHashText(device) {
  try { return await hashPin(device.token); } catch { return '생성됨'; }
}
async function hasAllowedAuthDevice(device) {
  const hashes = AUTH_GEO.allowedDeviceHashes || [];
  if (!device?.token || !hashes.length) return false;
  return hashes.includes(await hashPin(device.token));
}
function isLikelyDesktopClient() {
  const nav = navigator || {};
  const ua = String(nav.userAgent || '').toLowerCase();
  const platform = String(nav.platform || '').toLowerCase();
  const touch = Number(nav.maxTouchPoints || 0);
  if (/windows|macintosh|linux x86|x11/.test(ua) || /win|mac|linux/.test(platform)) return touch <= 2;
  return false;
}
function desktopAccessDeviceRecord(hash) {
  return desktopAccessState?.devices?.[hash] || null;
}
function isDesktopGraceActive(state = desktopAccessState, now = Date.now()) {
  const grace = state?.grace || {};
  return grace.enabled === true && Number(grace.expiresAt || 0) > now;
}
function desktopDeviceApproved(hash, state = desktopAccessState) {
  const row = state?.devices?.[hash] || {};
  return row.enabled !== false && row.status === 'approved' && row.isDesktop === true;
}
async function fetchPublicIp() {
  try {
    const res = await fetch('https://api.ipify.org?format=json', { cache: 'no-store' });
    if (!res.ok) return '';
    const data = await res.json();
    return String(data.ip || '').slice(0, 80);
  } catch {
    return '';
  }
}
function desktopDevicePayload(device, hash, extra = {}) {
  const now = Date.now();
  return {
    deviceHash: hash,
    deviceName: String(device?.name || '단말').slice(0, 60),
    userAgent: String(navigator.userAgent || '').slice(0, 240),
    platform: String(navigator.platform || '').slice(0, 80),
    language: String(navigator.language || '').slice(0, 40),
    isDesktop: isLikelyDesktopClient(),
    lastSeen: now,
    lastSeenKst: new Date(now + 9 * 3600000).toISOString().replace('T', ' ').slice(0, 19),
    ...extra
  };
}
async function loadDesktopAccessState(silent = true) {
  try {
    const res = await fetch(`${FB_URL}${DESKTOP_ACCESS_PATH}.json?_=` + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    desktopAccessState = await res.json() || { devices: {}, grace: {} };
    renderDesktopAccessPanel();
    return desktopAccessState;
  } catch (e) {
    console.warn('[desktopAccess] load failed', e);
    if (!silent) toast('접근관리 로드 실패');
    return desktopAccessState || { devices: {}, grace: {} };
  }
}
async function patchDesktopDevice(hash, payload) {
  const res = await fetch(`${FB_URL}${DESKTOP_ACCESS_PATH}/devices/${hash}.json`, {
    method: 'PATCH',
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
}
async function recordDesktopAuthCandidate(device, hash, reason = 'gps_unavailable', state = desktopAccessState) {
  const existing = state?.devices?.[hash] || {};
  const ip = await fetchPublicIp();
  const status = existing.status === 'approved' ? 'approved' : (isDesktopGraceActive(state) ? 'candidate' : 'pending');
  const payload = desktopDevicePayload(device, hash, {
    status,
    enabled: existing.enabled !== false,
    firstSeen: existing.firstSeen || Date.now(),
    recentIp: ip || existing.recentIp || '',
    reason,
    approvedAt: existing.approvedAt || null,
    approvedBy: existing.approvedBy || ''
  });
  await patchDesktopDevice(hash, payload);
  desktopAccessState.devices = { ...(desktopAccessState.devices || {}), [hash]: { ...existing, ...payload } };
  renderDesktopAccessPanel();
  return payload;
}
function geoConfigured() {
  return typeof AUTH_GEO.storeLat === 'number' && typeof AUTH_GEO.storeLng === 'number';
}
function distanceM(lat1, lon1, lat2, lon2) {
  const R = 6371000, toRad = v => v * Math.PI / 180;
  const p1 = toRad(lat1), p2 = toRad(lat2), dp = toRad(lat2 - lat1), dl = toRad(lon2 - lon1);
  const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error('GPS 사용 불가')); return; }
    navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  });
}
function hasTrustedIpFactor() {
  // Static client cannot trust X-Forwarded-For or similar headers; reserve IP factor for server/hosting enforcement.
  return false;
}
async function verifyGps() {
  if (AUTH_DEBUG) return 'debug';
  if (!geoConfigured()) throw new Error('매장 GPS 기준 설정 필요');
  const pos = await getPosition();
  const meter = distanceM(pos.coords.latitude, pos.coords.longitude, AUTH_GEO.storeLat, AUTH_GEO.storeLng);
  if (meter > AUTH_GEO.radiusM) throw new Error(`매장 ${AUTH_GEO.radiusM}m 반경 밖입니다 (${Math.round(meter)}m)`);
  return 'gps';
}
async function verifyAuthFactor() {
  const device = ensureAuthDevice();
  if (await hasAllowedAuthDevice(device)) return 'device';
  const hash = await deviceHashText(device);
  const state = await loadDesktopAccessState(true);
  if (desktopDeviceApproved(hash, state)) {
    await recordDesktopAuthCandidate(device, hash, 'approved_desktop', state).catch(e => console.warn('[desktopAccess] approved touch failed', e));
    return 'desktop';
  }
  if (hasTrustedIpFactor()) return 'ip';
  try {
    return await verifyGps();
  } catch (e) {
    if (isLikelyDesktopClient() || String(e?.message || '').includes('GPS')) {
      await recordDesktopAuthCandidate(device, hash, e?.message || 'gps_unavailable', state).catch(err => console.warn('[desktopAccess] candidate write failed', err));
      if (isDesktopGraceActive(state)) return 'desktop-grace';
      throw new Error(`GPS 확인 실패. 데스크탑 후보로 기록됨: ${hash.slice(0, 12)}`);
    }
    throw e;
  }
}
function factorLabel(factor) {
  if (factor === 'device') return '인증 단말';
  if (factor === 'desktop') return '승인 데스크탑';
  if (factor === 'desktop-grace') return '임시 데스크탑';
  if (factor === 'gps') return 'GPS';
  if (factor === 'debug') return '개발 GPS 우회';
  if (factor === 'ip') return '허용 IP';
  return 'factor';
}
function desktopAccessTimeText(ms) {
  const n = Number(ms || 0);
  if (!Number.isFinite(n) || n <= 0) return '-';
  return new Date(n).toLocaleString('ko-KR', { hour12: false });
}
function desktopAccessStatusText(status) {
  if (status === 'approved') return '승인';
  if (status === 'candidate') return '후보';
  return '대기';
}
function renderDesktopAccessPanel() {
  const meta = document.getElementById('desktopAccessMeta');
  const body = document.getElementById('desktopAccessBody');
  if (!meta || !body) return;
  const state = desktopAccessState || { devices: {}, grace: {} };
  const graceActive = isDesktopGraceActive(state);
  const expiresAt = Number(state.grace?.expiresAt || 0);
  meta.textContent = graceActive
    ? `임시 개방 중 · 만료 ${desktopAccessTimeText(expiresAt)}`
    : '임시 개방 꺼짐';
  const rows = Object.entries(state.devices || {})
    .map(([hash, row]) => ({ hash, row }))
    .sort((a, b) => Number(b.row.lastSeen || 0) - Number(a.row.lastSeen || 0));
  if (!rows.length) {
    body.innerHTML = '<div class="sfa-panel-meta">등록된 데스크탑 후보 없음</div>';
    return;
  }
  body.innerHTML = rows.map(({ hash, row }) => {
    const status = row.status === 'approved' ? 'approved' : 'pending';
    const detail = [
      row.deviceName || '단말',
      row.recentIp ? `IP ${row.recentIp}` : 'IP 미확인',
      row.platform || '',
      row.lastSeen ? `최근 ${desktopAccessTimeText(row.lastSeen)}` : ''
    ].filter(Boolean).join(' · ');
    const ua = String(row.userAgent || '').slice(0, 90);
    const approveButton = row.status === 'approved'
      ? '<span class="sfa-panel-meta">승인됨</span>'
      : `<button type="button" onclick="approveDesktopDevice('${escapeHtml(hash)}')">승인</button>`;
    return `<div class="desktop-access-row ${status}">
      <div class="sfa-match-status">${escapeHtml(desktopAccessStatusText(row.status))}</div>
      <div>
        <div class="sfa-match-name">${escapeHtml(hash.slice(0, 16))}</div>
        <div class="sfa-match-meta">${escapeHtml(detail)}<br>${escapeHtml(ua)}</div>
      </div>
      <div class="sfa-match-meta">${escapeHtml(row.reason || '')}</div>
      <div>${approveButton}</div>
    </div>`;
  }).join('');
}
async function toggleDesktopAccessPanel() {
  desktopAccessVisible = !desktopAccessVisible;
  const panel = document.getElementById('desktopAccessPanel');
  if (!panel) return;
  panel.classList.toggle('hidden', !desktopAccessVisible);
  if (desktopAccessVisible) await loadDesktopAccessState(false);
  updateStickyOffsets();
}
function hideDesktopAccessPanel() {
  desktopAccessVisible = false;
  document.getElementById('desktopAccessPanel')?.classList.add('hidden');
  updateStickyOffsets();
}
async function currentDesktopHashAndDevice() {
  const device = ensureAuthDevice();
  return { device, hash: await deviceHashText(device) };
}
async function recordCurrentDesktopCandidate() {
  try {
    const state = await loadDesktopAccessState(true);
    const { device, hash } = await currentDesktopHashAndDevice();
    await recordDesktopAuthCandidate(device, hash, 'manual_candidate', state);
    toast('현재 단말 후보 등록됨');
  } catch (e) {
    console.warn('[desktopAccess] candidate failed', e);
    toast('현재 단말 후보 등록 실패');
  }
}
async function approveDesktopDevice(hash) {
  try {
    const now = Date.now();
    await patchDesktopDevice(hash, {
      status: 'approved',
      enabled: true,
      approvedAt: now,
      approvedAtKst: new Date(now + 9 * 3600000).toISOString().replace('T', ' ').slice(0, 19),
      approvedBy: 'orderhelper_ui'
    });
    await loadDesktopAccessState(true);
    toast('데스크탑 단말 승인됨');
  } catch (e) {
    console.warn('[desktopAccess] approve failed', e);
    toast('데스크탑 승인 실패');
  }
}
async function approveCurrentDesktopDevice() {
  try {
    await recordCurrentDesktopCandidate();
    const { hash } = await currentDesktopHashAndDevice();
    await approveDesktopDevice(hash);
  } catch (e) {
    console.warn('[desktopAccess] current approve failed', e);
    toast('현재 단말 승인 실패');
  }
}
async function startDesktopGraceWindow() {
  try {
    const now = Date.now();
    const payload = {
      enabled: true,
      startedAt: now,
      expiresAt: now + DESKTOP_GRACE_MS,
      updatedAt: now,
      updatedBy: 'orderhelper_ui'
    };
    const res = await fetch(`${FB_URL}${DESKTOP_ACCESS_PATH}/grace.json`, { method: 'PUT', body: JSON.stringify(payload) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    await loadDesktopAccessState(true);
    toast('24시간 데스크탑 임시 개방 시작');
  } catch (e) {
    console.warn('[desktopAccess] grace start failed', e);
    toast('임시 개방 시작 실패');
  }
}
async function stopDesktopGraceWindow() {
  try {
    const now = Date.now();
    const payload = { enabled: false, updatedAt: now, updatedBy: 'orderhelper_ui' };
    const res = await fetch(`${FB_URL}${DESKTOP_ACCESS_PATH}/grace.json`, { method: 'PATCH', body: JSON.stringify(payload) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    await loadDesktopAccessState(true);
    toast('데스크탑 임시 개방 종료');
  } catch (e) {
    console.warn('[desktopAccess] grace stop failed', e);
    toast('임시 개방 종료 실패');
  }
}
function unlockOrderHelper() {
  document.body.classList.remove('auth-locked');
  document.getElementById('pinOverlay').classList.add('authed');
  if (!orderHelperStarted) startOrderHelperApp();
}
async function checkPin() {
  const inp = document.getElementById('pinInput');
  if (Date.now() < pinLockUntil) {
    const sec = Math.ceil((pinLockUntil - Date.now()) / 1000);
    setPinMessage(`잠시 후 다시 시도 (${sec}초)`);
    inp.value = '';
    return;
  }
  setPinMessage('인증 확인 중...');
  if (!crypto.subtle) {
    setPinMessage('이 브라우저는 PIN 검증을 지원하지 않습니다');
    inp.value = '';
    return;
  }
  const h = await hashPin(inp.value);
  if (h === PIN_HASH) {
    try {
      const factor = await verifyAuthFactor();
      pinAttempts = 0;
      localStorage.removeItem('bbq_desk_auth_until');
      sessionStorage.removeItem('bbq_desk_auth');
      setPinMessage(`인증됨 (${factorLabel(factor)})`, true);
      inp.value = '';
      unlockOrderHelper();
    } catch (e) {
      setPinMessage(e.message || '인증 실패');
      inp.value = '';
    }
  } else {
    pinAttempts++;
    if (pinAttempts >= PIN_MAX_ATTEMPTS) {
      pinLockUntil = Date.now() + PIN_LOCK_MS;
      pinAttempts = 0;
      setPinMessage(`${PIN_MAX_ATTEMPTS}회 틀림 — ${PIN_LOCK_MS/1000}초 후 다시 시도`);
    } else {
      setPinMessage(`비밀번호 틀림 (${pinAttempts}/${PIN_MAX_ATTEMPTS})`);
    }
    inp.value = '';
    setTimeout(() => { setPinMessage(''); }, 1800);
  }
}

function canonicalItemName(name) {
  return ITEM_NAME_ALIASES[name] || name;
}

function legacyItemNames(name) {
  return Object.entries(ITEM_NAME_ALIASES)
    .filter(([, next]) => next === name)
    .map(([old]) => old);
}

function knownItemNameSet() {
  return new Set(MASTER.map(item => item.name));
}

function migrateEntriesByName(source = entries) {
  const known = knownItemNameSet();
  return (Array.isArray(source) ? source : [])
    .map(entry => ({ ...entry, name: canonicalItemName(entry?.name || '') }))
    .filter(entry => known.has(entry.name));
}

function migrateNamedObject(source = {}) {
  const known = knownItemNameSet();
  const out = {};
  Object.entries(source || {}).forEach(([name, value]) => {
    const nextName = canonicalItemName(name);
    if (!known.has(nextName)) return;
    if (value && typeof value === 'object' && !Array.isArray(value)) {
      out[nextName] = { ...(out[nextName] || {}), ...value };
    } else {
      out[nextName] = value;
    }
  });
  return out;
}

function migrateOutputOrder(order = outputOrder) {
  return (Array.isArray(order) ? order : []).map(name => canonicalItemName(name));
}

function sanitizeOrderSiteMappings(source = {}) {
  const known = knownItemNameSet();
  const out = {};
  Object.entries(source || {}).forEach(([key, value]) => {
    if (!key || !value || typeof value !== 'object' || Array.isArray(value)) return;
    const targetName = canonicalItemName(value.targetName || '');
    if (!known.has(targetName)) return;
    out[key] = {
      targetName,
      siteName: String(value.siteName || '').slice(0, 120),
      siteUnit: String(value.siteUnit || '').slice(0, 40),
      updatedAt: Number(value.updatedAt || Date.now())
    };
  });
  return out;
}

function sanitizeOrderAliasMappings(source = {}) {
  const known = knownItemNameSet();
  const out = {};
  const allowedStatuses = new Set(['candidate', 'default', 'confirmed', 'manual']);
  Object.entries(source || {}).forEach(([key, value]) => {
    if (!key || !value || typeof value !== 'object' || Array.isArray(value)) return;
    const aliasName = canonicalItemName(value.aliasName || key);
    if (!known.has(aliasName)) return;
    const actualName = String(value.actualName || value.targetName || '').trim().slice(0, 160);
    if (!actualName) return;
    const row = {
      aliasName,
      actualName,
      actualUnit: String(value.actualUnit || value.siteUnit || '').slice(0, 40),
      status: allowedStatuses.has(value.status) ? value.status : 'confirmed',
      source: String(value.source || 'user').slice(0, 40),
      score: Number.isFinite(Number(value.score)) ? Number(value.score) : 0,
      reason: String(value.reason || '').slice(0, 240),
      updatedAt: Number(value.updatedAt || Date.now())
    };
    const conversionFactor = sanitizePositiveNumber(value.conversionFactor ?? value.factor);
    if (conversionFactor) {
      row.conversionFactor = conversionFactor;
      row.conversionStatus = allowedStatuses.has(value.conversionStatus) ? value.conversionStatus : 'default';
      row.conversionSource = String(value.conversionSource || value.source || '').slice(0, 60);
      row.conversionScore = Number.isFinite(Number(value.conversionScore)) ? Number(value.conversionScore) : 0;
      row.conversionReason = String(value.conversionReason || '').slice(0, 240);
    }
    out[aliasName] = row;
  });
  return out;
}

function sanitizePositiveNumber(value) {
  const n = Number(value);
  return Number.isFinite(n) && n > 0 ? n : null;
}

function sanitizeOrderUnitCorrections(source = {}) {
  const known = knownItemNameSet();
  const out = {};
  Object.entries(source || {}).forEach(([name, value]) => {
    const itemName = canonicalItemName(name || '');
    if (!known.has(itemName) || !value || typeof value !== 'object' || Array.isArray(value)) return;
    const row = {};
    const factor = sanitizePositiveNumber(value.factor);
    const orderMultiple = sanitizePositiveNumber(value.orderMultiple);
    const minOrderQty = sanitizePositiveNumber(value.minOrderQty);
    if (factor) row.factor = factor;
    if (orderMultiple) row.orderMultiple = orderMultiple;
    if (minOrderQty) row.minOrderQty = minOrderQty;
    if (value.packUnit) row.packUnit = String(value.packUnit).slice(0, 40);
    if (Object.keys(row).length) {
      row.updatedAt = Number(value.updatedAt || Date.now());
      out[itemName] = row;
    }
  });
  return out;
}

function migrateRuntimeItemNames() {
  entries = migrateEntriesByName(entries);
  overrides = migrateNamedObject(overrides);
  outputOrder = migrateOutputOrder(outputOrder);
  actualOrders = migrateNamedObject(actualOrders);
  orderSiteMappings = sanitizeOrderSiteMappings(orderSiteMappings);
  orderAliasMappings = sanitizeOrderAliasMappings(orderAliasMappings);
  orderUnitCorrections = sanitizeOrderUnitCorrections(orderUnitCorrections);
  touchCurrentStateRevision();
}

function storedStockForName(stocks, name) {
  if (!stocks || typeof stocks !== 'object') return null;
  if (Object.prototype.hasOwnProperty.call(stocks, name)) return stocks[name];
  for (const oldName of legacyItemNames(name)) {
    if (Object.prototype.hasOwnProperty.call(stocks, oldName)) return stocks[oldName];
  }
  return null;
}

let nextId = 1;
const SAVE_LOG_LIMIT = 8;
const SAVE_LOG_STORAGE_KEY = 'bbq_save_logs';
const DEBUG_LOG_LIMIT = 40;
const DEBUG_LOG_STORAGE_KEY = 'bbq_debug_logs';
const OUTPUT_ORDER_STORAGE_KEY = 'bbq_output_order';
const ACTUAL_ORDER_STORAGE_KEY = 'bbq_actual_orders';
const ACTUAL_ORDER_DATE_STORAGE_KEY = 'bbq_actual_orders_date';
const ORDER_SITE_MAPPING_STORAGE_KEY = 'bbq_order_site_mappings';
const ORDER_ALIAS_MAPPING_STORAGE_KEY = 'bbq_order_alias_mappings';
const ORDER_UNIT_CORRECTION_STORAGE_KEY = 'bbq_order_unit_corrections';
const SFA_MANUAL_ITEMS_STORAGE_KEY = 'bbq_sfa_manual_items';
const ORDER_DAYS_RULE_STORAGE_KEY = 'bbq_orderDaysRuleVersion';
const ORDER_DAYS_RULE_VERSION = '20260607-thu-fri-4';
function newId() { return 'e' + (nextId++); }

function baseDailyUsage(item) {
  return overrides[item.name]?.l ?? (item.daily || 0);
}
function getL(item) {
  return baseDailyUsage(item);
}
function getK(item) { return overrides[item.name]?.k ?? (item.buffer || 0); }
function totalStock(name) {

    .reduce((s, e) => s + (e.stock != null && e.stock !== '' ? Number(e.stock) : 0), 0);
}
function todayKST() {
  const k = new Date(Date.now() + 9 * 3600000);
  return k.toISOString().slice(0, 10);
}
function isItemHidden(name) {
  const u = overrides[name]?.hideUntil;
  if (!u) return false;
  return todayKST() < u;
}
function daysUntilReturn(name) {
  const u = overrides[name]?.hideUntil;
  if (!u) return 0;
  const now = new Date();
  const ret = new Date(u + 'T00:00:00+09:00');
  return Math.max(0, Math.ceil((ret - now) / 86400000));
}

function sanitizeSnoozeDaysInput(input) {
  if (!input) return '';
  const digits = String(input.value || '').replace(/\D/g, '').slice(0, 3);
  if (input.value !== digits) input.value = digits;
  return digits;
}

function parseSnoozeDays(value) {
  const days = parseInt(String(value || '').replace(/\D/g, ''), 10);
  if (!Number.isFinite(days) || days < 1) return null;
  return Math.min(days, MAX_SNOOZE_DAYS);
}

function openSnoozeDialog(name) {
  pendingSnoozeName = name;
  const overlay = document.getElementById('snoozeOverlay');
  const title = document.getElementById('snoozeTitle');
  const input = document.getElementById('snoozeDaysInput');
  if (!overlay || !title || !input) return;
  title.textContent = `${name} 숨김`;
  input.value = String(DEFAULT_SNOOZE_DAYS);
  overlay.classList.remove('hidden');
  setTimeout(() => {
    input.focus();
    input.select();
  }, 0);
}

function closeSnoozeDialog() {
  pendingSnoozeName = null;
  document.getElementById('snoozeOverlay')?.classList.add('hidden');
}

function applySnoozeItem(name, days) {
  if (!name) return;
  const ret = new Date(Date.now() + 9 * 3600000);
  ret.setUTCDate(ret.getUTCDate() + days);
  if (!overrides[name]) overrides[name] = {};
  overrides[name].hideUntil = ret.toISOString().slice(0, 10);
  saveLocal();
  render();
}

function confirmSnooze(event) {
  event?.preventDefault();
  const input = document.getElementById('snoozeDaysInput');
  const days = parseSnoozeDays(sanitizeSnoozeDaysInput(input));
  if (!days) {
    if (input) {
      input.value = String(DEFAULT_SNOOZE_DAYS);
      input.focus();
      input.select();
    }
    return;
  }
  applySnoozeItem(pendingSnoozeName, days);
  closeSnoozeDialog();
}

function snoozeItem(name) {
  openSnoozeDialog(name);
}

function unsnoozeItem(name) {
  if (overrides[name]) {
    delete overrides[name].hideUntil;
    if (Object.keys(overrides[name]).length === 0) delete overrides[name];
  }
  saveLocal();
  render();
}

function setOverrideValue(name, field, value) {
  if (!name || (field !== 'k' && field !== 'l')) return;
  if (!overrides[name]) overrides[name] = {};
  const num = value === '' ? null : parseFloat(value);
  if (num === null || !Number.isFinite(num)) delete overrides[name][field];
  else overrides[name][field] = num;
  if (Object.keys(overrides[name]).length === 0) delete overrides[name];
  touchCurrentStateRevision();
}

function setOutputStockTotal(name, value) {
  const sameEntries = entries.filter(entry => entry.name === name);
  if (sameEntries.length === 0) return;
  const num = value === '' ? null : parseFloat(value);
  sameEntries.forEach((entry, idx) => {
    if (idx === 0) entry.stock = Number.isFinite(num) ? num : null;
    else entry.stock = null;
  });
  touchCurrentStateRevision();
}

function cleanActualOrders(source = actualOrders) {
  const known = knownItemNameSet();
  const cleaned = {};
  Object.entries(source || {}).forEach(([name, value]) => {
    const nextName = canonicalItemName(name);
    const n = Number(value);
    if (known.has(nextName) && Number.isFinite(n) && n >= 0) cleaned[nextName] = n;
  });
  return cleaned;
}

function getActualOrder(name, source = actualOrders) {
  const candidates = [name, canonicalItemName(name), ...legacyItemNames(name)];
  for (const key of candidates) {
    if (!Object.prototype.hasOwnProperty.call(source || {}, key)) continue;
    const n = Number(source[key]);
    if (Number.isFinite(n) && n >= 0) return n;
  }
  return null;
}

function sfaActualOrdersForDateKey(dateKey) {
  const key = normalizeHistoryDateKey(dateKey);
  if (!key || !sfaActualHistory || typeof sfaActualHistory !== 'object') return {};
  const record = sfaActualHistory[key];
  return cleanActualOrders(record?.actualOrders || {});
}

function actualOrderForInterval(prev, curr, name) {
  const start = normalizeHistoryDateKey(prev?.dateKey);
  const end = normalizeHistoryDateKey(curr?.dateKey);
  if (!start || !end) return null;
  let qty = 0;
  const dates = [];
  Object.entries(sfaActualHistory || {}).forEach(([key, record]) => {
    if (key === 'latest') return;
    const dateKey = normalizeHistoryDateKey(record?.orderDateKey || record?.orderDate || key);
    if (!dateKey || dateKey <= start || dateKey > end) return;
    const actual = getActualOrder(name, record?.actualOrders || {});
    if (actual === null || actual <= 0) return;
    qty += actual;
    dates.push(dateKey);
  });
  if (qty > 0) return { qty, source: 'sfa', dates };
  const legacy = getActualOrder(name, prev?.actualOrders || {});
  if (legacy !== null && legacy > 0) return { qty: legacy, source: 'actualOrders', dates: [start] };
  return null;
}

function setActualOrderValue(name, value) {
  if (!name) return;
  const num = value === '' ? null : parseFloat(value);
  if (num === null || !Number.isFinite(num) || num < 0) delete actualOrders[name];
  else actualOrders[name] = Math.ceil(num);
  actualOrders = cleanActualOrders();
  touchCurrentStateRevision();
}

function normalizeOrderUnit(unit) {
  const value = String(unit || '').trim().toLowerCase().replace(/\s+/g, '');
  if (!value) return '';
  if (['box', '박스', '박'].includes(value)) return 'box';
  if (['ea', '개'].includes(value)) return 'ea';
  if (['bon', '봉'].includes(value)) return 'bon';
  if (['묶', '묶음'].includes(value)) return 'bundle';
  return value;
}

function orderUnitParts(item) {
  const raw = String(item?.unit || '').trim();
  const parts = raw.split('/').map(part => part.trim()).filter(Boolean);
  const checkUnit = parts[0] || raw || '';
  const orderUnit = parts[1] || checkUnit;
  const checkUnitKey = normalizeOrderUnit(checkUnit);
  const orderUnitKey = normalizeOrderUnit(orderUnit);
  return {
    checkUnit,
    orderUnit,
    checkUnitKey,
    orderUnitKey,
    same: Boolean(checkUnitKey && orderUnitKey && checkUnitKey === orderUnitKey)
  };
}

function roundOrderQty(value) {
  const n = Number(value);
  if (!Number.isFinite(n) || n <= 0) return 0;
  return Math.ceil((n - 1e-9) * 10) / 10;
}

function calcRowFromRecord(record, name) {
  const calc = record?.calc || {};
  return calc[name] || calc[canonicalItemName(name)] || legacyItemNames(name).map(oldName => calc[oldName]).find(Boolean);
}

function stockNeedFromRecord(record, name) {
  const row = calcRowFromRecord(record, name);
  const stockNeed = Number(row?.stockNeed);
  if (Number.isFinite(stockNeed) && stockNeed > 0) return stockNeed;
  const legacyQty = Number(row?.qty);
  return Number.isFinite(legacyQty) && legacyQty > 0 ? legacyQty : 0;
}

function summarizeFactors(values) {
  const clean = values.filter(v => Number.isFinite(v) && v > 0).sort((a, b) => a - b);
  if (clean.length === 0) return null;
  const mid = Math.floor(clean.length / 2);
  const median = clean.length % 2 ? clean[mid] : (clean[mid - 1] + clean[mid]) / 2;
  const avg = clean.reduce((a, b) => a + b, 0) / clean.length;
  const min = clean[0];
  const max = clean[clean.length - 1];
  return { factor: median, avg, samples: clean.length, min, max, spread: max / Math.max(min, 1e-9) };
}

function unitKeyForItem(item) {
  const parts = orderUnitParts(item);
  return `${parts.checkUnitKey || parts.checkUnit || '-'}>${parts.orderUnitKey || parts.orderUnit || '-'}`;
}

function conversionFactorFromRecord(record, item) {
  const actual = getActualOrder(item.name, record?.actualOrders || {});
  const stockNeed = stockNeedFromRecord(record, item.name);
  if (actual === null || actual <= 0 || stockNeed <= 0) return null;
  const parts = orderUnitParts(item);
  if (parts.same) return 1;
  const factor = stockNeed / actual;
  if (!Number.isFinite(factor) || factor < 1.5) return null;
  return factor;
}

function movementConversionFactorFromRecords(prev, curr, item) {
  const intervalActual = actualOrderForInterval(prev, curr, item.name);
  const actual = Number(intervalActual?.qty || 0);
  if (!Number.isFinite(actual) || actual <= 0) return null;
  if (!prev?.stockMap?.has(item.name) || !curr?.stockMap?.has(item.name)) return null;
  const gapDays = (curr.dayMs - prev.dayMs) / 86400000;
  if (!Number.isFinite(gapDays) || gapDays <= 0 || gapDays > 10) return null;
  const prevStock = Number(prev.stockMap.get(item.name));
  const currStock = Number(curr.stockMap.get(item.name));
  if (!Number.isFinite(prevStock) || !Number.isFinite(currStock)) return null;
  const expectedUsage = Math.max(0, baseDailyUsage(item) * gapDays);
  const observedDelivery = currStock - prevStock + expectedUsage;
  if (!Number.isFinite(observedDelivery) || observedDelivery <= 0) return null;
  const factor = observedDelivery / actual;
  if (!Number.isFinite(factor) || factor < 1.2 || factor > 200) return null;
  return factor;
}

function isUsableMovementSummary(item, summary) {
  if (!summary || !Number.isFinite(summary.factor) || summary.factor <= 0) return false;
  const parts = orderUnitParts(item);
  if (!parts.checkUnitKey || !parts.orderUnitKey) return false;
  if (!parts.same) return summary.samples >= 1;
  return Number(summary.samples || 0) >= 2 && Number(summary.spread || 999) <= 1.35;
}

function buildConversionAnalysis(history, currentSnapshot) {
  const records = historyRecordsWithCurrent(history, currentSnapshot);
  const itemBuckets = {};
  const movementBuckets = {};
  const unitBuckets = {};
  records.forEach(record => {
    MASTER.forEach(item => {
      const factor = conversionFactorFromRecord(record, item);
      if (!factor) return;
      const key = unitKeyForItem(item);
      (itemBuckets[item.name] ||= []).push(factor);
      (unitBuckets[key] ||= []).push(factor);
    });
  });
  for (let i = 1; i < records.length; i++) {
    const prev = records[i - 1];
    const curr = records[i];
    MASTER.forEach(item => {
      const factor = movementConversionFactorFromRecords(prev, curr, item);
      if (!factor) return;
      const key = unitKeyForItem(item);
      (movementBuckets[item.name] ||= []).push(factor);
      (unitBuckets[key] ||= []).push(factor);
    });
  }

  const unitSummary = {};
  Object.entries(unitBuckets).forEach(([key, values]) => {
    const summary = summarizeFactors(values);
    if (summary) unitSummary[key] = summary;
  });

  const result = {};
  MASTER.forEach(item => {
    const parts = orderUnitParts(item);
    if (!parts.checkUnitKey || !parts.orderUnitKey) {
      result[item.name] = {
        factor: null,
        samples: 0,
        source: 'pending',
        checkUnit: parts.checkUnit,
        orderUnit: parts.orderUnit
      };
      return;
    }
    const movement = summarizeFactors(movementBuckets[item.name] || []);
    if (isUsableMovementSummary(item, movement)) {
      result[item.name] = { ...movement, source: 'movement', checkUnit: parts.checkUnit || '재고', orderUnit: parts.orderUnit || '발주' };
      return;
    }
    if (parts.same) {
      result[item.name] = { factor: 1, samples: 0, source: 'same', checkUnit: parts.checkUnit, orderUnit: parts.orderUnit };
      return;
    }
    const own = summarizeFactors(itemBuckets[item.name] || []);
    if (own) {
      result[item.name] = { ...own, source: 'item', checkUnit: parts.checkUnit, orderUnit: parts.orderUnit };
      return;
    }
    const pair = unitSummary[unitKeyForItem(item)];
    result[item.name] = {
      factor: pair?.factor || null,
      samples: pair?.samples || 0,
      source: pair ? 'unit' : 'pending',
      checkUnit: parts.checkUnit,
      orderUnit: parts.orderUnit
    };
  });
  return result;
}

function unitCorrectionForItem(name) {
  const correction = orderUnitCorrections[canonicalItemName(name || '')];
  return correction && typeof correction === 'object' ? correction : {};
}

function hasManualUnitCorrection(name) {
  const correction = unitCorrectionForItem(name);
  return Object.keys(correction).some(key => key !== 'updatedAt');
}

function manualUnitFactorForItem(item) {
  const factor = sanitizePositiveNumber(unitCorrectionForItem(item?.name).factor);
  return factor || null;
}

function aliasConversionForItem(item) {
  const alias = orderAliasMappings[canonicalItemName(item?.name || '')];
  if (!alias || typeof alias !== 'object') return null;
  const factor = normalizeConversionFactor(alias.conversionFactor);
  if (!factor) return null;
  const parts = orderUnitParts(item);
  const actualUnit = String(alias.actualUnit || '').trim();
  const actualUnitKey = normalizeOrderUnit(actualUnit);
  return {
    factor,
    actualName: String(alias.actualName || '').trim(),
    actualUnit,
    status: String(alias.conversionStatus || alias.status || '').trim(),
    reason: String(alias.conversionReason || alias.reason || '').trim(),
    updatedAt: Number(alias.updatedAt || 0),
    orderUnitChanged: Boolean(actualUnitKey && parts.orderUnitKey && actualUnitKey !== parts.orderUnitKey)
  };
}

function orderUnitResolutionText(item, contract = resolveOrderUnitContract(item)) {
  const parts = orderUnitParts(item);
  if (contract.resolved) {
    if (contract.source === 'same') return '동일 단위';
    if (contract.source === 'manual') return `수동 보정 ${fmt(contract.factor, 1)}`;
    if (contract.source === 'confirmed') return `확정 보정 ${fmt(contract.factor, 1)}`;
    if (contract.source === 'movement') return `재고추정 ${fmt(contract.factor, 1)}`;
    if (contract.source === 'item' || contract.source === 'unit') return `${parts.checkUnit}/${parts.orderUnit} ${fmt(contract.factor, 1)}`;
    return `단위 ${fmt(contract.factor, 1)}`;
  }
  if (!parts.checkUnitKey && !parts.orderUnitKey) return '체크/발주 단위 정보가 없습니다';
  if (!parts.checkUnitKey || !parts.orderUnitKey) return '체크/발주 단위가 하나만 있어 발주 수량을 계산할 수 없습니다';
  return `체크/발주 단위가 아직 확정되지 않았습니다: ${parts.checkUnit || '-'} / ${parts.orderUnit || '-'}`;
}

function resolveOrderUnitContract(item) {
  const parts = orderUnitParts(item);
  const manual = unitCorrectionForItem(item?.name);
  const manualFactor = manualUnitFactorForItem(item);
  if (manualFactor) {
    return { resolved: true, factor: manualFactor, source: 'manual', reason: '수동 단위 보정', updatedAt: Number(manual.updatedAt || 0) };
  }
  if (parts.same) {
    return { resolved: true, factor: 1, source: 'same', reason: '체크/발주 단위가 일치합니다', updatedAt: 0 };
  }
  const alias = aliasConversionForItem(item);
  if (alias?.orderUnitChanged) {
    return { resolved: false, factor: null, source: 'stale', reason: '저장된 SFA 단위가 현재 발주 단위와 충돌합니다', updatedAt: alias.updatedAt || 0 };
  }
  if (alias?.factor && isUserSelectedAliasStatus(alias.status)) {
    return { resolved: true, factor: alias.factor, source: 'confirmed', reason: alias.reason || '확정된 SFA 별명 보정', updatedAt: alias.updatedAt || 0, actualName: alias.actualName || '', actualUnit: alias.actualUnit || '' };
  }
  if (!parts.checkUnitKey || !parts.orderUnitKey) {
    return { resolved: false, factor: null, source: 'pending', reason: '체크/발주 단위 정보가 부족합니다', updatedAt: alias?.updatedAt || 0 };
  }
  const analysis = conversionAnalysis[item.name];
  if (analysis?.source === 'movement' && Number.isFinite(analysis.factor) && analysis.factor > 0) {
    return { resolved: true, factor: analysis.factor, source: 'movement', reason: '재고 이동 기반 보정', updatedAt: 0, analysis };
  }
  if (analysis?.source === 'item' && Number.isFinite(analysis.factor) && analysis.factor > 0) {
    return { resolved: true, factor: analysis.factor, source: 'item', reason: '품목 이력 기반 보정', updatedAt: 0, analysis };
  }
  if (
    analysis?.source === 'unit' &&
    Number.isFinite(analysis.factor) &&
    analysis.factor > 0 &&
    Number(analysis.samples || 0) >= 3 &&
    Number(analysis.spread || 999) <= 1.25
  ) {
    return { resolved: true, factor: analysis.factor, source: 'unit', reason: '안정적인 단위 패턴 보정', updatedAt: 0, analysis };
  }
  return { resolved: false, factor: null, source: 'pending', reason: '안전한 발주-재고 단위 변환이 아직 없습니다', updatedAt: alias?.updatedAt || 0, analysis };
}

function applyOrderUnitCorrectionQty(item, qty) {
  let out = Number(qty);
  if (!Number.isFinite(out) || out <= 0) return 0;
  const correction = unitCorrectionForItem(item?.name);
  const multiple = sanitizePositiveNumber(correction.orderMultiple);
  const minOrderQty = sanitizePositiveNumber(correction.minOrderQty);
  if (multiple) out = Math.ceil((out - 1e-9) / multiple) * multiple;
  if (minOrderQty) out = Math.max(out, minOrderQty);
  return roundOrderQty(out);
}

function conversionFactorForItem(item) {
  return resolveOrderUnitContract(item).factor || null;
}

function recommendedOrderQty(item, stockNeed) {
  const need = Number(stockNeed);
  if (!Number.isFinite(need) || need <= 0) return 0;
  const contract = resolveOrderUnitContract(item);
  if (!contract.factor) return 0;
  return applyOrderUnitCorrectionQty(item, roundOrderQty(need / contract.factor));
}

function outputOrderQty(item, days) {
  const actual = getActualOrder(item.name);
  if (actual !== null) return roundOrderQty(actual);
  return recommendedOrderQty(item, calcG(item, days));
}

function displayOrderQty(item, days) {
  return fmt(outputOrderQty(item, days), 1);
}

function displayDecimal(value) {
  return fmt(value, 1);
}

function parseMoney(value) {
  if (value === null || value === undefined || value === '') return null;
  const n = Number(String(value).replace(/[^\d.-]/g, ''));
  return Number.isFinite(n) ? n : null;
}

function formatWon(value) {
  const n = Number(value);
  if (!Number.isFinite(n) || n <= 0) return '';
  return Math.round(n).toLocaleString('ko-KR') + '원';
}

function sfaUnitPriceFromRow(row) {
  if (!row || typeof row !== 'object') return null;
  const direct = parseMoney(row.unit_price ?? row.unitPrice ?? row.sfa_unit_price ?? row.price);
  if (direct !== null && direct > 0) {
    return { unitPrice: direct, basis: 'unit_price', qty: null, amount: null };
  }
  const qty = Number(row.sfa_qty ?? row.qty);
  const amount = parseMoney(row.amount ?? row.sfa_amount ?? row.order_amount ?? row.total_amount ?? row.total);
  if (Number.isFinite(qty) && qty > 0 && amount !== null && amount > 0) {
    return { unitPrice: amount / qty, basis: 'amount/qty', qty, amount };
  }
  return null;
}

function expectedOrderAmountForItem(item, stockNeed) {
  const matched = lastSfaCompareData?.comparison?.matched || [];
  let row = matched.find(r => canonicalItemName(r?.expected_name || '') === item.name);
  if (!row && lastSfaCompareData) {
    const mapped = buildOrderSiteMatches(lastSfaCompareData).find(r => r.targetName === item.name && r.amount);
    if (mapped) row = { sfa_qty: mapped.siteQty, sfa_amount: mapped.amount, sfa_name: mapped.siteName };
  }
  const price = sfaUnitPriceFromRow(row);
  if (!price) return null;
  const recommendedQty = recommendedOrderQty(item, stockNeed);
  if (!Number.isFinite(recommendedQty) || recommendedQty <= 0) return null;
  const history = lastSfaCompareData?.historySummary || {};
  const file = lastSfaCompareData?.file || {};
  return {
    expected_order_amount: recommendedQty * price.unitPrice,
    recommended_order_qty: recommendedQty,
    unit_price: price.unitPrice,
    basis: price.basis,
    source_date: history.selectedDate || '',
    source_file: file.name || '',
    source_qty: price.qty,
    source_amount: price.amount
  };
}

function orderAnalysisText(item, stockNeed) {
  const actual = getActualOrder(item.name);
  if (actual !== null) return '확인';
  const parts = orderUnitParts(item);
  const contract = resolveOrderUnitContract(item);
  if (!contract.resolved) return orderUnitResolutionText(item, contract);
  const manualFactor = manualUnitFactorForItem(item);
  if (manualFactor) return `보정 ${fmt(manualFactor, 1)}`;
  const analysis = conversionAnalysis[item.name];
  if (contract.source === 'same') return '동일단위';
  if (contract.source === 'manual') return `보정 ${fmt(contract.factor, 1)}`;
  if (contract.source === 'confirmed') return `확정 ${fmt(contract.factor, 1)}`;
  if (analysis?.source === 'movement' && Number.isFinite(analysis.factor)) {
    return `재고추정 ${fmt(analysis.factor, 1)}`;
  }
  if (parts.same) return '미확인';
  if ((analysis?.source === 'item' || analysis?.source === 'unit') && Number.isFinite(analysis.factor)) {
    return `${parts.checkUnit}/${parts.orderUnit} ${fmt(analysis.factor, 1)}`;
  }
  if (Number(stockNeed) > 0) return '미확인';
  return '';
}

function orderAnalysisTitle(item, stockNeed) {
  const actual = getActualOrder(item.name);
  const parts = orderUnitParts(item);
  const contract = resolveOrderUnitContract(item);
  if (actual !== null) return `실발주 ${actual}${parts.orderUnit || ''} 확인`;
  if (!contract.resolved) return `단위 미확정: ${orderUnitResolutionText(item, contract)}. ${contract.reason}`;
  const manual = unitCorrectionForItem(item.name);
  const manualFactor = manualUnitFactorForItem(item);
  if (manualFactor) {
    const details = [
      `수동 단위 보정: ${conversionDirectionText(manualFactor, parts.orderUnit || '발주', parts.checkUnit || '체크')}`,
      manual.orderMultiple ? `배수 ${fmt(manual.orderMultiple, 1)}${parts.orderUnit || ''}` : '',
      manual.minOrderQty ? `최소 ${fmt(manual.minOrderQty, 1)}${parts.orderUnit || ''}` : '',
      manual.packUnit ? `포장 ${manual.packUnit}` : ''
    ].filter(Boolean);
    return details.join(' · ');
  }
  const analysis = conversionAnalysis[item.name];
  if (analysis?.source === 'movement' && Number.isFinite(analysis.factor)) {
    return `단위해석: orderUnitToStockFactor ${fmt(analysis.factor, 2)}. ${conversionDirectionText(analysis.factor, parts.orderUnit || '발주', parts.checkUnit || '체크')} (${analysis.samples}건)`;
  }
  if (analysis?.source === 'item' && Number.isFinite(analysis.factor)) {
    return `단위해석: orderUnitToStockFactor ${fmt(analysis.factor, 2)}. 품목 이력 ${analysis.samples}건 · ${conversionDirectionText(analysis.factor, parts.orderUnit || '발주', parts.checkUnit || '체크')}`;
  }
  if (analysis?.source === 'unit' && Number.isFinite(analysis.factor)) {
    const useText = conversionFactorForItem(item) ? '발주계산에 적용' : '리뷰만 표시';
    return `단위해석: orderUnitToStockFactor ${fmt(analysis.factor, 2)}. 같은 단위 기록 ${analysis.samples}건 · ${conversionDirectionText(analysis.factor, parts.orderUnit || '발주', parts.checkUnit || '체크')} (${useText})`;
  }
  if (!parts.same) return `단위 해석 대기: ${parts.orderUnit || '발주'}가 체크/${parts.checkUnit || '체크'}와 다르거나 비어 있습니다. 안전한 값이 없으면 0으로 둡니다.`;
  return 'SFA 입력이 아직 미확인입니다.';
}

// G수식 (Excel 동등 + 일별 매출 가중치 일반화). 숨김 품목은 G=0.
// weight_d = sales_d / baseSales. 비어있으면 1, 0이면 그날 사용량 0.
// 기본(가중치 모두 1): Excel과 동일 IF(E<M, SUM-M+K, SUM-E+K)
//   M = L × weight_0, SUM = L × Σweight
// 기준매출 대비 예상매출이 높으면 L(하루사용량)이 발주 기간 전체에 그대로 할증됨.
function getBaseSales() {
  const n = Number(baseSales);
  return Number.isFinite(n) && n > 0 ? n : DEFAULT_BASE_SALES;
}
function dailyWeights(days) {
  const ds = [];
  for (let i = 0; i < days; i++) ds.push(dailySales[i] != null ? dailySales[i] : null);
  const base = getBaseSales();
  return ds.map(x => {
    if (x == null) return 1;
    const n = Number(x);
    if (!Number.isFinite(n)) return 1;
    return Math.max(0, n) / base;
  });
}

function normalizeNumberArray(value) {
  return Array.isArray(value) ? value.map(x => {
    if (x === null || x === '') return null;
    const n = Number(x);
    return Number.isFinite(n) ? n : null;
  }) : [];
}

function salesWeightForInterval(record, gapDays) {
  const days = Math.max(0, Math.round(Number(gapDays) || 0));
  const weights = normalizeNumberArray(record?.salesWeights);
  if (weights.length > 0) {
    let missing = 0;
    let sum = 0;
    for (let i = 0; i < days; i++) {
      const n = weights[i];
      if (n === null) {
        missing += 1;
        sum += 1;
      } else {
        sum += Math.max(0, n);
      }
    }
    return { sum, basis: missing ? 'salesWeights_partial' : 'salesWeights', missing, fallback: missing > 0 };
  }

  const sales = normalizeNumberArray(record?.dailySales);
  if (sales.length > 0) {
    const base = Number(record?.baseSales);
    const hasBase = Number.isFinite(base) && base > 0;
    const divisor = hasBase ? base : DEFAULT_BASE_SALES;
    let missing = 0;
    let sum = 0;
    for (let i = 0; i < days; i++) {
      const n = sales[i];
      if (n === null) {
        missing += 1;
        sum += 1;
      } else {
        sum += Math.max(0, n) / divisor;
      }
    }
    return {
      sum,
      basis: hasBase ? (missing ? 'dailySales_partial' : 'dailySales') : 'dailySales_defaultBaseSales',
      missing,
      fallback: missing > 0 || !hasBase
    };
  }

  return { sum: gapDays, basis: 'gapDays_fallback', missing: days, fallback: true };
}

function calcG(item, days, options = {}) {
  if (isItemHidden(item.name)) return 0;
  const L = options.baseDaily ? baseDailyUsage(item) : getL(item);
  const K = getK(item);
  const E = totalStock(item.name);
  const weights = dailyWeights(days);
  const M = L * (weights[0] || 0);
  const totalUsage = L * weights.reduce((a, b) => a + b, 0);
  if (E < M) return totalUsage - M + K;
  return totalUsage - E + K;
}

function normalizeHistoryDateKey(value) {
  const digits = String(value || '').replace(/\D/g, '');
  return digits.length >= 8 ? digits.slice(0, 8) : '';
}

function dateKeyToDayMs(dateKey) {
  const key = normalizeHistoryDateKey(dateKey);
  if (!key) return null;
  const y = Number(key.slice(0, 4));
  const m = Number(key.slice(4, 6));
  const d = Number(key.slice(6, 8));
  if (!y || !m || !d) return null;
  return Date.UTC(y, m - 1, d);
}

function stockMapFromEntries(snapshotEntries) {
  const parts = new Map();
  (Array.isArray(snapshotEntries) ? snapshotEntries : []).forEach(entry => {
    if (!entry || !entry.name) return;
    const name = canonicalItemName(entry.name);
    const current = parts.get(name) || { rows: 0, checked: 0, total: 0 };
    current.rows += 1;
    const n = Number(entry.stock);
    if (entry.stock !== null && entry.stock !== '' && Number.isFinite(n)) {
      current.checked += 1;
      current.total += n;
    }
    parts.set(name, current);
  });
  const stockMap = new Map();
  parts.forEach((value, name) => {
    if (value.rows > 0 && value.checked === value.rows) stockMap.set(name, value.total);
  });
  return stockMap;
}

function normalizeHistoryRecord(key, snapshot) {
  if (!snapshot || !Array.isArray(snapshot.entries)) return null;
  const savedAt = Number(snapshot.savedAt);
  const dateKey = normalizeHistoryDateKey(snapshot.dateKey) ||
    normalizeHistoryDateKey(key) ||
    (Number.isFinite(savedAt) ? kstDateKey(savedAt) : '');
  const dayMs = dateKeyToDayMs(dateKey);
  if (!dateKey || dayMs === null) return null;
  const stockMap = stockMapFromEntries(snapshot.entries);
  if (stockMap.size === 0) return null;
  return {
    dateKey,
    dayMs,
    savedAt: Number.isFinite(savedAt) ? savedAt : dayMs,
    stockMap,
    actualOrders: cleanActualOrders(snapshot.actualOrders),
    calc: snapshot.calc || {},
    orderDays: Number.isFinite(Number(snapshot.orderDays)) ? Number(snapshot.orderDays) : null,
    dailySales: normalizeNumberArray(snapshot.dailySales),
    baseSales: Number.isFinite(Number(snapshot.baseSales)) && Number(snapshot.baseSales) > 0 ? Number(snapshot.baseSales) : null,
    salesWeights: normalizeNumberArray(snapshot.salesWeights)
  };
}

function currentAnalysisSnapshot() {
  const days = parseInt(document.getElementById('orderDays')?.value || recommendedDays());
  const calc = {};
  MASTER.forEach(item => {
    const g = calcG(item, days, { baseDaily: true });
    if (g > 0) calc[item.name] = { qty: outputOrderQty(item, days), stockNeed: Math.round(g * 100) / 100, unit: item.unit, stock: totalStock(item.name) };
  });
  return {
    savedAt: Date.now(),
    dateKey: kstDateKey(Date.now()),
    orderDays: days,
    entries: entries.map(entry => ({ name: entry.name, stock: entry.stock })),
    actualOrders: cleanActualOrders(),
    dailySales: normalizeNumberArray(dailySales),
    baseSales: getBaseSales(),
    salesWeights: dailyWeights(days),
    calc
  };
}

function historyRecordsWithCurrent(history, currentSnapshot) {
  const byDate = new Map();
  Object.entries(history || {}).forEach(([key, snapshot]) => {
    const record = normalizeHistoryRecord(key, snapshot);
    if (!record) return;
    const existing = byDate.get(record.dateKey);
    if (!existing || record.savedAt >= existing.savedAt) byDate.set(record.dateKey, record);
  });

  const current = normalizeHistoryRecord(currentSnapshot?.dateKey, currentSnapshot);
  if (current) {
    const existing = byDate.get(current.dateKey);
    if (existing) {
      const mergedStock = new Map(existing.stockMap);
      current.stockMap.forEach((value, name) => mergedStock.set(name, value));
      byDate.set(current.dateKey, {
        ...current,
        savedAt: Math.max(existing.savedAt, current.savedAt),
        stockMap: mergedStock,
        actualOrders: current.actualOrders || {},
        calc: current.calc || existing.calc || {},
        orderDays: current.orderDays || existing.orderDays || null,
        dailySales: current.dailySales?.length ? current.dailySales : existing.dailySales || [],
        baseSales: current.baseSales || existing.baseSales || null,
        salesWeights: current.salesWeights?.length ? current.salesWeights : existing.salesWeights || []
      });
    } else {
      byDate.set(current.dateKey, current);
    }
  }

  const sorted = Array.from(byDate.values()).sort((a, b) => (a.dayMs - b.dayMs) || (a.savedAt - b.savedAt));
  const latest = sorted[sorted.length - 1];
  if (!latest) return sorted;
  const cutoff = latest.dayMs - (USAGE_ANALYSIS_MAX_DAYS * 86400000);
  return sorted.filter(record => record.dayMs >= cutoff);
}

function orderQtyFromRecord(record, name) {
  const actual = getActualOrder(name, record?.actualOrders || {});
  if (actual !== null) {
    const item = MASTER.find(m => m.name === name);
    const orderUnitToStockFactor = item ? conversionFactorForItem(item) : null;
    const parts = item ? orderUnitParts(item) : { same: true };
    if (!orderUnitToStockFactor && !parts.same) return { qty: 0, source: 'actual_unconverted', actualQty: actual, orderUnitToStockFactor: null };
    const stockNeed = stockNeedFromRecord(record, name);
    // orderUnitToStockFactor direction: one order unit contains this many stock/check units.
    const convertedActual = orderUnitToStockFactor ? actual * orderUnitToStockFactor : actual;
    return { qty: convertedActual || stockNeed || actual, source: 'actual', actualQty: actual, orderUnitToStockFactor };
  }
  const n = Number(calcRowFromRecord(record, name)?.qty);
  return { qty: Number.isFinite(n) && n > 0 ? n : 0, source: 'calc' };
}

function orderQtyForInterval(prev, curr, name) {
  const intervalActual = actualOrderForInterval(prev, curr, name);
  if (intervalActual) {
    const item = MASTER.find(m => m.name === name);
    const orderUnitToStockFactor = item ? conversionFactorForItem(item) : null;
    const parts = item ? orderUnitParts(item) : { same: true };
    if (!orderUnitToStockFactor && !parts.same) {
      return { qty: 0, source: 'actual_unconverted', actualQty: intervalActual.qty, actualDates: intervalActual.dates, orderUnitToStockFactor: null };
    }
    const actualQty = intervalActual.qty;
    const factor = orderUnitToStockFactor || 1;
    // Convert actual SFA order units into the stock/check unit basis before usage analysis.
    const convertedActual = actualQty * factor;
    return {
      qty: convertedActual,
      source: 'actual',
      actualQty: intervalActual.qty,
      orderUnitToStockFactor: factor,
      actualDates: intervalActual.dates,
      actualSource: intervalActual.source
    };
  }
  return orderQtyFromRecord(prev, name);
}

function buildUsageAnalysis(history, currentSnapshot) {
  const records = historyRecordsWithCurrent(history, currentSnapshot);
  const acc = {};
  for (let i = 1; i < records.length; i++) {
    const prev = records[i - 1];
    const curr = records[i];
    const gapDays = (curr.dayMs - prev.dayMs) / 86400000;
    if (!Number.isFinite(gapDays) || gapDays <= 0) continue;
    MASTER.forEach(item => {
      const name = item.name;
      if (!prev.stockMap.has(name) || !curr.stockMap.has(name)) return;
      const prevStock = prev.stockMap.get(name);
      const currStock = curr.stockMap.get(name);
      const order = orderQtyForInterval(prev, curr, name);
      if (order.source === 'actual_unconverted') return;
      const orderQty = order.qty;
      const usage = order.source === 'actual'
        ? prevStock + (Number(order.actualQty || 0) * Number(order.orderUnitToStockFactor || 1)) - currStock
        : prevStock + orderQty - currStock;
      if (!Number.isFinite(usage) || usage < -0.05) return;
      const bucket = acc[name] || {
        actualUsage: 0,
        actualWeight: 0,
        actualRawDays: 0,
        actualDays: 0,
        actualSamples: 0,
        calcUsage: 0,
        calcWeight: 0,
        calcRawDays: 0,
        calcDays: 0,
        calcSamples: 0,
        salesWeightMissing: 0,
        salesWeightFallbacks: 0,
        salesWeightBasisCounts: {},
        last: null
      };
      const safeUsage = Math.max(0, usage);
      const weight = salesWeightForInterval(prev, gapDays);
      const normalizedDays = Number(weight.sum);
      if (!Number.isFinite(normalizedDays) || normalizedDays <= 0) return;
      const normalizedDaily = safeUsage / normalizedDays;
      const rawDaily = safeUsage / gapDays;
      bucket.salesWeightMissing += weight.missing || 0;
      if (weight.fallback) bucket.salesWeightFallbacks += 1;
      bucket.salesWeightBasisCounts[weight.basis] = (bucket.salesWeightBasisCounts[weight.basis] || 0) + 1;
      const isActual = order.source === 'actual';
      if (isActual) {
        bucket.actualUsage += safeUsage;
        bucket.actualWeight += normalizedDays;
        bucket.actualRawDays += gapDays;
        bucket.actualDays += normalizedDays;
        bucket.actualSamples += 1;
      } else {
        bucket.calcUsage += safeUsage;
        bucket.calcWeight += normalizedDays;
        bucket.calcRawDays += gapDays;
        bucket.calcDays += normalizedDays;
        bucket.calcSamples += 1;
      }
      bucket.last = {
        from: prev.dateKey,
        to: curr.dateKey,
        days: gapDays,
        salesWeightSum: normalizedDays,
        salesWeightBasis: weight.basis,
        salesWeightMissing: weight.missing || 0,
        usage: safeUsage,
        daily: normalizedDaily,
        rawDaily,
        orderQty,
        actualQty: order.actualQty ?? null,
        orderUnitToStockFactor: order.orderUnitToStockFactor ?? null,
        actualDates: order.actualDates || [],
        orderSource: order.source
      };
      acc[name] = bucket;
    });
  }

  const result = {};
  Object.entries(acc).forEach(([name, value]) => {
    const useActual = value.actualSamples > 0 && value.actualDays > 0;
    const totalUsage = useActual ? value.actualUsage : value.calcUsage;
    const totalDays = useActual ? value.actualDays : value.calcDays;
    const rawDays = useActual ? value.actualRawDays : value.calcRawDays;
    const samples = useActual ? value.actualSamples : value.calcSamples;
    if (samples <= 0 || totalDays <= 0 || rawDays <= 0) return;
    result[name] = {
      avg: totalUsage / totalDays,
      rawAvg: totalUsage / rawDays,
      totalUsage,
      totalDays,
      rawDays,
      samples,
      source: useActual ? 'actual' : 'calc',
      actualSamples: value.actualSamples,
      calcSamples: value.calcSamples,
      salesWeightMissing: value.salesWeightMissing,
      salesWeightFallbacks: value.salesWeightFallbacks,
      salesWeightBasisCounts: value.salesWeightBasisCounts,
      last: value.last
    };
  });
  return result;
}

function recomputeUsageAnalysis() {
  const snapshot = currentAnalysisSnapshot();
  conversionAnalysis = buildConversionAnalysis(usageHistory, snapshot);
  usageAnalysis = buildUsageAnalysis(usageHistory, snapshot);
}

function usageAnalysisTitle(analysis) {
  if (!analysis) return '';
  const last = analysis.last;
  const orderLabel = last?.orderSource === 'actual'
    ? `구간실발주 ${fmt(last.actualQty, 0)} / 환산값 발주1=체크/재고 ${fmt(last.orderUnitToStockFactor || 1, 2)} / 재고환산 ${fmt(last.orderQty, 2)}${last.actualDates?.length ? ` / ${last.actualDates.join(',')}` : ''}`
    : `전회계산발주 ${fmt(last.orderQty, 2)}`;
  const recent = last ? ` / 최근 기준매출환산 ${fmt(last.daily, 2)}/일, raw ${fmt(last.rawDaily, 2)}/일 (${last.from}→${last.to}, 매출가중 ${fmt(last.salesWeightSum, 2)}일분 ${last.salesWeightBasis}${last.salesWeightMissing ? ` missing ${last.salesWeightMissing}` : ''}, ${orderLabel})` : '';
  const basis = analysis.source === 'actual' ? '실발주+재고 실사용' : '계산발주 참고';
  const coverage = `weight coverage ${analysis.samples - analysis.salesWeightFallbacks}/${analysis.samples}, missing ${analysis.salesWeightMissing || 0}`;
  return `${basis} · 매출가중 환산 평균 ${fmt(analysis.avg, 2)}/일 · raw 평균 ${fmt(analysis.rawAvg, 2)}/일 · 누적 ${fmt(analysis.totalUsage, 2)}개/${fmt(analysis.totalDays, 1)}환산일 · ${analysis.samples}구간 · ${coverage}${recent}`;
}
