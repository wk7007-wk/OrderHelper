// PIN 잠금 (sha256("1234")). PIN 변경하려면 새 PIN의 sha256 해시로 교체.
const PIN_HASH = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
// 0510 보안 강화 — 5회 시도 후 30초 lock + 인증 7일 보존 (사용자 영향 0, brute force 차단)
const AUTH_TTL_MS = 7 * 86400000;
const PIN_MAX_ATTEMPTS = 5;
const PIN_LOCK_MS = 30000;
let pinAttempts = 0;
let pinLockUntil = 0;

async function hashPin(pin) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pin));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function checkPin() {
  const inp = document.getElementById('pinInput');
  const errEl = document.getElementById('pinError');
  if (Date.now() < pinLockUntil) {
    const sec = Math.ceil((pinLockUntil - Date.now()) / 1000);
    errEl.textContent = `잠시 후 다시 시도 (${sec}초)`;
    inp.value = '';
    return;
  }
  const h = await hashPin(inp.value);
  if (h === PIN_HASH) {
    pinAttempts = 0;
    const expiresAt = Date.now() + AUTH_TTL_MS;
    localStorage.setItem('bbq_desk_auth_until', String(expiresAt));
    sessionStorage.setItem('bbq_desk_auth', '1');
    document.getElementById('pinOverlay').classList.add('authed');
    inp.value = '';
  } else {
    pinAttempts++;
    if (pinAttempts >= PIN_MAX_ATTEMPTS) {
      pinLockUntil = Date.now() + PIN_LOCK_MS;
      pinAttempts = 0;
      errEl.textContent = `${PIN_MAX_ATTEMPTS}회 틀림 — ${PIN_LOCK_MS/1000}초 후 다시 시도`;
    } else {
      errEl.textContent = `비밀번호 틀림 (${pinAttempts}/${PIN_MAX_ATTEMPTS})`;
    }
    inp.value = '';
    setTimeout(() => { errEl.textContent = ''; }, 1800);
  }
}
// 0510 인증 보존 — localStorage 7일 또는 기존 sessionStorage 호환
const _authUntil = parseInt(localStorage.getItem('bbq_desk_auth_until') || '0');
if (_authUntil > Date.now() || sessionStorage.getItem('bbq_desk_auth') === '1') {
  document.getElementById('pinOverlay').classList.add('authed');
} else {
  document.getElementById('pinInput').focus();
}
document.getElementById('pinInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') checkPin();
});
document.getElementById('pinInput').addEventListener('input', e => {
  if (e.target.value.length === 4) checkPin();
});

function newId() { return 'e' + (nextId++); }

function getL(item) { return overrides[item.name]?.l ?? (item.daily || 0); }
function getK(item) { return overrides[item.name]?.k ?? (item.buffer || 0); }
function totalStock(name) {
  return entries.filter(e => e.name === name)
    .reduce((s, e) => s + (e.stock != null && e.stock !== '' ? Number(e.stock) : 0), 0);
}
function todayKST() {
  const k = new Date(Date.now() + 9 * 3600000);
  return k.toISOString().slice(0, 10);
}
function isItemHidden(name) {
  const u = overrides[name]?.hideUntil;
  if (!u) return false;
  return todayKST() < u;
}
function daysUntilReturn(name) {
  const u = overrides[name]?.hideUntil;
  if (!u) return 0;
  const now = new Date();
  const ret = new Date(u + 'T00:00:00+09:00');
  return Math.max(0, Math.ceil((ret - now) / 86400000));
}

function sanitizeSnoozeDaysInput(input) {
  if (!input) return '';
  const digits = String(input.value || '').replace(/\D/g, '').slice(0, 3);
  if (input.value !== digits) input.value = digits;
  return digits;
}

function parseSnoozeDays(value) {
  const days = parseInt(String(value || '').replace(/\D/g, ''), 10);
  if (!Number.isFinite(days) || days < 1) return null;
  return Math.min(days, MAX_SNOOZE_DAYS);
}

function openSnoozeDialog(name) {
  pendingSnoozeName = name;
  const overlay = document.getElementById('snoozeOverlay');
  const title = document.getElementById('snoozeTitle');
  const input = document.getElementById('snoozeDaysInput');
  if (!overlay || !title || !input) return;
  title.textContent = `${name} 숨김`;
  input.value = String(DEFAULT_SNOOZE_DAYS);
  overlay.classList.remove('hidden');
  setTimeout(() => {
    input.focus();
    input.select();
  }, 0);
}

function closeSnoozeDialog() {
  pendingSnoozeName = null;
  document.getElementById('snoozeOverlay')?.classList.add('hidden');
}

function applySnoozeItem(name, days) {
  if (!name) return;
  const ret = new Date(Date.now() + 9 * 3600000);
  ret.setUTCDate(ret.getUTCDate() + days);
  if (!overrides[name]) overrides[name] = {};
  overrides[name].hideUntil = ret.toISOString().slice(0, 10);
  saveLocal();
  render();
}

function confirmSnooze(event) {
  event?.preventDefault();
  const input = document.getElementById('snoozeDaysInput');
  const days = parseSnoozeDays(sanitizeSnoozeDaysInput(input));
  if (!days) {
    if (input) {
      input.value = String(DEFAULT_SNOOZE_DAYS);
      input.focus();
      input.select();
    }
    return;
  }
  applySnoozeItem(pendingSnoozeName, days);
  closeSnoozeDialog();
}

function snoozeItem(name) {
  openSnoozeDialog(name);
}

function unsnoozeItem(name) {
  if (overrides[name]) {
    delete overrides[name].hideUntil;
    if (Object.keys(overrides[name]).length === 0) delete overrides[name];
  }
  saveLocal();
  render();
}

function setOverrideValue(name, field, value) {
  if (!name || (field !== 'k' && field !== 'l')) return;
  if (!overrides[name]) overrides[name] = {};
  const num = value === '' ? null : parseFloat(value);
  if (num === null || !Number.isFinite(num)) delete overrides[name][field];
  else overrides[name][field] = num;
  if (Object.keys(overrides[name]).length === 0) delete overrides[name];
}

function setOutputStockTotal(name, value) {
  const sameEntries = entries.filter(entry => entry.name === name);
  if (sameEntries.length === 0) return;
  const num = value === '' ? null : parseFloat(value);
  sameEntries.forEach((entry, idx) => {
    if (idx === 0) entry.stock = Number.isFinite(num) ? num : null;
    else entry.stock = null;
  });
}

function cleanActualOrders(source = actualOrders) {
  const known = new Set(MASTER.map(item => item.name));
  const cleaned = {};
  Object.entries(source || {}).forEach(([name, value]) => {
    const n = Number(value);
    if (known.has(name) && Number.isFinite(n) && n >= 0) cleaned[name] = n;
  });
  return cleaned;
}

function getActualOrder(name, source = actualOrders) {
  if (!Object.prototype.hasOwnProperty.call(source || {}, name)) return null;
  const n = Number(source[name]);
  return Number.isFinite(n) && n >= 0 ? n : null;
}

function setActualOrderValue(name, value) {
  if (!name) return;
  const num = value === '' ? null : parseFloat(value);
  if (num === null || !Number.isFinite(num) || num < 0) delete actualOrders[name];
  else actualOrders[name] = Math.ceil(num);
  actualOrders = cleanActualOrders();
}

function normalizeOrderUnit(unit) {
  const value = String(unit || '').trim().toLowerCase().replace(/\s+/g, '');
  if (!value) return '';
  if (['box', '박스', '박'].includes(value)) return 'box';
  if (['ea', '개'].includes(value)) return 'ea';
  if (['bon', '봉'].includes(value)) return 'bon';
  if (['묶', '묶음'].includes(value)) return 'bundle';
  return value;
}

function orderUnitParts(item) {
  const raw = String(item?.unit || '').trim();
  const parts = raw.split('/').map(part => part.trim()).filter(Boolean);
  const checkUnit = parts[0] || raw || '';
  const orderUnit = parts[1] || checkUnit;
  const checkUnitKey = normalizeOrderUnit(checkUnit);
  const orderUnitKey = normalizeOrderUnit(orderUnit);
  return {
    checkUnit,
    orderUnit,
    checkUnitKey,
    orderUnitKey,
    same: !checkUnitKey || !orderUnitKey || checkUnitKey === orderUnitKey
  };
}

function roundOrderQty(value) {
  const n = Number(value);
  if (!Number.isFinite(n) || n <= 0) return 0;
  return Math.ceil(n - 1e-9);
}

function stockNeedFromRecord(record, name) {
  const row = record?.calc?.[name];
  const stockNeed = Number(row?.stockNeed);
  if (Number.isFinite(stockNeed) && stockNeed > 0) return stockNeed;
  const legacyQty = Number(row?.qty);
  return Number.isFinite(legacyQty) && legacyQty > 0 ? legacyQty : 0;
}

function summarizeFactors(values) {
  const clean = values.filter(v => Number.isFinite(v) && v > 0).sort((a, b) => a - b);
  if (clean.length === 0) return null;
  const mid = Math.floor(clean.length / 2);
  const median = clean.length % 2 ? clean[mid] : (clean[mid - 1] + clean[mid]) / 2;
  const avg = clean.reduce((a, b) => a + b, 0) / clean.length;
  const min = clean[0];
  const max = clean[clean.length - 1];
  return { factor: median, avg, samples: clean.length, min, max, spread: max / Math.max(min, 1e-9) };
}

function unitKeyForItem(item) {
  const parts = orderUnitParts(item);
  return `${parts.checkUnitKey || parts.checkUnit || '-'}>${parts.orderUnitKey || parts.orderUnit || '-'}`;
}

function conversionFactorFromRecord(record, item) {
  const actual = getActualOrder(item.name, record?.actualOrders || {});
  const stockNeed = stockNeedFromRecord(record, item.name);
  if (actual === null || actual <= 0 || stockNeed <= 0) return null;
  const parts = orderUnitParts(item);
  if (parts.same) return 1;
  const factor = stockNeed / actual;
  if (!Number.isFinite(factor) || factor < 1.5) return null;
  return factor;
}

function buildConversionAnalysis(history, currentSnapshot) {
  const records = historyRecordsWithCurrent(history, currentSnapshot);
  const itemBuckets = {};
  const unitBuckets = {};
  records.forEach(record => {
    MASTER.forEach(item => {
      const factor = conversionFactorFromRecord(record, item);
      if (!factor) return;
      const key = unitKeyForItem(item);
      (itemBuckets[item.name] ||= []).push(factor);
      (unitBuckets[key] ||= []).push(factor);
    });
  });

  const unitSummary = {};
  Object.entries(unitBuckets).forEach(([key, values]) => {
    const summary = summarizeFactors(values);
    if (summary) unitSummary[key] = summary;
  });

  const result = {};
  MASTER.forEach(item => {
    const parts = orderUnitParts(item);
    if (parts.same) {
      result[item.name] = { factor: 1, samples: 0, source: 'same', checkUnit: parts.checkUnit, orderUnit: parts.orderUnit };
      return;
    }
    const own = summarizeFactors(itemBuckets[item.name] || []);
    if (own) {
      result[item.name] = { ...own, source: 'item', checkUnit: parts.checkUnit, orderUnit: parts.orderUnit };
      return;
    }
    const pair = unitSummary[unitKeyForItem(item)];
    result[item.name] = {
      factor: pair?.factor || null,
      samples: pair?.samples || 0,
      source: pair ? 'unit' : 'pending',
      checkUnit: parts.checkUnit,
      orderUnit: parts.orderUnit
    };
  });
  return result;
}

function conversionFactorForItem(item) {
  const parts = orderUnitParts(item);
  if (parts.same) return 1;
  const analysis = conversionAnalysis[item.name];
  if (analysis?.source === 'item' && Number.isFinite(analysis.factor) && analysis.factor > 0) return analysis.factor;
  if (
    analysis?.source === 'unit' &&
    Number.isFinite(analysis.factor) &&
    analysis.factor > 0 &&
    Number(analysis.samples || 0) >= 3 &&
    Number(analysis.spread || 999) <= 1.25
  ) {
    return analysis.factor;
  }
  return null;
}

function recommendedOrderQty(item, stockNeed) {
  const need = Number(stockNeed);
  if (!Number.isFinite(need) || need <= 0) return 0;
  const factor = conversionFactorForItem(item);
  if (factor) return roundOrderQty(need / factor);
  const parts = orderUnitParts(item);
  if (!parts.same) return 1;
  return roundOrderQty(need);
}

function outputOrderQty(item, days) {
  const actual = getActualOrder(item.name);
  if (actual !== null) return roundOrderQty(actual);
  return recommendedOrderQty(item, calcG(item, days));
}

function displayOrderQty(item, days) {
  return fmt(outputOrderQty(item, days), 0);
}

function orderAnalysisText(item, stockNeed) {
  const actual = getActualOrder(item.name);
  if (actual !== null) return '확인';
  const parts = orderUnitParts(item);
  if (parts.same) return '미확인';
  const analysis = conversionAnalysis[item.name];
  if ((analysis?.source === 'item' || analysis?.source === 'unit') && Number.isFinite(analysis.factor)) {
    return `${parts.checkUnit}/${parts.orderUnit} ${fmt(analysis.factor, 1)}`;
  }
  if (Number(stockNeed) > 0) return '미확인';
  return '';
}

function orderAnalysisTitle(item, stockNeed) {
  const actual = getActualOrder(item.name);
  const parts = orderUnitParts(item);
  if (actual !== null) return `실발주 ${actual}${parts.orderUnit || ''} 확인됨`;
  const analysis = conversionAnalysis[item.name];
  if (analysis?.source === 'item' && Number.isFinite(analysis.factor)) {
    return `품목 기록 ${analysis.samples}건 기준: ${fmt(analysis.factor, 2)}${parts.checkUnit || ''} = 1${parts.orderUnit || ''}`;
  }
  if (analysis?.source === 'unit' && Number.isFinite(analysis.factor)) {
    const useText = conversionFactorForItem(item) ? '발주량 계산에 적용됨' : '참고만 표시됨';
    return `같은 단위 기록 ${analysis.samples}건 기준: ${fmt(analysis.factor, 2)}${parts.checkUnit || ''} = 1${parts.orderUnit || ''} (${useText})`;
  }
  if (!parts.same) return `단위 분석 대기: 체크 ${parts.checkUnit || '-'} / 발주 ${parts.orderUnit || '-'}. 실제 넣은 발주칸을 한 번 확인하면 이후 패턴에 반영됩니다.`;
  return '실제 SFA 입력 여부 미확인';
}

// G수식 (Excel 동등 + 일별 매출 가중치 일반화). 숨김 품목은 G=0.
// weight_d = sales_d / baseSales. 비어있으면 1, 0이면 그날 사용량 0.
// 기본(가중치 모두 1): Excel과 동일 IF(E<M, SUM-M+K, SUM-E+K)
//   M = L × weight_0, SUM = L × Σweight
// 기준매출 대비 예상매출이 높으면 L(하루사용량)이 발주 기간 전체에 그대로 할증됨.
function getBaseSales() {
  const n = Number(baseSales);
  return Number.isFinite(n) && n > 0 ? n : DEFAULT_BASE_SALES;
}
function dailyWeights(days) {
  const ds = [];
  for (let i = 0; i < days; i++) ds.push(dailySales[i] != null ? dailySales[i] : null);
  const base = getBaseSales();
  return ds.map(x => {
    if (x == null) return 1;
    const n = Number(x);
    if (!Number.isFinite(n)) return 1;
    return Math.max(0, n) / base;
  });
}
function calcG(item, days) {
  if (isItemHidden(item.name)) return 0;
  const L = getL(item);
  const K = getK(item);
  const E = totalStock(item.name);
  const weights = dailyWeights(days);
  const M = L * (weights[0] || 0);
  const totalUsage = L * weights.reduce((a, b) => a + b, 0);
  if (E < M) return totalUsage - M + K;
  return totalUsage - E + K;
}

function normalizeHistoryDateKey(value) {
  const digits = String(value || '').replace(/\D/g, '');
  return digits.length >= 8 ? digits.slice(0, 8) : '';
}

function dateKeyToDayMs(dateKey) {
  const key = normalizeHistoryDateKey(dateKey);
  if (!key) return null;
  const y = Number(key.slice(0, 4));
  const m = Number(key.slice(4, 6));
  const d = Number(key.slice(6, 8));
  if (!y || !m || !d) return null;
  return Date.UTC(y, m - 1, d);
}

function stockMapFromEntries(snapshotEntries) {
  const parts = new Map();
  (Array.isArray(snapshotEntries) ? snapshotEntries : []).forEach(entry => {
    if (!entry || !entry.name) return;
    const current = parts.get(entry.name) || { rows: 0, checked: 0, total: 0 };
    current.rows += 1;
    const n = Number(entry.stock);
    if (entry.stock !== null && entry.stock !== '' && Number.isFinite(n)) {
      current.checked += 1;
      current.total += n;
    }
    parts.set(entry.name, current);
  });
  const stockMap = new Map();
  parts.forEach((value, name) => {
    if (value.rows > 0 && value.checked === value.rows) stockMap.set(name, value.total);
  });
  return stockMap;
}

function normalizeHistoryRecord(key, snapshot) {
  if (!snapshot || !Array.isArray(snapshot.entries)) return null;
  const savedAt = Number(snapshot.savedAt);
  const dateKey = normalizeHistoryDateKey(snapshot.dateKey) ||
    normalizeHistoryDateKey(key) ||
    (Number.isFinite(savedAt) ? kstDateKey(savedAt) : '');
  const dayMs = dateKeyToDayMs(dateKey);
  if (!dateKey || dayMs === null) return null;
  const stockMap = stockMapFromEntries(snapshot.entries);
  if (stockMap.size === 0) return null;
  return {
    dateKey,
    dayMs,
    savedAt: Number.isFinite(savedAt) ? savedAt : dayMs,
    stockMap,
    actualOrders: cleanActualOrders(snapshot.actualOrders),
    calc: snapshot.calc || {}
  };
}

function currentAnalysisSnapshot() {
  const days = parseInt(document.getElementById('orderDays')?.value || recommendedDays());
  const calc = {};
  MASTER.forEach(item => {
    const g = calcG(item, days);
    if (g > 0) calc[item.name] = { qty: recommendedOrderQty(item, g), stockNeed: Math.round(g * 100) / 100, unit: item.unit, stock: totalStock(item.name) };
  });
  return {
    savedAt: Date.now(),
    dateKey: kstDateKey(Date.now()),
    entries: entries.map(entry => ({ name: entry.name, stock: entry.stock })),
    actualOrders: cleanActualOrders(),
    calc
  };
}

function historyRecordsWithCurrent(history, currentSnapshot) {
  const byDate = new Map();
  Object.entries(history || {}).forEach(([key, snapshot]) => {
    const record = normalizeHistoryRecord(key, snapshot);
    if (!record) return;
    const existing = byDate.get(record.dateKey);
    if (!existing || record.savedAt >= existing.savedAt) byDate.set(record.dateKey, record);
  });

  const current = normalizeHistoryRecord(currentSnapshot?.dateKey, currentSnapshot);
  if (current) {
    const existing = byDate.get(current.dateKey);
    if (existing) {
      const mergedStock = new Map(existing.stockMap);
      current.stockMap.forEach((value, name) => mergedStock.set(name, value));
      byDate.set(current.dateKey, {
        ...current,
        savedAt: Math.max(existing.savedAt, current.savedAt),
        stockMap: mergedStock,
        actualOrders: current.actualOrders || {},
        calc: current.calc || existing.calc || {}
      });
    } else {
      byDate.set(current.dateKey, current);
    }
  }

  const sorted = Array.from(byDate.values()).sort((a, b) => (a.dayMs - b.dayMs) || (a.savedAt - b.savedAt));
  const latest = sorted[sorted.length - 1];
  if (!latest) return sorted;
  const cutoff = latest.dayMs - (USAGE_ANALYSIS_MAX_DAYS * 86400000);
  return sorted.filter(record => record.dayMs >= cutoff);
}

function orderQtyFromRecord(record, name) {
  const actual = getActualOrder(name, record?.actualOrders || {});
  if (actual !== null) {
    const stockNeed = stockNeedFromRecord(record, name);
    return { qty: stockNeed || actual, source: 'actual', actualQty: actual };
  }
  const n = Number(record?.calc?.[name]?.qty);
  return { qty: Number.isFinite(n) && n > 0 ? n : 0, source: 'calc' };
}

function buildUsageAnalysis(history, currentSnapshot) {
  const records = historyRecordsWithCurrent(history, currentSnapshot);
  const acc = {};
  for (let i = 1; i < records.length; i++) {
    const prev = records[i - 1];
    const curr = records[i];
    const gapDays = (curr.dayMs - prev.dayMs) / 86400000;
    if (!Number.isFinite(gapDays) || gapDays <= 0) continue;
    MASTER.forEach(item => {
      const name = item.name;
      if (!prev.stockMap.has(name) || !curr.stockMap.has(name)) return;
      const prevStock = prev.stockMap.get(name);
      const currStock = curr.stockMap.get(name);
      const order = orderQtyFromRecord(prev, name);
      const orderQty = order.qty;
      const usage = prevStock + orderQty - currStock;
      if (!Number.isFinite(usage) || usage < -0.05) return;
      const bucket = acc[name] || { totalUsage: 0, totalDays: 0, samples: 0, last: null };
      const safeUsage = Math.max(0, usage);
      bucket.totalUsage += safeUsage;
      bucket.totalDays += gapDays;
      bucket.samples += 1;
      bucket.last = {
        from: prev.dateKey,
        to: curr.dateKey,
        days: gapDays,
        usage: safeUsage,
        daily: safeUsage / gapDays,
        orderQty,
        actualQty: order.actualQty ?? null,
        orderSource: order.source
      };
      acc[name] = bucket;
    });
  }

  const result = {};
  Object.entries(acc).forEach(([name, value]) => {
    if (value.samples <= 0 || value.totalDays <= 0) return;
    result[name] = {
      avg: value.totalUsage / value.totalDays,
      totalUsage: value.totalUsage,
      totalDays: value.totalDays,
      samples: value.samples,
      last: value.last
    };
  });
  return result;
}

  if (state === 'already_applied' || state === 'idle' || state === 'init') return 'idle';
  if (state === 'requested' || state === 'detected' || state === 'waiting_stable' || state === 'analyzing') return 'saving';
  if (state === 'no_file' || state === 'missing_dir' || state === 'missing_tool' || state === 'request_error' || state === 'error') return 'error';
  return 'idle';

function shortStatusTime(raw) {
  if (!raw) return '';
  const d = new Date(raw);
  if (!Number.isNaN(d.getTime())) {
    return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
  }
  return String(raw).replace('T', ' ').slice(5, 16);
}

function sfaStatusKey(data) {
  if (!data || typeof data !== 'object') return '';
  return [
    data.state || '',
    data.order_date || '',
    data.file || '',
    data.last_analyzed_at || '',
    data.updated_at || '',
    data.error || ''
  ].join('|');
}

function sfaStatusMs(data) {
  const raw = data?.last_analyzed_at || data?.updated_at || '';
  const ms = raw ? new Date(raw).getTime() : NaN;
  return Number.isNaN(ms) ? 0 : ms;
}

function sfaStatusToastText(data) {
  const state = data?.state || '';
  const day = data?.order_date ? ` ${data.order_date.slice(5)}` : '';
  if (state === 'ok') return `엑셀분석 완료${day}`;
  if (state === 'already_applied') return `엑셀분석 이미 처리됨${day}`;
  if (state === 'analyzing') return `엑셀분석 중${day}`;
  if (state === 'requested') return '엑셀분석 요청됨';
  if (state === 'no_file') return '엑셀 파일 없음';
  if (state === 'error' || state === 'request_error') return '엑셀분석 오류';
  return '';
}

function renderSfaStatus(data) {
  const el = document.getElementById('sfaStatus');
  if (!el) return;
  const state = data?.state || 'idle';
  const statusMs = sfaStatusMs(data);
  if (sfaLastRequestAt && ['idle', 'ok', 'already_applied'].includes(state) && (!statusMs || statusMs < sfaLastRequestAt)) {
    return;
  }
  if (sfaLastRequestAt && statusMs >= sfaLastRequestAt && ['ok', 'already_applied', 'no_file', 'error', 'request_error'].includes(state)) {
    sfaLastRequestAt = 0;
  }
  const day = data?.order_date ? ` ${data.order_date.slice(5)}` : '';
  const time = shortStatusTime(data?.last_analyzed_at || data?.updated_at);
  el.textContent = `엑셀 ${sfaStatusLabel(state)}${day}${time ? ' ' + time : ''}`;
  el.className = `status-pill ${sfaStatusTone(state)}`;
  el.title = data?.file || data?.error || '';

  const key = sfaStatusKey(data);
  if (sfaStatusInitialized && key && key !== lastSfaStatusKey) {
    const msg = sfaStatusToastText(data);
    if (msg) toast(msg);
  }
  if (key) lastSfaStatusKey = key;
  sfaStatusInitialized = true;
  updateStickyOffsets();
}

function getNextStockInputId(currentId) {
  const stockInputs = Array.from(document.querySelectorAll('input.cell[data-field="stock"]'));
  const idx = stockInputs.findIndex(inp => inp.dataset.id === currentId);
  return idx >= 0 ? stockInputs[idx + 1]?.dataset.id || null : null;
}

function focusStockInputById(id) {
  if (!id) return false;
  const target = document.querySelector(`input.cell[data-field="stock"][data-id="${id}"]`);
  if (!target) return false;
  target.focus();
  target.select();
  return true;
}

function currentStockFocusId() {
  const active = document.activeElement;
  return active?.dataset?.field === 'stock' ? active.dataset.id || null : null;
}

function renderAndFocusStock(nextId, source, currentId) {
  render();
  const moved = focusStockInputById(nextId);
  const msg = `${source} current=${currentId || '-'} next=${nextId || '-'} result=${moved ? 'focused' : 'end'}`;
  console.debug('[stock-sort]', msg);
  pushDebugLog('정렬이동 ' + msg, moved ? 'sync' : 'warn');
  return moved;
}

function sortStockRowsAndKeepFlow(currentId, source = 'sort') {
  const activeNextId = currentStockFocusId();
  const nextId = activeNextId && activeNextId !== currentId ? activeNextId : getNextStockInputId(currentId);
  return renderAndFocusStock(nextId, source, currentId);
}

function isStockChecked(entry) {
  return entry && entry.stock !== null && entry.stock !== '' && !Number.isNaN(Number(entry.stock));
}

function inputRowPriority(entry, hidden) {
  if (hidden) return 2;
  if (isStockChecked(entry)) return 1;
  return 0;
}

function fmt(n, dp=2) {
  if (n === null || n === undefined || isNaN(n)) return '';
  return (Math.round(n * Math.pow(10, dp)) / Math.pow(10, dp)).toString();
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}

function normalizedZone(zone) {
  return String(zone || '').trim();
}

function compareInputRows(left, right) {
  const pri = inputRowPriority(left.entry, left.hidden) - inputRowPriority(right.entry, right.hidden);
  if (pri !== 0) return pri;

  const leftZone = normalizedZone(left.entry.zone);
  const rightZone = normalizedZone(right.entry.zone);
  if (leftZone && !rightZone) return -1;
  if (!leftZone && rightZone) return 1;
  if (leftZone !== rightZone) return leftZone.localeCompare(rightZone, 'ko', { numeric: true, sensitivity: 'base' });

  const seqDiff = (left.item.sfaSeq || 9999) - (right.item.sfaSeq || 9999);
  if (seqDiff !== 0) return seqDiff;

  return (left.entry.id || '').localeCompare(right.entry.id || '', 'en');
}

function defaultOutputCompare(a, b) {
  const seqDiff = (a.sfaSeq || 9999) - (b.sfaSeq || 9999);
  if (seqDiff !== 0) return seqDiff;
  return (a.name || '').localeCompare(b.name || '', 'ko', { numeric: true, sensitivity: 'base' });
}

function cleanOutputOrder(order = outputOrder) {
  const known = new Set(MASTER.map(item => item.name));
  const seen = new Set();
  return (Array.isArray(order) ? order : []).filter(name => {
    if (!known.has(name) || seen.has(name)) return false;
    seen.add(name);
    return true;
  });
}

function outputRankMap() {
  const cleaned = cleanOutputOrder();
  if (cleaned.length !== outputOrder.length) outputOrder = cleaned;
  return new Map(cleaned.map((name, idx) => [name, idx]));
}

function getOutputItems(days) {
  const rank = outputRankMap();
  return MASTER.filter(item => calcG(item, days) > 0).sort((a, b) => {
    const ar = rank.has(a.name) ? rank.get(a.name) : Number.MAX_SAFE_INTEGER;
    const br = rank.has(b.name) ? rank.get(b.name) : Number.MAX_SAFE_INTEGER;
    if (ar !== br) return ar - br;
    return defaultOutputCompare(a, b);
  });
}

function moveOutputItem(name, direction) {
  const days = parseInt(document.getElementById('orderDays').value);
  const visibleNames = getOutputItems(days).map(item => item.name);
  const idx = visibleNames.indexOf(name);
  const nextIdx = idx + direction;
  if (idx < 0 || nextIdx < 0 || nextIdx >= visibleNames.length) return;
  [visibleNames[idx], visibleNames[nextIdx]] = [visibleNames[nextIdx], visibleNames[idx]];
  const remaining = cleanOutputOrder().filter(itemName => !visibleNames.includes(itemName));
  outputOrder = visibleNames.concat(remaining);
  saveLocal('outputOrder');
  render();
}

function outputNumberInput(name, field, value) {
  const title = field === 'order' ? '실발주값 (비우면 계산값)' : '';
  const step = field === 'order' ? '1' : '0.1';
  const inputmode = field === 'order' ? 'numeric' : 'decimal';
  return `<input class="cell" type="number" inputmode="${inputmode}" step="${step}" data-output-name="${escapeHtml(name)}" data-output-field="${field}" value="${escapeHtml(value)}" title="${title}">`;
}

function kstDateKey(ts) {
  const k = new Date(ts + 9 * 3600000);
  return k.getUTCFullYear().toString() +
    (k.getUTCMonth()+1).toString().padStart(2,'0') +
    k.getUTCDate().toString().padStart(2,'0');
}

function render() {
  document.body.classList.toggle('output-mode', viewMode === 'output');
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  renderHeader();
  renderSaveLogs();
  const days = parseInt(document.getElementById('orderDays').value);
  recomputeUsageAnalysis();

  // 발주 N개 (품목 단위)
  let needCount = 0;
  MASTER.forEach(it => { if (calcG(it, days) > 0) needCount++; });
  document.getElementById('badge').textContent = '발주 ' + needCount + '개';
  document.getElementById('badge').classList.toggle('zero', needCount === 0);

  if (viewMode === 'output') {
    // 품목 단위 1행, G>0만. 기본은 D순, 버튼으로 출력 순서 조정 가능.
    const list = getOutputItems(days);
    list.forEach((item, idx) => {
      const g = calcG(item, days);
      const E = totalStock(item.name);
      const tr = document.createElement('tr');
      tr.classList.add('need');
      const safeName = item.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
      tr.innerHTML = `
        <td class="name">${item.name}</td>
        <td class="qty order-qty pos"><span class="order-cell">${outputNumberInput(item.name, 'order', displayOrderQty(item, days))}${renderOrderAnalysisSpan(item, g)}</span></td>
        <td>${outputNumberInput(item.name, 'stock', fmt(E,2))}</td>
        <td>${outputNumberInput(item.name, 'k', fmt(getK(item),2))}</td>
        <td><span class="daily-cell">${outputNumberInput(item.name, 'l', fmt(getL(item),2))}${renderDailyAnalysisSpan(item.name)}</span></td>
        <td>${item.unit||''}</td>
        <td class="output-actions">
          <button type="button" onclick="moveOutputItem('${safeName}', -1)" title="위로" ${idx === 0 ? 'disabled' : ''}>▲</button>
          <button type="button" onclick="moveOutputItem('${safeName}', 1)" title="아래로" ${idx === list.length - 1 ? 'disabled' : ''}>▼</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
    updateStickyOffsets();
    return;
  }

  // 입력 모드 — 미입력 우선 + 구역 묶음. 완료/숨김은 아래로 내려 입력 동선을 보존.
  const orderedRows = entries.map(ent => {
    const item = MASTER.find(m => m.name === ent.name);
    if (!item) return null;
    return { entry: ent, item, hidden: isItemHidden(item.name) };
  }).filter(Boolean).sort(compareInputRows);

  const shownItems = new Set();
  orderedRows.forEach(({ entry: ent, item, hidden }) => {
    const isFirst = !shownItems.has(item.name);
    shownItems.add(item.name);
    const dupCount = entries.filter(e => e.name === item.name).length;
    const g = calcG(item, days);
    const isNeed = g > 0;
    const isChecked = isStockChecked(ent);
    const tr = document.createElement('tr');
    if (isNeed && isFirst) tr.classList.add('need');
    if (hidden) tr.classList.add('row-hidden');
    else if (isChecked) tr.classList.add('row-checked');
    else tr.classList.add('row-pending');
    if (!isFirst) tr.classList.add('dup-row');

    const safeName = item.name.replace(/"/g, '&quot;');
    const nameDisplay = item.name;
    const daysLeft = hidden ? daysUntilReturn(item.name) : 0;
    const orderText = isNeed ? displayOrderQty(item, days) : '';
    const gCell = isFirst
      ? (hidden
          ? `<td class="qty order-qty dup">💤 ${daysLeft}일 후 복귀</td>`
          : `<td class="qty order-qty ${isNeed?'pos':''}">${orderText}</td>`)
      : `<td class="qty order-qty dup">${hidden ? '' : orderText}</td>`;
    const KL = isFirst
      ? `<td><input class="cell" type="number" step="0.1" tabindex="-1" data-id="${ent.id}" data-field="k" value="${fmt(getK(item),2)}"></td>
         <td><span class="daily-cell"><input class="cell" type="number" step="0.1" tabindex="-1" data-id="${ent.id}" data-field="l" value="${fmt(getL(item),2)}">${renderDailyAnalysisSpan(item.name)}</span></td>`
      : `<td class="qty dup-meta">${fmt(getK(item),2)}</td><td class="qty dup-meta"><span>${fmt(getL(item),2)}</span>${renderDailyAnalysisSpan(item.name)}</td>`;
    const snoozeBtn = isFirst
      ? (hidden
          ? `<button tabindex="-1" onclick="unsnoozeItem('${safeName}')" title="숨김 해제">↩</button>`
          : `<button tabindex="-1" onclick="snoozeItem('${safeName}')" title="N일 동안 안 봄">💤</button>`)
      : '';

    tr.innerHTML = `
      <td><input class="cell zone" type="text" tabindex="-1" data-id="${ent.id}" data-field="zone" value="${(ent.zone||'').replace(/"/g,'&quot;')}"></td>
      <td class="name">${nameDisplay}</td>
      <td><input class="cell" type="number" inputmode="decimal" enterkeyhint="next" step="0.1" data-id="${ent.id}" data-field="stock" value="${ent.stock==null?'':ent.stock}"></td>
      ${KL}
      ${gCell}
      <td>${item.unit||''}</td>
      <td class="actions">
        <button class="add" tabindex="-1" onclick="addRow('${ent.id}')" title="같은 품목 행 추가">+</button>
        ${dupCount > 1 ? `<button tabindex="-1" onclick="deleteRow('${ent.id}')" title="이 행 삭제">×</button>` : ''}
        ${snoozeBtn}
      </td>
    `;
    tbody.appendChild(tr);
  });

  document.querySelectorAll('input.cell').forEach(inp => {
    inp.addEventListener('input', e => {
      if (handleOutputCellInput(e.target)) return;
      const id = e.target.dataset.id;
      const f = e.target.dataset.field;
      const v = e.target.value;
      const ent = entries.find(x => x.id === id);
      if (!ent) return;
      if (f === 'stock') {
        logStockEvent(e, 'input');
        ent.stock = v === '' ? null : parseFloat(v);
        saveLocal();
        recomputeUsageAnalysis();
        updateDailyAnalysisForName(ent.name);
        updateGForName(ent.name);
      } else if (f === 'zone') {
        ent.zone = v;
        saveLocal();
      } else {
        // k or l (overrides per name)
        const n = ent.name;
        if (!overrides[n]) overrides[n] = {};
        const num = v === '' ? null : parseFloat(v);
        if (num === null) delete overrides[n][f];
        else overrides[n][f] = num;
        if (Object.keys(overrides[n]).length === 0) delete overrides[n];
        saveLocal();
        updateGForName(n);
      }
    });
    inp.addEventListener('change', e => {
      if (e.target.dataset.outputField) {
        handleOutputCellInput(e.target);
        flushAutoSave('auto');
        render();
        return;
      }
      // blur/Enter — pending autosave 즉시 flush
      if (e.target.dataset.field === 'stock') {
        logStockEvent(e, 'change');
        const currentId = e.target.dataset.id;
        if (skipStockRenderOnceId === e.target.dataset.id) {
          skipStockRenderOnceId = null;
          return;
        }
        setTimeout(() => {
          if (shouldFallbackAdvanceFromChange(e.target, currentId)) {
            advanceStockInput(currentId, 'change');
          } else {
            sortStockRowsAndKeepFlow(currentId, 'change');
          }
          flushAutoSave('auto');
        }, 0);
        return;
      }
      flushAutoSave();
      if (e.target.dataset.field === 'zone') render();
    });
    inp.addEventListener('keydown', e => {
      if (e.target.dataset.outputField) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        handleOutputCellInput(e.target);
        e.target.blur();
        flushAutoSave('auto');
        render();
        return;
      }
      if (e.target.dataset.field === 'stock') logStockEvent(e, 'keydown');
      if (e.key !== 'Enter') return;
      if (e.target.dataset.field !== 'stock') return;
      e.preventDefault();
      skipStockRenderOnceId = e.target.dataset.id;
      advanceStockInput(e.target.dataset.id, 'keydown');
      flushAutoSave('auto');
    });
  });
  updateStickyOffsets();
}

function updateGForName(name) {
  const item = MASTER.find(m => m.name === name);
  if (!item) return;
  const days = parseInt(document.getElementById('orderDays').value);
  const g = calcG(item, days);
  const isNeed = g > 0;
  // 같은 품목 모든 행의 G 셀/배경 갱신
  document.querySelectorAll('tr').forEach(tr => {
    const cells = tr.querySelectorAll('td.name');
    if (!cells.length) return;
    const txt = cells[0].textContent.replace(/^↳\s*/, '');
    if (txt !== name) return;
    const gCell = tr.querySelector('td.order-qty');
    if (gCell && !tr.classList.contains('row-hidden')) {
      const isDuplicateCell = gCell.classList.contains('dup');
      gCell.textContent = isNeed ? displayOrderQty(item, days) : '';
      gCell.className = isDuplicateCell
        ? 'qty order-qty dup'
        : 'qty order-qty' + (isNeed ? ' pos' : '');
    }
    if (isNeed && !tr.classList.contains('dup-row')) tr.classList.add('need');
    else tr.classList.remove('need');
  });
  let cnt = 0;
  MASTER.forEach(it => { if (calcG(it, days) > 0) cnt++; });
  document.getElementById('badge').textContent = '발주 ' + cnt + '개';
  document.getElementById('badge').classList.toggle('zero', cnt === 0);
}

function addRow(fromId) {
  const src = entries.find(x => x.id === fromId);
  if (!src) return;
  const newEntry = { id: newId(), name: src.name, zone: '', stock: null };
  // 같은 품목 마지막 entry 뒤에 삽입
  const idx = entries.map(e => e.name).lastIndexOf(src.name);
  entries.splice(idx + 1, 0, newEntry);
  saveLocal();
  render();
}

function deleteRow(id) {
  const idx = entries.findIndex(x => x.id === id);
  if (idx < 0) return;
  const sameNameCount = entries.filter(e => e.name === entries[idx].name).length;
  if (sameNameCount <= 1) { toast('마지막 행은 삭제 불가'); return; }
  entries.splice(idx, 1);
  saveLocal();
  render();
}

function toggleMode() {
  viewMode = (viewMode === 'input') ? 'output' : 'input';
  const btn = document.getElementById('modeBtn');
  if (viewMode === 'input') {
    btn.textContent = '출력 보기';
    btn.className = '';
  } else {
    btn.textContent = '입력 보기';
    btn.className = 'green';
  }
  render();
}

function resetStocks() {
  if (!confirm('모든 재고 값을 비울까요? 구역, 여유, 일사용은 유지됩니다.')) return;
  entries.forEach(ent => { ent.stock = null; });
  saveLocal('reset');
  if (autoSaveTimer) {
    clearTimeout(autoSaveTimer);
    autoSaveTimer = null;
  }
  render();
  pushSaveLog('재고 리셋', 'muted');
  saveToFB('reset');
}

let suppressAutoSave = false;
let localDirty = false;
function saveLocal(reason = 'auto') {
  const orderDaysEl = document.getElementById('orderDays');
  if (orderDaysEl) localStorage.setItem('bbq_orderDays', orderDaysEl.value);
  localStorage.setItem('bbq_entries', JSON.stringify(entries));
  localStorage.setItem('bbq_overrides', JSON.stringify(overrides));
  localStorage.setItem('bbq_dailySales', JSON.stringify(dailySales));
  outputOrder = cleanOutputOrder();
  actualOrders = cleanActualOrders();
  localStorage.setItem(OUTPUT_ORDER_STORAGE_KEY, JSON.stringify(outputOrder));
  localStorage.setItem(ACTUAL_ORDER_STORAGE_KEY, JSON.stringify(actualOrders));
  localStorage.setItem(ACTUAL_ORDER_DATE_STORAGE_KEY, kstDateKey(Date.now()));
  if (baseSales == null) localStorage.removeItem('bbq_baseSales');
  else {
    localStorage.setItem('bbq_baseSales', JSON.stringify(baseSales));
    localStorage.setItem('bbq_baseSalesVersion', BASE_SALES_STORAGE_VERSION);
  }
  if (!suppressAutoSave) {
    localDirty = true;
    renderSaveState('저장 대기', 'dirty');
    if (typeof scheduleAutoSave === 'function') scheduleAutoSave(reason);
  }
}

function setBaseSalesInputValue() {
  const inp = document.getElementById('baseSalesInput');
  if (!inp || document.activeElement === inp) return;
  inp.value = baseSales != null ? baseSales : '';
}

function bindBaseSalesInput() {
  const inp = document.getElementById('baseSalesInput');
  if (!inp) return;
  setBaseSalesInputValue();
  inp.addEventListener('input', e => {
    const v = e.target.value;
    const n = v === '' ? null : parseFloat(v);
    baseSales = Number.isFinite(n) && n > 0 ? n : null;
    saveLocal();
    updateSalesAvg();
    MASTER.forEach(it => updateGForName(it.name));
  });
  inp.addEventListener('change', () => flushAutoSave());
}

function renderSalesInputs() {
  const days = parseInt(document.getElementById('orderDays').value);
  const lost = recommendedLostDays();
  const wrap = document.getElementById('salesInputs');
  if (!wrap) return;
  wrap.innerHTML = '';
  const today = new Date();
  for (let i = 0; i < days; i++) {
    const d = new Date(today.getTime() + i * 86400000);
    const wd = ['일','월','화','수','목','금','토'][d.getDay()];
    const isLost = i < lost;
    const block = document.createElement('span');
    block.className = 'day-block' + (isLost ? ' lost' : '');
    const lbl = document.createElement('span');
    lbl.className = 'day-label';
    lbl.textContent = (i === 0 ? '오늘' : '+' + i) + '(' + wd + ')';
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.className = 'sales';
    inp.placeholder = '-';
    inp.value = dailySales[i] != null ? dailySales[i] : '';
    inp.dataset.idx = i;
    inp.addEventListener('input', e => {
      const v = e.target.value;
      const num = v === '' ? null : parseFloat(v);
      dailySales[parseInt(e.target.dataset.idx)] = num;
      saveLocal();
      updateSalesAvg();
      // G만 갱신 (재정렬 없이)
      MASTER.forEach(it => updateGForName(it.name));
    });
    inp.addEventListener('change', () => flushAutoSave());
    block.appendChild(lbl);
    block.appendChild(inp);
    wrap.appendChild(block);
  }
  updateSalesAvg();
}

function updateSalesAvg() {
  const days = parseInt(document.getElementById('orderDays').value);
  const explicit = [];
  for (let i = 0; i < days; i++) {
    const n = Number(dailySales[i]);
    if (dailySales[i] != null && Number.isFinite(n)) explicit.push(n);
  }
  const el = document.getElementById('salesAvg');
  if (!el) return;
  const base = getBaseSales();
  if (explicit.length === 0) {
    el.textContent = `기준 ${base.toFixed(0)}만 / 균등 1.00배`;
    return;
  }
  const weights = dailyWeights(days);
  const total = weights.reduce((a,b)=>a+b,0);
  el.textContent = `기준 ${base.toFixed(0)}만 → 오늘 ${weights[0].toFixed(2)}배 / 총 ${total.toFixed(2)}일분`;
}

// single-flight + pending bit + 지수 backoff (5/10/20s, 3회). 진행 중 새 호출은 pending 만 set, 끝난 직후 최신 entries 로 한 번만 재발사 → 구버전 덮어쓰기 방지.
let saveInFlight = false;
let pendingSave = false;
let pendingSaveReason = 'auto';
let saveRetryTimer = null;
let saveAttempt = 0;
const SAVE_BACKOFF = [5000, 10000, 20000];
async function saveToFB(reason = 'manual') {
  if (saveInFlight) {
    pendingSave = true;
    pendingSaveReason = reason;
    return;
  }
  saveInFlight = true;
  renderSaveState(saveReasonLabel(reason) + ' 중', 'saving');
  const activeReason = reason;
  const now = Date.now();
  const dateKey = kstDateKey(now);
  const days = parseInt(document.getElementById('orderDays').value);
  const calc = {};
  MASTER.forEach(item => {
    const g = calcG(item, days);
    if (g > 0) calc[item.name] = { qty: recommendedOrderQty(item, g), stockNeed: Math.round(g*100)/100, unit: item.unit, stock: totalStock(item.name) };
  });
  const salesWeights = dailyWeights(days).map(x => Math.round(x * 1000) / 1000);
  outputOrder = cleanOutputOrder();
  actualOrders = cleanActualOrders();
  const payload = { savedAt: now, dateKey, orderDays: days, entries, overrides, outputOrder, actualOrders, dailySales, baseSales: getBaseSales(), salesWeights, calc, debugLogs: debugLogs.slice(0, DEBUG_LOG_LIMIT) };
  console.log('[saveToFB] PUT', FB_URL + FB_PATH + '/current.json', 'savedAt=', now, 'entries=', entries.length);
  const scheduleRetry = (label) => {
    if (saveAttempt >= SAVE_BACKOFF.length) {
      saveAttempt = 0;
      pushSaveLog(saveReasonLabel(activeReason) + ' 실패', 'error');
      renderSaveState('저장 실패', 'error');
      toast('저장 반복 실패 — 다시 입력하시면 재시도됩니다');
      console.error('[saveToFB] retries exhausted after', label);
      return;
    }
    const delay = SAVE_BACKOFF[saveAttempt++];
    if (saveRetryTimer) clearTimeout(saveRetryTimer);
    pushSaveLog(`${saveReasonLabel(activeReason)} 재시도 ${delay/1000}초`, 'warn');
    saveRetryTimer = setTimeout(() => { saveRetryTimer = null; saveToFB(activeReason); }, delay);
    console.warn('[saveToFB] retry in', delay, 'ms after', label);
  };
  try {
    const [r1, r2] = await Promise.all([
      fetch(`${FB_URL}${FB_PATH}/current.json`, { method: 'PUT', body: JSON.stringify(payload) }),
      fetch(`${FB_URL}${FB_PATH}/history/${dateKey}.json`, { method: 'PUT', body: JSON.stringify(payload) })
    ]);
    if (!r1.ok || !r2.ok) {
      const t1 = await r1.text().catch(()=>''); const t2 = await r2.text().catch(()=>'');
      console.error('[saveToFB] FAIL', { current: r1.status, history: r2.status, body1: t1, body2: t2 });
      const nextDelay = SAVE_BACKOFF[Math.min(saveAttempt, SAVE_BACKOFF.length - 1)] / 1000;
      toast('저장 실패: HTTP ' + r1.status + '/' + r2.status + ' — ' + nextDelay + '초 후 재시도');
      scheduleRetry('HTTP ' + r1.status + '/' + r2.status);
      return;
    }
    saveAttempt = 0;
    if (saveRetryTimer) { clearTimeout(saveRetryTimer); saveRetryTimer = null; }
    localStorage.setItem('bbq_savedAt', String(now));
    // pendingSave=true 면 진행 중 추가 입력 있었음 → localDirty 유지(다음 PUT 가 최신 entries 로 재발사). pendingSave=false 면 PUT payload == 현재 entries → dirty 해제.
    if (!pendingSave) localDirty = false;
    console.log('[saveToFB] OK savedAt=', now, 'pendingSave=', pendingSave);
    pushSaveLog(saveReasonLabel(activeReason) + ' 완료', 'success', now);
    renderSaveState('저장됨', 'saved');
    toast(saveReasonLabel(activeReason) + ' 완료 (' + new Date(now).toLocaleTimeString('ko-KR') + ')');
    document.getElementById('lastSaved').textContent = lastSavedLabel(activeReason) + ' ' + new Date(now).toLocaleTimeString('ko-KR');
    loadUsageHistory(true);
  } catch (e) {
    console.error('[saveToFB] EXCEPTION', e);
    pushSaveLog(saveReasonLabel(activeReason) + ' 실패', 'error');
    renderSaveState('저장 실패', 'error');
    const nextDelay = SAVE_BACKOFF[Math.min(saveAttempt, SAVE_BACKOFF.length - 1)] / 1000;
    toast('저장 실패: ' + e.message + ' — ' + nextDelay + '초 후 재시도');
    scheduleRetry('EXCEPTION');
  } finally {
    saveInFlight = false;
    if (pendingSave) {
      const nextReason = pendingSaveReason || 'auto';
      pendingSave = false;
      pendingSaveReason = 'auto';
      // 단일 이벤트 루프 — setTimeout 0 콜백과 사용자 이벤트 핸들러가 동일 틱에 겹치지 않으므로 재진입 race 없음.
      setTimeout(() => saveToFB(nextReason), 0);
    }
  }
}

// 입력 포커스 추적 (실시간 동기화 시 덮어쓰기 방지)
let inputFocused = false;
let pendingFBData = null;
document.addEventListener('focusin', e => {
  if (e.target.matches('input,select,textarea')) inputFocused = true;
});
document.addEventListener('focusout', e => {
  if (e.target.matches('input,select,textarea')) {
    inputFocused = false;
    setTimeout(() => {
      if (!inputFocused && pendingFBData) {
        applyFBData(pendingFBData);
        pendingFBData = null;
      }
    }, 300);
  }
});

function normalizeOrderDays(value) {
  const n = parseInt(String(value || '').replace(/\D/g, ''), 10);
  if (!Number.isFinite(n) || n < 1 || n > 7) return '';
  return String(n);
}

function setOrderDaysValue(value) {
  const days = normalizeOrderDays(value);
  const sel = document.getElementById('orderDays');
  if (!days || !sel) return false;
  sel.value = days;
  localStorage.setItem('bbq_orderDays', days);
  return true;
}

function applyFBData(data) {
  if (!data || !data.savedAt) return;
  // FB가 source of truth: 그대로 교체. 로컬 변경 보호는 autoLoadFromFB의 localDirty 체크가 담당
  if (Object.prototype.hasOwnProperty.call(data, 'orderDays')) setOrderDaysValue(data.orderDays);
  if (data.entries) entries = data.entries;
  if (data.overrides) overrides = data.overrides;
  if (data.outputOrder) outputOrder = cleanOutputOrder(data.outputOrder);
  if (Object.prototype.hasOwnProperty.call(data, 'actualOrders') && normalizeHistoryDateKey(data.dateKey) === kstDateKey(Date.now())) {
    actualOrders = cleanActualOrders(data.actualOrders);
  } else {
    actualOrders = {};
  }
  if (data.dailySales) dailySales = data.dailySales;
  if (Object.prototype.hasOwnProperty.call(data, 'baseSales')) {
    const n = Number(data.baseSales);
    baseSales = Number.isFinite(n) && n > 0 ? n : DEFAULT_BASE_SALES;
  }
  // 마이그레이션: FB 데이터에 MASTER 에서 사라진 이름 잔존 시 정리 (구 이름 / 등 RTDB 키 사고 방지)
  entries = entries.filter(e => MASTER.some(m => m.name === e.name));
  Object.keys(overrides).forEach(k => { if (!MASTER.some(m => m.name === k)) delete overrides[k]; });
  let maxN = 0;
  entries.forEach(e => { const m = /^e(\d+)$/.exec(e.id||''); if (m) maxN = Math.max(maxN, +m[1]); });
  nextId = maxN + 1;
  MASTER.forEach(item => {
    if (!entries.some(e => e.name === item.name)) {
      entries.push({ id: newId(), name: item.name, zone: '', stock: null });
    }
  });
  localStorage.setItem('bbq_savedAt', String(data.savedAt));
  suppressAutoSave = true;
  saveLocal();
  suppressAutoSave = false;
  setBaseSalesInputValue();
  renderSalesInputs();
  render();
  renderSaveState('동기화됨', 'idle');
  document.getElementById('lastSaved').textContent = '동기화 ' + new Date(data.savedAt).toLocaleTimeString('ko-KR');
  loadUsageHistory(true);
}

// Firebase 폴링 (5초마다, 입력 중이면 보류)
async function autoLoadFromFB(silent) {
  try {
    const res = await fetch(`${FB_URL}${FB_PATH}/current.json?_=` + Date.now());
    if (!res.ok) { console.warn('[autoLoad] HTTP', res.status); return; }
    const data = await res.json();
    if (!data || !data.savedAt) return;
    const localSavedAt = parseInt(localStorage.getItem('bbq_savedAt') || '0');
    if (data.savedAt <= localSavedAt) return;
    if (localDirty) return; // 로컬에 미저장 변경 있음 → 보호. 저장 후 다시 폴링.
    if (inputFocused) {
      pendingFBData = data;
      return;
    }
    applyFBData(data);
    pushSaveLog('다른 기기 저장 반영', 'sync', data.savedAt);
    if (!silent) toast('동기화 (' + new Date(data.savedAt).toLocaleTimeString('ko-KR') + ')');
  } catch (e) {
    console.error('FB auto-load failed:', e);
  }
}

// 자동저장 (debounce 1초, blur/change 시 즉시)
let autoSaveTimer = null;
let queuedSaveReason = 'auto';
function scheduleAutoSave(reason = 'auto') {
  queuedSaveReason = reason;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => {
    autoSaveTimer = null;
    const reasonToSave = queuedSaveReason || 'auto';
    queuedSaveReason = 'auto';
    saveToFB(reasonToSave);
  }, 1000);
}
function flushAutoSave(reason) {
  const hasPendingTimer = !!autoSaveTimer;
  const explicitRequest = reason != null;
  if (!hasPendingTimer && !explicitRequest) return;
  const reasonToSave = reason || queuedSaveReason || 'auto';
  queuedSaveReason = 'auto';
  if (autoSaveTimer) {
    clearTimeout(autoSaveTimer);
    autoSaveTimer = null;
  }
  saveToFB(reasonToSave);
}

function handleOrderDaysChange() {
  setOrderDaysValue(document.getElementById('orderDays')?.value);
  saveLocal('orderDays');
  renderSalesInputs();
  render();
  flushAutoSave('orderDays');
}

document.getElementById('orderDays').addEventListener('change', handleOrderDaysChange);
document.getElementById('snoozeOverlay')?.addEventListener('click', e => {
  if (e.target.id === 'snoozeOverlay') closeSnoozeDialog();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('snoozeOverlay')?.classList.contains('hidden')) {
    closeSnoozeDialog();
  }
});

// 로컬 복원 (entries 우선, 없으면 옛날 stocks 마이그레이션, 없으면 빈 entries)
try {
  const eRaw = localStorage.getItem('bbq_entries');
  if (eRaw) {
    entries = JSON.parse(eRaw);
    // nextId 재계산
    let maxN = 0;
    entries.forEach(e => { const m = /^e(\d+)$/.exec(e.id||''); if (m) maxN = Math.max(maxN, +m[1]); });
    nextId = maxN + 1;
  } else {
    const sRaw = localStorage.getItem('bbq_stocks');
    let oldStocks = {};
    if (sRaw) try { oldStocks = JSON.parse(sRaw); } catch {}
    entries = MASTER.map(item => ({
      id: newId(),
      name: item.name,
      zone: '',
      stock: oldStocks[item.name] !== undefined ? oldStocks[item.name] : null
    }));
  }
  const o = localStorage.getItem('bbq_overrides'); if (o) overrides = JSON.parse(o);
  const oo = localStorage.getItem(OUTPUT_ORDER_STORAGE_KEY); if (oo) outputOrder = cleanOutputOrder(JSON.parse(oo));
  const ao = localStorage.getItem(ACTUAL_ORDER_STORAGE_KEY);
  const aoDate = localStorage.getItem(ACTUAL_ORDER_DATE_STORAGE_KEY);
  if (ao && aoDate === kstDateKey(Date.now())) actualOrders = cleanActualOrders(JSON.parse(ao));
  const ds = localStorage.getItem('bbq_dailySales'); if (ds) dailySales = JSON.parse(ds);
  const bs = localStorage.getItem('bbq_baseSales');
  const bsv = localStorage.getItem('bbq_baseSalesVersion');
  if (bs && bsv === BASE_SALES_STORAGE_VERSION) baseSales = JSON.parse(bs);
  const dl = localStorage.getItem(DEBUG_LOG_STORAGE_KEY);
  if (dl) debugLogs = JSON.parse(dl).slice(0, DEBUG_LOG_LIMIT);
  const sl = localStorage.getItem(SAVE_LOG_STORAGE_KEY);
  if (sl) {
    const loadedSaveLogs = JSON.parse(sl);
    const oldDebugLogs = loadedSaveLogs.filter(log => isInternalDebugMessage(log.message));
    saveLogs = loadedSaveLogs.filter(log => !isInternalDebugMessage(log.message)).slice(0, SAVE_LOG_LIMIT);
    if (oldDebugLogs.length) {
      debugLogs = oldDebugLogs.concat(debugLogs).slice(0, DEBUG_LOG_LIMIT);
      localStorage.setItem(DEBUG_LOG_STORAGE_KEY, JSON.stringify(debugLogs));
      localStorage.setItem(SAVE_LOG_STORAGE_KEY, JSON.stringify(saveLogs));
    }
  }
} catch {}

// 마이그레이션: MASTER 에서 사라진 이름의 entry/overrides 정리 (구 이름 정합성, 0510 RTDB 키 sanitize 대응)
entries = entries.filter(e => MASTER.some(m => m.name === e.name));
Object.keys(overrides).forEach(k => { if (!MASTER.some(m => m.name === k)) delete overrides[k]; });
actualOrders = cleanActualOrders();

// MASTER에 있는데 entries에 없는 품목 보충 (마스터 갱신 대비)
MASTER.forEach(item => {
  if (!entries.some(e => e.name === item.name)) {
    entries.push({ id: newId(), name: item.name, zone: '', stock: null });
  }
});

// 발주일수 초기값
const rec = recommendedDays();
const sel = document.getElementById('orderDays');
const savedDays = localStorage.getItem('bbq_orderDays');
setOrderDaysValue(savedDays || rec);
document.getElementById('cycleHint').textContent = `${dayName(new Date().getDay())}요일 → 추천 ${rec}일`;

document.getElementById('appVer').textContent = 'v' + APP_VERSION;
bindBaseSalesInput();
renderSalesInputs();
render();
loadUsageHistory(true);
loadSfaOrderStatus(true);
window.addEventListener('resize', updateStickyOffsets);
// 디바이스 간 동기화: 페이지 열 때마다 + 5초 간격 폴링
autoLoadFromFB(true);
setInterval(() => autoLoadFromFB(true), 5000);
setInterval(() => loadUsageHistory(true), 300000);
setInterval(() => loadSfaOrderStatus(false), 10000);
</script>
